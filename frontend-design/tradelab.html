<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f7fb">
<meta name="description" content="Trade-Disk TradeLab — charts, indicators, strategies, backtests and alerts. Synthetic demo data.">
<title>TradeLab · Trade-Disk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   TradeLab (qp) — charts · indicators · strategies · backtests · alerts.
   Synced to design/05-qp: QP.md, CHART.md, LIBRARY.md, STRATEGIES.md, BACKTEST.md.
   Same design system as the Journal: signal-blue accent, graphite ink surfaces,
   Space Grotesk / IBM Plex. Candle green/red is price direction (semantic).
   Every figure is synthetic demo data — never a claim, and no orders are placed.
   ========================================================================== */
:root{
  color-scheme:light;
  --ink:#eef1f7;--panel:#fff;--panel-2:#f5f7fc;--panel-3:#eef2f9;
  --line:#dde4f0;--line-soft:#e9edf5;--line-strong:#cdd6e6;
  --text:#131a26;--text-2:#3e4759;--muted:#5f6a7e;--faint:#8793a7;
  --brand:#2f63e6;--brand-press:#2451c8;--brand-ink:#fff;--brand-soft:#e7eeff;
  --pos:#0f9d6b;--pos-soft:#e3f6ec;--neg:#d2453f;--neg-soft:#fbe9e8;--warn:#b5812a;
  --violet:#7857d6;--teal:#1a94a3;--amber:#c7881f;
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Space Grotesk",var(--sans);
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r-sm:10px;--r-md:14px;--r-lg:20px;
  --sh-1:0 1px 2px #1a2b4a12;--sh-2:0 2px 6px #1a2b4a12,0 12px 26px #1a2b4a14;--sh-3:0 12px 28px #1a2b4a1f,0 40px 70px #1a2b4a1a;
  --sh-brand:0 6px 18px #2f63e62e;--ring:0 0 0 3px #2f63e63a;
  --fs-body:0.9375rem;--fs-sm:0.8125rem;--fs-xs:0.7rem;
  --dur:.18s;--ease:cubic-bezier(.4,0,.2,1);
}
html[data-theme=dark]{
  color-scheme:dark;
  --ink:#0d131f;--panel:#141c2b;--panel-2:#1a2335;--panel-3:#212c41;
  --line:#243149;--line-soft:#1b2436;--line-strong:#32415c;
  --text:#eaeff8;--text-2:#aab6cc;--muted:#7b89a3;--faint:#55637d;
  --brand:#5b8cff;--brand-press:#4a76e0;--brand-ink:#081022;--brand-soft:#14203b;
  --pos:#3ddc97;--pos-soft:#11291f;--neg:#f4707c;--neg-soft:#2c1620;--warn:#e3ad5a;
  --violet:#a78bfa;--teal:#48c9d6;--amber:#e3ad5a;
  --sh-1:0 1px 2px #00000040;--sh-2:0 2px 6px #0000002e,0 10px 26px #0000003a;--sh-3:0 10px 24px #00000045,0 36px 70px #00000055;
  --sh-brand:0 6px 18px #5b8cff33;--ring:0 0 0 3px #5b8cff44;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);font-size:var(--fs-body);-webkit-font-smoothing:antialiased;overflow:hidden}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:6px}

.lab{height:100%;display:flex;flex-direction:column;min-height:0}
/* header */
.lab-top{height:56px;flex:none;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line-soft);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px}
.brandmark{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,var(--brand),#7aa0ff);color:#fff;display:grid;place-items:center;font-weight:800;box-shadow:var(--sh-brand)}
.brand b{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:-.01em}
.brand small{display:block;font-size:8px;letter-spacing:.14em;color:var(--muted);margin-top:1px}
.tohome{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:7px 10px;font-size:var(--fs-xs)}
.tohome:hover{color:var(--text)}
.sym{display:flex;align-items:center;gap:8px;margin-left:6px}
.sym input{width:104px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-weight:700;font-family:var(--mono);text-transform:uppercase}
.tfs{display:flex;gap:2px;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:9px;padding:3px}
.tfs button{border:0;background:none;color:var(--muted);padding:6px 9px;border-radius:6px;font-size:var(--fs-xs);font-family:var(--mono);font-weight:600}
.tfs button.active{background:var(--panel);color:var(--text);box-shadow:var(--sh-1)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.badge-demo{font-size:var(--fs-xs);color:var(--warn);border:1px solid var(--line);background:var(--panel-2);border-radius:99px;padding:4px 10px;display:inline-flex;align-items:center;gap:6px}
.badge-demo::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--warn)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;padding:8px 12px;font-size:var(--fs-sm);font-weight:500;transition:background var(--dur),border-color var(--dur),transform var(--dur)}
.btn:hover{border-color:var(--line-strong);background:var(--panel-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent;font-weight:600;box-shadow:var(--sh-brand)}
.btn.primary:hover{background:var(--brand-press)}
.btn.sm{padding:6px 10px;font-size:var(--fs-xs)}
.btn.on{border-color:var(--brand);color:var(--brand)}
.icon{width:36px;height:36px;border:1px solid var(--line);background:var(--panel);border-radius:9px;display:grid;place-items:center;padding:0}
.icon:hover{background:var(--panel-2)}

/* body: rail + chart + side */
.lab-body{flex:1;display:flex;min-height:0}
.rail{flex:none;width:58px;border-right:1px solid var(--line-soft);background:var(--panel);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0}
.rail button{width:44px;height:44px;border:0;background:none;border-radius:10px;color:var(--muted);display:grid;place-items:center;font-size:17px;position:relative;transition:background var(--dur),color var(--dur)}
.rail button span{position:absolute;bottom:4px;font-size:7px;letter-spacing:.02em}
.rail button:hover{background:var(--panel-2);color:var(--text)}
.rail button.active{background:var(--brand-soft);color:var(--brand)}
.rail button.active::before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}

.chartwrap{flex:1;position:relative;min-width:0;background:var(--panel)}
#base,#ov{position:absolute;inset:0;width:100%;height:100%}
#ov{pointer-events:none}
.chart-legend{position:absolute;left:12px;top:10px;font-family:var(--mono);font-size:var(--fs-xs);color:var(--text);background:color-mix(in srgb,var(--panel) 82%,transparent);border:1px solid var(--line-soft);border-radius:8px;padding:7px 10px;pointer-events:none;max-width:72%;line-height:1.7}
.chart-legend b{font-family:var(--display)}
.chart-legend .up{color:var(--pos)}.chart-legend .down{color:var(--neg)}
.leg-ind{display:inline-flex;align-items:center;gap:5px;margin-right:10px}
.leg-ind i{width:9px;height:3px;border-radius:2px;display:inline-block}
.chart-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:var(--fs-sm)}
.chart-hint{position:absolute;right:12px;bottom:28px;font-size:var(--fs-xs);color:var(--faint)}

/* side panel */
.side{flex:none;width:340px;border-left:1px solid var(--line-soft);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.side-head{padding:15px 18px 12px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;gap:10px}
.side-head h2{font-family:var(--display);font-size:16px;margin:0;font-weight:600}
.side-head p{margin:2px 0 0;color:var(--muted);font-size:var(--fs-xs)}
.side-body{padding:16px 18px;overflow-y:auto;flex:1}
.closeside{display:none}

/* generic controls */
.row{display:flex;gap:9px}
.field{display:grid;gap:5px;margin-bottom:12px}
.field label{font-size:var(--fs-xs);color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.field textarea{resize:vertical;min-height:60px;font-family:var(--mono);font-size:var(--fs-xs)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.secl{font-size:var(--fs-xs);letter-spacing:.04em;color:var(--faint);font-weight:600;margin:16px 0 8px}
.secl:first-child{margin-top:0}
.note{border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 9%,transparent);border-radius:9px;padding:10px 12px;color:var(--text-2);font-size:var(--fs-xs);margin-bottom:14px}
.note b{color:var(--warn)}
.note.info{border-color:color-mix(in srgb,var(--brand) 40%,transparent);background:color-mix(in srgb,var(--brand) 9%,transparent)}
.note.info b{color:var(--brand)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:6px;background:var(--panel-2);font-size:var(--fs-xs);color:var(--muted);font-weight:500}
.tag.ok{color:var(--pos);background:var(--pos-soft)}.tag.warn{color:var(--warn)}.tag.info{color:var(--brand)}.tag.bad{color:var(--neg);background:var(--neg-soft)}

/* indicator list rows */
.indrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.indrow:last-child{border-bottom:0}
.indrow .sw{width:11px;height:11px;border-radius:3px;flex:none}
.indrow .im{flex:1;min-width:0}
.indrow .im b{font-size:var(--fs-sm);font-weight:600}
.indrow .im small{display:block;color:var(--muted);font-size:var(--fs-xs)}
.indrow .x{border:0;background:none;color:var(--faint);font-size:15px;padding:2px 6px}
.indrow .x:hover{color:var(--neg)}

/* rule rows (strategy) */
.rule{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px;border:1px solid var(--line-soft);border-radius:9px;background:var(--panel-2);margin-bottom:8px;font-size:var(--fs-xs)}
.rule .rx{font-family:var(--mono)}
.rule .rt{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:3px 7px;font-size:var(--fs-xs);color:var(--muted)}
.rule .rt:hover{color:var(--brand);border-color:var(--brand)}
.rule.hit{border-color:var(--brand);box-shadow:inset 2px 0 var(--brand)}
/* strategy tree builder: nestable groups + configurable conditions */
.grp{border:1px solid var(--line-soft);border-left:2px solid var(--line);border-radius:10px;background:var(--panel-2);padding:9px;margin:6px 0}
.grp .grp{background:var(--panel);border-left-color:var(--brand)}
.grp.root{border-left:2px solid var(--brand)}
.grph{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.gl{font-family:var(--mono);font-size:var(--fs-xs);font-weight:600;color:var(--brand);background:var(--brand-soft);border-radius:6px;padding:2px 8px;letter-spacing:.02em}
.grph select,.grph input{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:4px 6px;font-size:var(--fs-xs)}
.cond{border:1px solid var(--line-soft);border-radius:9px;background:var(--panel);padding:8px;margin:6px 0;display:grid;gap:6px}
.grp .grp .cond{background:var(--panel-2)}
.oper{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.oper select,.oper input{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:5px 6px;font-size:var(--fs-xs);min-width:0}
.oper .oin{font-family:var(--mono);font-variant-numeric:tabular-nums}
.oper-none{color:var(--faint);font-family:var(--mono);padding-left:4px}
.condop{display:flex;gap:5px;align-items:center}
.condop select{flex:1;background:var(--brand-soft);color:var(--brand);border:1px solid var(--line-soft);border-radius:7px;padding:5px 6px;font-size:var(--fs-xs);font-weight:600}
.condop input{width:52px;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:5px 6px;font-size:var(--fs-xs);font-family:var(--mono)}
.condt{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.condt select,.condt input{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:4px 6px;font-size:var(--fs-xs)}
.condt .tlab{font-size:var(--fs-xs);color:var(--muted)}
.holdlbl{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--muted);white-space:nowrap;cursor:pointer}
.holdlbl input{width:auto;margin:0;accent-color:var(--brand)}
.cx{border:0;background:none;color:var(--faint);font-size:16px;line-height:1;padding:2px 5px;cursor:pointer}
.cx:hover{color:var(--neg)}
.ctest{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:2px 7px;font-size:12px;cursor:pointer}
.ctest:hover{border-color:var(--brand)}
.grpadd{display:flex;gap:6px;align-items:center;margin-top:4px}
.gclose{margin-left:auto;font-family:var(--mono);color:var(--faint)}
.rr2{display:flex;gap:6px}
.rr2 select{flex:1;min-width:0}
.rr2 input{width:72px;flex:0 0 72px}
.leg{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.leg input{width:62px;flex:0 0 62px}
.leg span{font-size:var(--fs-xs);color:var(--muted)}
.logicsel{background:var(--brand-soft);color:var(--brand);border:1px solid var(--line-soft);border-radius:6px;padding:2px 6px;font-size:var(--fs-xs);font-weight:600;margin-left:8px}
.logicpill{display:inline-block;font-family:var(--mono);font-size:var(--fs-xs);color:var(--brand);background:var(--brand-soft);border-radius:6px;padding:2px 7px;margin-bottom:8px}

/* funnel */
.funnel{display:grid;gap:6px}
.frow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:var(--fs-xs)}
.frow .ft{height:7px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.frow .ft span{display:block;height:100%;background:var(--brand);border-radius:99px}
.frow.zero .ft span{background:var(--neg)}

/* stat band */
.stats{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line-soft);border-radius:var(--r-md);overflow:hidden;margin-bottom:14px}
.stats .st{padding:12px 14px;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.stats .st:nth-child(2n){border-right:0}
.st .k{font-size:var(--fs-xs);color:var(--muted)}
.st .v{font-size:19px;font-weight:600;margin-top:5px;font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.positive{color:var(--pos)}.negative{color:var(--neg)}.neutral{color:var(--muted)}

/* mini table */
.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-xs)}
.tbl th{text-align:left;color:var(--muted);font-weight:600;padding:8px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 8px;border-bottom:1px solid var(--line-soft)}
.tbl td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.cl:hover{background:var(--panel-2);cursor:pointer}

/* register cards */
.rcard{display:flex;align-items:center;gap:11px;padding:11px;border:1px solid var(--line-soft);border-radius:11px;background:var(--panel-2);margin-bottom:8px;cursor:pointer;transition:border-color var(--dur),transform var(--dur)}
.rcard:hover{border-color:var(--brand);transform:translateX(2px)}
.rcard .rs{width:38px;height:38px;border-radius:9px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-family:var(--mono);font-weight:700;flex:none}
.rcard .rm{flex:1;min-width:0}
.rcard .rm b{font-size:var(--fs-sm);font-weight:700}
.rcard .rm small{display:block;color:var(--muted);font-size:var(--fs-xs)}
.rcard .rr{text-align:right;font-family:var(--mono);font-size:var(--fs-xs)}

/* equity mini */
.eqmini{width:100%;height:70px;display:block;margin:6px 0 12px}

.toast{position:fixed;bottom:20px;right:20px;z-index:100;background:var(--panel-3);border:1px solid var(--line-strong);color:var(--text);padding:12px 16px;border-radius:10px;box-shadow:var(--sh-3);font-size:var(--fs-sm);max-width:330px;animation:pop .2s var(--ease)}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
.more-sheet{position:absolute;right:12px;top:52px;width:280px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-3);padding:14px;z-index:40}

/* mobile */
@media(max-width:820px){
  .side{position:fixed;inset:56px 0 0 auto;width:min(360px,88%);box-shadow:var(--sh-3);z-index:30;transform:translateX(100%);transition:transform .22s var(--ease)}
  .side.open{transform:none}
  .closeside{display:grid}
  .rail{width:50px}.rail button{width:40px;height:40px}
}
@media(max-width:560px){
  .lab-top{gap:8px;padding:0 10px;height:52px;flex-wrap:nowrap;overflow-x:auto}
  .brand small{display:none}.tohome{display:none}
  .sym input{width:82px}
  .tfs{display:none}
  .badge-demo{display:none}
  .rail{flex-direction:row;width:100%;height:50px;border-right:0;border-top:1px solid var(--line-soft);padding:0;position:fixed;inset:auto 0 0;z-index:25;justify-content:space-around;background:var(--panel)}
  .rail button::before{display:none}
  .lab-body{flex-direction:column}
  .chartwrap{order:1}
  .side{inset:52px 0 50px auto;width:min(360px,92%)}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<div class="lab">
  <header class="lab-top">
    <a class="tohome" href="index.html">← Station</a>
    <div class="brand"><div class="brandmark">▥</div><div><b>TradeLab</b><small>CHARTS · STRATEGIES · BACKTESTS</small></div></div>
    <div class="sym"><input id="symIn" value="NVDA" maxlength="8" aria-label="Symbol" spellcheck="false"></div>
    <div class="tfs" id="tfs"></div>
    <div class="top-r">
      <span class="badge-demo">Demo · no live feed</span>
      <button class="btn sm" id="liveBtn" title="Live re-compute (disabled in demo)">▶ Live</button>
      <button class="icon" id="moreBtn" title="Chart settings" aria-label="More">⚙</button>
      <button class="icon" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">☀</button>
    </div>
  </header>
  <div class="lab-body">
    <nav class="rail" id="rail"></nav>
    <div class="chartwrap" id="chartwrap">
      <canvas id="base"></canvas>
      <canvas id="ov"></canvas>
      <div class="chart-legend" id="legend"></div>
      <div class="chart-hint">scroll to zoom · drag to pan</div>
    </div>
    <aside class="side" id="side"></aside>
  </div>
</div>
<div id="toastroot"></div>
<div id="sheetroot"></div>
<script>
(()=>{'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const fmt=(n,d=2)=>new Intl.NumberFormat('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}).format(Number(n)||0);
const money=n=>(n<0?'−':'')+'$'+fmt(Math.abs(n));
const pct=(n,d=1)=>fmt(n,d)+'%';
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let theme='light';try{theme=localStorage.getItem('td-theme')||'light'}catch{}document.documentElement.dataset.theme=theme;

/* ---------------------------------------------------------- demo bar data */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const TFS=['1m','2m','5m','15m','30m','1h','1d'];
const TF_MIN={'1m':1,'2m':2,'5m':5,'15m':15,'30m':30,'1h':60,'1d':1440};
const SYMS={NVDA:128,AAPL:247,TSLA:449,SPY:668,AMD:170,MSFT:522,META:712,PLTR:176};
function tradingDaysEnding(endStr,count){const out=[];let d=new Date(endStr+'T12:00:00Z');while(out.length<count){const w=d.getUTCDay();if(w!==0&&w!==6)out.push(new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())));d=new Date(d-864e5)}return out.reverse()}
function genTimes(tf,n){ // monotonic, New-York session times ending 2026-10-13
  if(tf==='1d')return tradingDaysEnding('2026-10-13',n).map(d=>new Date(d.getTime()+(16*60+240)*60000));
  const minPer=TF_MIN[tf],per=Math.floor(390/minPer),sessions=Math.ceil(n/per)+1;
  const days=tradingDaysEnding('2026-10-13',sessions),all=[];
  days.forEach(d=>{for(let k=0;k<per;k++){const mins=570+k*minPer;all.push(new Date(d.getTime()+(mins+240)*60000))}});
  return all.slice(all.length-n);
}
function genBars(sym,tf){
  const base=SYMS[sym]||100,rnd=mulberry32(hash(sym+'|'+tf));
  const n=tf==='1d'?260:tf==='1h'?180:220;
  const minPer=TF_MIN[tf],intraday=tf!=='1d';
  const vol=(intraday?0.0016:0.016)*(base<20?1.8:1);
  let price=base*(0.82+rnd()*0.12),drift=(rnd()-0.42)*vol*0.25;
  const bars=[];
  const times=genTimes(tf,n);
  for(let i=0;i<n;i++){
    drift+=(rnd()-0.5)*vol*0.14;drift*=0.93;
    const o=price;const move=(drift+(rnd()-0.5)*vol)*price;let c=o+move;
    const wiggle=Math.abs(move)+rnd()*vol*price*0.8;
    const h=Math.max(o,c)+rnd()*wiggle,l=Math.min(o,c)-rnd()*wiggle;
    price=c;
    const baseVol=(intraday?8e4:6e6)*(base<20?2.5:1);
    const v=Math.round(baseVol*(0.5+rnd()*1.3)*(1+Math.abs(move/price)*40));
    bars.push({t:times[i],o,h:Math.max(h,c,o),l:Math.min(l,c,o),c,v});
  }
  return bars;
}

/* ------------------------------------------------------------- indicators */
const nan=NaN;
function sma(src,len){const o=Array(src.length).fill(nan);let s=0;for(let i=0;i<src.length;i++){s+=src[i];if(i>=len)s-=src[i-len];if(i>=len-1)o[i]=s/len}return o}
function ema(src,len){const o=Array(src.length).fill(nan),k=2/(len+1);let prev=nan;for(let i=0;i<src.length;i++){if(i<len-1)continue;if(Number.isNaN(prev)){let s=0;for(let j=i-len+1;j<=i;j++)s+=src[j];prev=s/len}else prev=src[i]*k+prev*(1-k);o[i]=prev}return o}
function wma(src,len){const o=Array(src.length).fill(nan),den=len*(len+1)/2;for(let i=len-1;i<src.length;i++){let s=0;for(let j=0;j<len;j++)s+=src[i-j]*(len-j);o[i]=s/den}return o}
function vwma(bars,len){const o=Array(bars.length).fill(nan);for(let i=len-1;i<bars.length;i++){let pv=0,vv=0;for(let j=0;j<len;j++){pv+=bars[i-j].c*bars[i-j].v;vv+=bars[i-j].v}o[i]=vv?pv/vv:nan}return o}
function vwapSession(bars){const o=Array(bars.length).fill(nan);let cpv=0,cv=0,day='';for(let i=0;i<bars.length;i++){const d=bars[i].t.toISOString().slice(0,10);if(d!==day){day=d;cpv=0;cv=0}const tp=(bars[i].h+bars[i].l+bars[i].c)/3;cpv+=tp*bars[i].v;cv+=bars[i].v;o[i]=cv?cpv/cv:nan}return o}
function stdev(src,len){const o=Array(src.length).fill(nan);for(let i=len-1;i<src.length;i++){let m=0;for(let j=0;j<len;j++)m+=src[i-j];m/=len;let s=0;for(let j=0;j<len;j++)s+=(src[i-j]-m)**2;o[i]=Math.sqrt(s/len)}return o}
function bb(src,len,mult){const mid=sma(src,len),sd=stdev(src,len),up=[],lo=[];for(let i=0;i<src.length;i++){up[i]=Number.isNaN(mid[i])?nan:mid[i]+mult*sd[i];lo[i]=Number.isNaN(mid[i])?nan:mid[i]-mult*sd[i]}return{mid,up,lo}}
function rsi(src,len){const o=Array(src.length).fill(nan);let ag=0,al=0;for(let i=1;i<src.length;i++){const ch=src[i]-src[i-1],g=Math.max(0,ch),l=Math.max(0,-ch);if(i<=len){ag+=g;al+=l;if(i===len){ag/=len;al/=len;o[i]=100-100/(1+(al?ag/al:100))}}else{ag=(ag*(len-1)+g)/len;al=(al*(len-1)+l)/len;o[i]=100-100/(1+(al?ag/al:100))}}return o}
function atr(bars,len){const tr=bars.map((b,i)=>i===0?b.h-b.l:Math.max(b.h-b.l,Math.abs(b.h-bars[i-1].c),Math.abs(b.l-bars[i-1].c)));return ema(tr,len)}
function rvol(bars,len){const o=Array(bars.length).fill(nan);for(let i=len;i<bars.length;i++){let s=0;for(let j=1;j<=len;j++)s+=bars[i-j].v;const a=s/len;o[i]=a?bars[i].v/a:nan}return o}
const SRC={close:b=>b.map(x=>x.c),open:b=>b.map(x=>x.o),high:b=>b.map(x=>x.h),low:b=>b.map(x=>x.l),hl2:b=>b.map(x=>(x.h+x.l)/2),hlc3:b=>b.map(x=>(x.h+x.l+x.c)/3),ohlc4:b=>b.map(x=>(x.o+x.h+x.l+x.c)/4),volume:b=>b.map(x=>x.v)};

// indicator catalogue the preview can draw (the full library has 71 primitives)
const IND_DEFS={
  sma:{group:'ma',label:'SMA',pane:'price',params:{length:20,source:'close'},calc:(b,p)=>({line:sma(SRC[p.source](b),p.length)})},
  ema:{group:'ma',label:'EMA',pane:'price',params:{length:9,source:'close'},calc:(b,p)=>({line:ema(SRC[p.source](b),p.length)})},
  wma:{group:'ma',label:'WMA',pane:'price',params:{length:20,source:'close'},calc:(b,p)=>({line:wma(SRC[p.source](b),p.length)})},
  vwma:{group:'ma',label:'VWMA',pane:'price',params:{length:20},calc:(b,p)=>({line:vwma(b,p.length)})},
  vwap:{group:'vwap',label:'VWAP (session)',pane:'price',params:{},calc:b=>({line:vwapSession(b)})},
  bb:{group:'volatility',label:'Bollinger Bands',pane:'price',multi:true,params:{length:20,mult:2,source:'close'},calc:(b,p)=>{const r=bb(SRC[p.source](b),p.length,p.mult);return{lines:[r.up,r.mid,r.lo]}}},
  rsi:{group:'osc',label:'RSI',pane:'rsi',params:{length:14,source:'close'},calc:(b,p)=>({line:rsi(SRC[p.source](b),p.length)})}
};
const IND_COLORS=['#2f63e6','#7857d6','#1a94a3','#c7881f','#db2777','#0f9d6b'];

/* --------------------------------------------------------------- state */
let symbol='NVDA',tf='5m',bars=[],series={},active=[],indSeq=0;
let view={start:0,count:120},cross=null,L=null,strat=null,lastRail='chart';
function themeColors(){const s=getComputedStyle(document.documentElement);const g=k=>s.getPropertyValue(k).trim();
  return{pos:g('--pos'),neg:g('--neg'),brand:g('--brand'),violet:g('--violet'),teal:g('--teal'),amber:g('--amber'),line:g('--line-soft'),lineS:g('--line'),muted:g('--muted'),text:g('--text'),panel:g('--panel'),panel2:g('--panel-2'),faint:g('--faint')}}

function loadSymbol(){bars=genBars(symbol,tf);view={start:Math.max(0,bars.length-120),count:Math.min(120,bars.length)};recompute();strat=null;draw()}
function recompute(){series={};active.forEach(a=>{const d=IND_DEFS[a.type];series[a.id]=d.calc(bars,a.params)})}
function addInd(type){const d=IND_DEFS[type];const a={id:'i'+(++indSeq),type,params:{...d.params},color:IND_COLORS[active.length%IND_COLORS.length]};active.push(a);series[a.id]=d.calc(bars,a.params);draw();return a}
function defaultIndicators(){active=[];indSeq=0;addInd('ema');active[0].params.length=9;active[0].color='#2f63e6';addInd('ema');active[1].params.length=21;active[1].color='#7857d6';addInd('vwap');active[2].color='#c7881f';recompute()}

/* ------------------------------------------------------------- chart draw */
const base=$('#base'),ov=$('#ov'),legend=$('#legend');
function sizeCanvas(cv){const w=cv.clientWidth,h=cv.clientHeight,dpr=window.devicePixelRatio||1;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);return{ctx,w,h}}
function niceStep(range,target){const raw=range/target,mag=Math.pow(10,Math.floor(Math.log10(raw)));const n=raw/mag;const s=n<1.5?1:n<3?2:n<7?5:10;return s*mag}
function fmtAxisTime(d,intraday){return intraday?d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'America/New_York'}):d.toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'America/New_York'})}
function draw(){
  if(!bars.length)return;
  const c=themeColors(),{ctx,w:W,h:H}=sizeCanvas(base);sizeCanvas(ov);
  ctx.clearRect(0,0,W,H);
  const padR=60,padL=6,axisH=22,gap=10;
  const rsiOn=active.some(a=>a.type==='rsi');
  const volH=Math.round(H*0.14),rsiH=rsiOn?Math.round(H*0.17):0;
  const priceTop=8,priceH=H-axisH-volH-rsiH-gap-(rsiOn?gap:0)-priceTop;
  const volTop=priceTop+priceH+gap,rsiTop=volTop+volH+(rsiOn?gap:0);
  const plotL=padL,plotR=W-padR,plotW=plotR-plotL;
  const n=view.count,start=clamp(view.start,0,Math.max(0,bars.length-1));
  const vis=bars.slice(start,start+n);if(!vis.length)return;
  const stepX=plotW/vis.length,cw=Math.max(1,Math.min(16,stepX*0.64));
  const xAt=i=>plotL+(i+0.5)*stepX;
  // price range
  let lo=Infinity,hi=-Infinity;vis.forEach(b=>{lo=Math.min(lo,b.l);hi=Math.max(hi,b.h)});
  active.forEach(a=>{if(IND_DEFS[a.type].pane!=='price')return;const s=series[a.id];const arr=s.line?[s.line]:s.lines;arr.forEach(line=>{for(let i=0;i<vis.length;i++){const v=line[start+i];if(Number.isFinite(v)){lo=Math.min(lo,v);hi=Math.max(hi,v)}}})});
  if(strat){strat.trades.forEach(t=>{[t.ei,t.xi].forEach(bi=>{if(bi>=start&&bi<start+n){}});if(Number.isFinite(t.stop)&&t.ei<start+n&&(t.xi??start)>=start){lo=Math.min(lo,t.stop);hi=Math.max(hi,t.target)}})}
  const pad=(hi-lo)*0.06||1;lo-=pad;hi+=pad;const pr=hi-lo;
  const yAt=p=>priceTop+(hi-p)/pr*priceH;
  // grid + price labels
  ctx.font='10px "IBM Plex Mono",monospace';ctx.textBaseline='middle';
  const pstep=niceStep(pr,6);ctx.strokeStyle=c.line;ctx.fillStyle=c.muted;ctx.lineWidth=1;
  for(let p=Math.ceil(lo/pstep)*pstep;p<hi;p+=pstep){const y=yAt(p);ctx.beginPath();ctx.moveTo(plotL,y+.5);ctx.lineTo(plotR,y+.5);ctx.stroke();ctx.textAlign='left';ctx.fillText(fmt(p,p<10?2:p<1000?2:0),plotR+6,y)}
  // session/day separators + time axis
  ctx.textAlign='center';const intraday=tf!=='1d';let lastLabel='';
  const labelStep=Math.max(1,Math.round(vis.length/8));
  vis.forEach((b,i)=>{if(i%labelStep===0){const x=xAt(i);ctx.fillStyle=c.muted;ctx.fillText(fmtAxisTime(b.t,intraday),x,H-axisH/2)}});
  // candles
  vis.forEach((b,i)=>{const up=b.c>=b.o,col=up?c.pos:c.neg,x=xAt(i);
    ctx.strokeStyle=col;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,yAt(b.h));ctx.lineTo(x,yAt(b.l));ctx.stroke();
    const yo=yAt(b.o),yc=yAt(b.c),top=Math.min(yo,yc),hgt=Math.max(1,Math.abs(yc-yo));
    ctx.fillStyle=col;ctx.fillRect(x-cw/2,top,cw,hgt);});
  // price overlays
  active.forEach(a=>{const d=IND_DEFS[a.type];if(d.pane!=='price')return;const s=series[a.id];const lines=s.line?[s.line]:s.lines;
    lines.forEach((line,li)=>{ctx.strokeStyle=a.color;ctx.globalAlpha=d.multi&&li===1?0.55:1;ctx.lineWidth=d.multi?1:1.6;ctx.beginPath();let started=false;
      for(let i=0;i<vis.length;i++){const v=line[start+i];if(!Number.isFinite(v)){started=false;continue}const x=xAt(i),y=yAt(v);if(!started){ctx.moveTo(x,y);started=true}else ctx.lineTo(x,y)}ctx.stroke()});ctx.globalAlpha=1});
  // strategy markers + stop/target
  if(strat){strat.trades.forEach(t=>{
    if(Number.isFinite(t.stop)){const spanL=xAt(Math.max(0,t.ei-start)),spanR=xAt(Math.min(vis.length-1,(t.xi??(start+n))-start));
      if(t.ei<start+n&&(t.xi??(start+n))>=start){ctx.setLineDash([3,4]);ctx.lineWidth=1;
        ctx.strokeStyle=c.neg;ctx.beginPath();ctx.moveTo(spanL,yAt(t.stop));ctx.lineTo(spanR,yAt(t.stop));ctx.stroke();
        ctx.strokeStyle=c.pos;ctx.beginPath();ctx.moveTo(spanL,yAt(t.target));ctx.lineTo(spanR,yAt(t.target));ctx.stroke();ctx.setLineDash([])}}
    const e=t.ei-start;if(e>=0&&e<vis.length){const x=xAt(e),y=yAt(bars[t.ei].l)+12;ctx.fillStyle=c.brand;ctx.beginPath();ctx.moveTo(x,y-9);ctx.lineTo(x-5,y);ctx.lineTo(x+5,y);ctx.closePath();ctx.fill()}
    const xi=t.xi;if(xi!=null){const xo=xi-start;if(xo>=0&&xo<vis.length){const x=xAt(xo),y=yAt(bars[xi].h)-12;ctx.fillStyle=t.pnl>=0?c.pos:c.neg;ctx.beginPath();ctx.moveTo(x,y+9);ctx.lineTo(x-5,y);ctx.lineTo(x+5,y);ctx.closePath();ctx.fill()}}
  })}
  // volume pane
  let mv=0;vis.forEach(b=>mv=Math.max(mv,b.v));
  ctx.fillStyle=c.muted;ctx.textAlign='right';ctx.fillText('Vol',plotR+6,volTop+8);
  vis.forEach((b,i)=>{const up=b.c>=b.o,x=xAt(i),bh=mv?b.v/mv*(volH-6):0;ctx.fillStyle=(up?c.pos:c.neg);ctx.globalAlpha=0.5;ctx.fillRect(x-cw/2,volTop+volH-bh,cw,bh);ctx.globalAlpha=1});
  // rsi pane
  if(rsiOn){const ri=active.find(a=>a.type==='rsi'),line=series[ri.id].line;
    ctx.strokeStyle=c.line;ctx.fillStyle=c.muted;ctx.textAlign='left';
    [30,50,70].forEach(lv=>{const y=rsiTop+(100-lv)/100*rsiH;ctx.setLineDash(lv===50?[2,4]:[]);ctx.strokeStyle=c.line;ctx.beginPath();ctx.moveTo(plotL,y+.5);ctx.lineTo(plotR,y+.5);ctx.stroke();ctx.fillStyle=c.faint;ctx.textAlign='left';ctx.fillText(lv,plotR+6,y)});ctx.setLineDash([]);
    ctx.strokeStyle=ri.color;ctx.lineWidth=1.4;ctx.beginPath();let started=false;for(let i=0;i<vis.length;i++){const v=line[start+i];if(!Number.isFinite(v)){started=false;continue}const x=xAt(i),y=rsiTop+(100-v)/100*rsiH;if(!started){ctx.moveTo(x,y);started=true}else ctx.lineTo(x,y)}ctx.stroke();
    ctx.fillStyle=c.muted;ctx.textAlign='right';ctx.fillText('RSI '+ri.params.length,plotR+6,rsiTop+8)}
  L={plotL,plotR,stepX,priceTop,priceH,lo,hi,volTop,volH,rsiTop,rsiH,n:vis.length,start,vis,W,H,padR,yAt:p=>priceTop+(hi-p)/pr*priceH};
  drawLegend(cross==null?vis.length-1:cross);
}
function drawLegend(idx){
  if(!L)return;const b=L.vis[idx];if(!b)return;const gi=L.start+idx,c=themeColors();
  const up=b.c>=b.o,ch=((b.c-b.o)/b.o*100);
  let html='<b>'+safe(symbol)+'</b> <span class="'+(up?'up':'down')+'">'+fmt(b.c,b.c<10?3:2)+'</span> <span class="'+(up?'up':'down')+'">'+(ch>=0?'+':'')+fmt(ch,2)+'%</span><br>';
  html+='<span class="num" style="color:var(--muted)">O '+fmt(b.o,2)+'  H '+fmt(b.h,2)+'  L '+fmt(b.l,2)+'  V '+(b.v>1e6?fmt(b.v/1e6,1)+'M':fmt(b.v/1e3,0)+'K')+'</span>';
  const inds=active.filter(a=>IND_DEFS[a.type].pane==='price'||a.type==='rsi');
  if(inds.length){html+='<br>';inds.forEach(a=>{const s=series[a.id],line=s.line||(s.lines&&s.lines[1]);const v=line?line[gi]:nan;const lbl=IND_DEFS[a.type].label+(a.params.length?' '+a.params.length:'');html+='<span class="leg-ind"><i style="background:'+a.color+'"></i>'+safe(lbl)+' '+(Number.isFinite(v)?fmt(v,2):'—')+'</span>'})}
  legend.innerHTML=html;
}
function drawCross(mx,my){
  const octx=ov.getContext('2d');const dpr=window.devicePixelRatio||1;octx.setTransform(dpr,0,0,dpr,0,0);octx.clearRect(0,0,ov.clientWidth,ov.clientHeight);
  if(mx==null||!L){cross=null;drawLegend(L?L.n-1:0);return}
  const idx=clamp(Math.round((mx-L.plotL)/L.stepX-0.5),0,L.n-1);cross=idx;const x=L.plotL+(idx+0.5)*L.stepX;const c=themeColors();
  octx.strokeStyle=c.muted;octx.globalAlpha=.5;octx.setLineDash([3,3]);octx.lineWidth=1;
  octx.beginPath();octx.moveTo(x,L.priceTop);octx.lineTo(x,L.H-22);octx.stroke();
  if(my>=L.priceTop&&my<=L.priceTop+L.priceH){octx.beginPath();octx.moveTo(L.plotL,my);octx.lineTo(L.plotR,my);octx.stroke();
    const price=L.hi-(my-L.priceTop)/L.priceH*(L.hi-L.lo);octx.setLineDash([]);octx.globalAlpha=1;octx.fillStyle=c.text;octx.fillRect(L.plotR,my-9,L.padR,18);octx.fillStyle=c.panel;octx.font='10px "IBM Plex Mono",monospace';octx.textAlign='center';octx.textBaseline='middle';octx.fillText(fmt(price,2),L.plotR+L.padR/2,my)}
  octx.globalAlpha=1;octx.setLineDash([]);drawLegend(idx);

/* ===================== strategy: a nestable rule tree + engine ===========
   Operands: Price · Indicator (type+length+source+sub) · Value · Time, each
   with an offset (bars ago) and optional hold (carry-forward). 14 operators.
   Groups nest to any depth: ALL / ANY / AT LEAST k / IN SEQUENCE. Rich risk. */
const SRCS=['close','open','high','low','hl2','hlc3','ohlc4','volume'];
const IND_META={ema:{len:9,src:1},sma:{len:20,src:1},wma:{len:20,src:1},vwma:{len:20},vwap:{},rsi:{len:14,src:1},bb:{len:20,src:1,sub:1},rvol:{len:20},atr:{len:14},stdev:{len:20,src:1}};
const IND_LABELS={ema:'EMA',sma:'SMA',wma:'WMA',vwma:'VWMA',vwap:'VWAP',rsi:'RSI',bb:'Bollinger',rvol:'RVOL',atr:'ATR',stdev:'StdDev'};
const OPS=[['gt','>'],['lt','<'],['ge','≥'],['le','≤'],['gt_pct','above by ≥%'],['lt_pct','below by ≥%'],['cross_above','crosses ▲'],['cross_below','crosses ▼'],['bounce_up','bounces ▲ off'],['bounce_down','bounces ▼ off'],['rising','rising'],['falling','falling'],['eq','='],['neq','≠']];
const OP_SYM=Object.fromEntries(OPS);
const LOGIC_LBL={ALL:'ALL match',ANY:'ANY match',ATLEAST:'AT LEAST k',SEQ:'IN SEQUENCE'};
const TIMINGS=[['none','hold —'],['for','held for'],['within','within']];
const noRight=op=>op==='rising'||op==='falling';
function nyHM(d){const s=d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'America/New_York'});const[h,m]=s.split(':').map(Number);return{h,m}}
function timeSeries(b,field){return b.map(x=>{const p=nyHM(x.t);return field==='minutes'?p.h*60+p.m:field==='hour'?p.h:field==='minute'?p.m:p.h*100+p.m})}
function indSeriesOf(op,b){const src=op.source?SRC[op.source](b):SRC.close(b);switch(op.ind){
  case'ema':return ema(src,op.length);case'sma':return sma(src,op.length);case'wma':return wma(src,op.length);
  case'vwma':return vwma(b,op.length);case'vwap':return vwapSession(b);case'rsi':return rsi(src,op.length);
  case'rvol':return rvol(b,op.length);case'atr':return atr(b,op.length);case'stdev':return stdev(src,op.length);
  case'bb':{const r=bb(src,op.length,2);return op.sub==='lo'?r.lo:op.sub==='mid'?r.mid:r.up}}return null}
function fwd(a){let last=NaN;return a.map(v=>{if(Number.isFinite(v)){last=v;return v}return last})}
function opSig(op){return [op.kind,op.src,op.ind,op.length,op.source,op.sub,op.field,op.hold?'H':''].join('|')}
function opBase(op,b,cache){if(op.kind==='value')return null;const sig=opSig(op);if(sig in cache)return cache[sig];
  let s=op.kind==='price'?SRC[op.src](b):op.kind==='time'?timeSeries(b,op.field):indSeriesOf(op,b);
  if(op.hold&&s)s=fwd(s);cache[sig]=s;return s}
const gvOp=(op,series,i)=>{if(op.kind==='value')return Number(op.value);const idx=i-(op.offset||0);return (series&&idx>=0)?series[idx]:NaN};
function condTruth(cond,b,cache){const Ls=opBase(cond.left,b,cache),Rs=noRight(cond.op)?null:opBase(cond.right,b,cache),n=b.length,out=new Array(n).fill(false);
  for(let i=0;i<n;i++){const L=gvOp(cond.left,Ls,i);
    if(cond.op==='rising'||cond.op==='falling'){const Lp=gvOp(cond.left,Ls,i-12);if(Number.isFinite(L)&&Number.isFinite(Lp))out[i]=cond.op==='rising'?L>Lp:L<Lp;continue}
    const R=gvOp(cond.right,Rs,i);if(!Number.isFinite(L)||!Number.isFinite(R))continue;
    if(cond.op==='cross_above'||cond.op==='cross_below'){const Lp=gvOp(cond.left,Ls,i-1),Rp=gvOp(cond.right,Rs,i-1);if(Number.isFinite(Lp)&&Number.isFinite(Rp))out[i]=cond.op==='cross_above'?(L>R&&Lp<=Rp):(L<R&&Lp>=Rp);continue}
    if(cond.op==='bounce_up'||cond.op==='bounce_down'){const tol=(cond.tol??0.15)/100*Math.abs(R),bar=b[i],rng=(bar.h-bar.l)||1e-9;
      out[i]=cond.op==='bounce_up'?(bar.l<=R+tol&&bar.l>=R-tol*4&&bar.c>R&&(bar.c-bar.l)/rng>=0.4):(bar.h>=R-tol&&bar.h<=R+tol*4&&bar.c<R&&(bar.h-bar.c)/rng>=0.4);continue}
    const pct=cond.pct??0.1;
    switch(cond.op){case'gt':out[i]=L>R;break;case'lt':out[i]=L<R;break;case'ge':out[i]=L>=R;break;case'le':out[i]=L<=R;break;
      case'gt_pct':out[i]=R!==0&&(L-R)/Math.abs(R)*100>=pct;break;case'lt_pct':out[i]=R!==0&&(R-L)/Math.abs(R)*100>=pct;break;
      case'eq':out[i]=Math.abs(L-R)<1e-9;break;case'neq':out[i]=Math.abs(L-R)>=1e-9;break}}
  if((cond.timing==='for'||cond.timing==='within')&&cond.tn>0){const o2=new Array(n).fill(false),w=cond.tn;
    for(let i=0;i<n;i++){let res=cond.timing==='for';for(let k=0;k<w;k++){const j=i-k;if(j<0){if(cond.timing==='for')res=false;break}if(cond.timing==='for'){if(!out[j]){res=false;break}}else if(out[j]){res=true;break}}o2[i]=res}return o2}
  return out}
function compileNode(node,b,cache){if(node.type==='cond')return condTruth(node,b,cache);
  const kids=(node.items||[]).map(it=>compileNode(it,b,cache)),n=b.length,out=new Array(n).fill(false),lg=node.logic;
  if(lg==='ALL'){for(let i=0;i<n;i++)out[i]=kids.length>0&&kids.every(k=>k[i])}
  else if(lg==='ANY'){for(let i=0;i<n;i++)out[i]=kids.some(k=>k[i])}
  else if(lg==='ATLEAST'){const kk=node.k||2;for(let i=0;i<n;i++)out[i]=kids.filter(k=>k[i]).length>=kk}
  else if(lg==='SEQ'){const w=node.window||10;let si=0,anchor=-1;for(let i=0;i<n;i++){if(si<kids.length&&kids[si][i]&&(si===0||i-anchor<=w)){anchor=i;si++;if(si===kids.length){out[i]=true;si=0;anchor=-1}}else if(si>0&&i-anchor>w){si=0;anchor=-1;if(kids[0]&&kids[0][i]){anchor=i;si=1}}}}
  return out}

function evalUserStrategy(def,b){
  const cache={},entryT=compileNode(def.entry,b,cache),exitT=compileNode(def.exit,b,cache),atrArr=atr(b,14),long=def.side!=='short',n=b.length;
  const funnel=(def.entry.items||[]).map(it=>{const t=compileNode(it,b,cache);let c=0;for(let i=0;i<n;i++)if(t[i])c++;return c});
  const intraday=n>1&&(b[1].t-b[0].t)<20*3600*1000,dk=t=>t.toISOString().slice(0,10);
  const inWin=i=>{if(!def.winStart&&!def.winEnd)return true;const p=nyHM(b[i].t),hhmm=p.h*100+p.m,ws=def.winStart?+def.winStart:0,we=def.winEnd?+def.winEnd:2400;return hhmm>=ws&&hhmm<=we};
  const trades=[];let pos=null,lastExit=-1e9;const perDay={};
  for(let i=1;i<n;i++){const day=dk(b[i].t);
    if(!pos){const edge=entryT[i]&&!entryT[i-1],okD=(i-lastExit)>(def.cooldown||0)&&((def.maxPerDay||0)<=0||(perDay[day]||0)<def.maxPerDay);
      if(edge&&inWin(i)&&okD&&i+1<n){const e=b[i+1].o;
        const stopD=def.slType==='off'?null:def.slType==='pct'?e*def.slVal/100:def.slType==='atr'?(atrArr[i]||e*0.01)*def.slVal:def.slVal;
        const risk=stopD||e*0.01;let legs=[];
        if(def.targets&&def.targets.length)legs=def.targets.map(l=>({frac:l.fraction,price:long?e+risk*l.rMult:e-risk*l.rMult,hit:false}));
        else{const tgtD=def.tpType==='off'?null:def.tpType==='pct'?e*def.tpVal/100:def.tpType==='rr'?risk*def.tpVal:def.tpVal;if(tgtD!=null)legs=[{frac:1,price:long?e+tgtD:e-tgtD,hit:false}]}
        pos={ei:i+1,entry:e,stop:stopD==null?null:(long?e-stopD:e+stopD),target:legs.length?legs[0].price:(long?e*1.03:e*0.97),legs,remaining:1,realized:0,day};
        perDay[day]=(perDay[day]||0)+1}}
    else{const bar=b[i],held=i-pos.ei,pA=px=>(long?px-pos.entry:pos.entry-px)/pos.entry*100;let closed=false,reason=null;
      if(pos.stop!=null&&(long?bar.l<=pos.stop:bar.h>=pos.stop)){pos.realized+=pos.remaining*pA(pos.stop);reason='SL';closed=true}
      else{for(const leg of pos.legs)if(!leg.hit&&(long?bar.h>=leg.price:bar.l<=leg.price)){pos.realized+=leg.frac*pA(leg.price);leg.hit=true;pos.remaining-=leg.frac}
        if(pos.remaining<=1e-9){reason='TP';closed=true}
        else if(held>=(def.minHold||0)&&exitT[i]){pos.realized+=pos.remaining*pA(bar.c);reason='exit';closed=true}
        else if(intraday&&(i+1>=n||dk(b[i+1].t)!==pos.day)){pos.realized+=pos.remaining*pA(bar.c);reason='eod';closed=true}}
      if(closed){trades.push({ei:pos.ei,entry:pos.entry,stop:pos.stop,target:pos.target,xi:i,exit:bar.c,reason,pnl:pos.realized});lastExit=i;pos=null}}}
  if(pos){const last=n-1,pA=px=>(long?px-pos.entry:pos.entry-px)/pos.entry*100;trades.push({ei:pos.ei,entry:pos.entry,stop:pos.stop,target:pos.target,xi:null,exit:b[last].c,reason:'open',pnl:pos.realized+pos.remaining*pA(b[last].c)})}
  return{trades,funnel,bars:n};
}
function evalStrategy(b){return evalUserStrategy(stratDef,b||bars)}

function runBacktest(opts){
  const universe=opts.universe,res=[];
  universe.forEach(sym=>{const b=genBars(sym,opts.tf);const r=evalStrategy(b);r.trades.forEach(t=>res.push({...t,symbol:sym,b}))});
  const closed=res.filter(t=>t.reason!=='open');
  // costs: cost_bps per side (round trip twice)
  const costBps=opts.costBps||0;
  closed.forEach(t=>{t.net=t.pnl-costBps/100*2});
  const wins=closed.filter(t=>t.net>0),loss=closed.filter(t=>t.net<0);
  const sum=closed.reduce((a,t)=>a+t.net,0),gw=wins.reduce((a,t)=>a+t.net,0),gl=Math.abs(loss.reduce((a,t)=>a+t.net,0));
  // equity in R-ish unit % ; max dd
  let eq=0,peak=0,mdd=0;const curve=[];closed.forEach(t=>{eq+=t.net;peak=Math.max(peak,eq);mdd=Math.max(mdd,peak-eq);curve.push(eq)});
  const rs=closed.map(t=>t.net/1.5);// R ~ net% / stop% (1.5)
  return{trades:res,closed,open:res.filter(t=>t.reason==='open').length,
    n:closed.length,wins:wins.length,loss:loss.length,be:closed.filter(t=>t.net===0).length,
    winRate:closed.length?wins.length/closed.length*100:0,pf:gl?gw/gl:null,
    expect:closed.length?sum/closed.length:0,net:sum,avgWin:wins.length?gw/wins.length:0,avgLoss:loss.length?gl/loss.length:0,
    avgR:rs.length?rs.reduce((a,b)=>a+b,0)/rs.length:0,mdd,curve,
    coverage:universe.length};
}

    h+='<div class="secl">Risk</div>';
    const rt=(cur,arr)=>arr.map(t=>'<option'+(cur===t?' selected':'')+'>'+t+'</option>').join('');
    h+=two(field('Stop','<div class="rr2"><select id="slType">'+rt(s.slType,['off','pct','atr','points'])+'</select><input id="slVal" class="num" value="'+s.slVal+'"></div>'),field('Target','<div class="rr2"><select id="tpType">'+rt(s.tpType,['off','pct','rr','points'])+'</select><input id="tpVal" class="num" value="'+s.tpVal+'"></div>'));
    h+='<div class="field"><label>Scale-out targets <small style="color:var(--muted);font-weight:400">fraction @ R-multiple</small></label><div id="legs">'+(s.targets||[]).map((l,i)=>'<div class="leg" data-li="'+i+'"><input class="num" data-lf="fraction" value="'+l.fraction+'"><span>at</span><input class="num" data-lf="rMult" value="'+l.rMult+'"><span>R</span><button class="cx" data-delleg="'+i+'" title="remove">×</button></div>').join('')+'</div><button class="btn sm" id="addLeg">+ target</button></div>';
    h+=two(field('Window start <small style="color:var(--muted);font-weight:400">NY hhmm</small>','<input id="winStart" class="num" value="'+(s.winStart||'')+'" placeholder="935">'),field('Window end','<input id="winEnd" class="num" value="'+(s.winEnd||'')+'" placeholder="1550">'));
    h+=two(field('Cooldown bars','<input id="cooldown" class="num" value="'+(s.cooldown||0)+'">'),field('Max per day <small style="color:var(--muted);font-weight:400">0=∞</small>','<input id="maxPerDay" class="num" value="'+(s.maxPerDay||0)+'">'));
    h+=field('Min hold (bars)','<input id="minHold" class="num" value="'+(s.minHold||0)+'">');
    h+='<div class="row"><button class="btn primary" id="evalBtn" style="flex:1">▶ Evaluate</button><button class="btn" id="saveStrat">Save</button><button class="btn" id="newStrat">New</button></div>';
    h+='<div id="stratResult">'+(strat?stratResultHtml():'')+'</div>';
    return h},
  backtest:()=>{let h=head('Backtest','Replay the strategy, honestly');
    h+='<div class="note"><b>Honest by default.</b> As-of each day, the watchlist gate, the <b>desk</b> fill (next open, levels from the decision close), costs, and open-at-end kept out of the win rate.</div>';
    h+='<div class="field"><label>Strategy</label><select><option>'+safe(stratDef.name)+'</option></select></div>';
    h+='<div class="two"><div class="field"><label>Universe</label><select id="btUni"><option value="register">Radar R1 (6 names)</option><option value="current">This symbol only</option></select></div><div class="field"><label>Timeframe</label><select id="btTf"><option>5m</option><option>15m</option><option>1h</option></select></div></div>';
    h+='<div class="two"><div class="field"><label>Fill model</label><select><option>desk (default)</option><option>close</option><option>next_open</option></select></div><div class="field"><label>Costs (bps/side)</label><input id="btCost" class="num" value="2"></div></div>';
    h+='<div class="field"><label>Accounting</label><select><option>unit — per-trade %</option><option>account — real money</option><option>TTP — prop firm</option><option>challenge</option></select></div>';
    h+='<label class="tag" style="margin-bottom:12px"><input type="checkbox" checked style="margin-right:6px">CANSLIM gate (as-of the day)</label> ';
    h+='<button class="btn primary" id="runBtBtn" style="width:100%">Run backtest</button>';
    h+='<div id="btResult"></div>';
    return h},
  register:()=>{let h=head('Register browser','What the screeners found, by day');
    h+='<div class="two"><div class="field"><label>Source</label><select><option>Radar · R1</option><option>Radar · Shortlist</option><option>All tools merged</option></select></div><div class="field"><label>Date</label><input type="date" value="2026-10-13"></div></div>';
    h+='<div class="note info">Reads the shared record <b>as of a day</b> — a stopped tool\'s history is still served. Tap a card to load that ticker on that day.</div>';
    h+=REGISTER.map(r=>'<div class="rcard" data-loadsym="'+r.sym+'"><div class="rs">'+r.score+'</div><div class="rm"><b>'+r.sym+'</b><small>'+r.regime+' · '+r.sector+'</small></div><div class="rr"><div class="'+(r.gap>=0?'positive':'negative')+'">gap '+(r.gap>=0?'+':'')+r.gap+'%</div><div style="color:var(--muted)">RVOL '+r.rvol+'</div></div></div>').join('');
    return h},
  alerts:()=>{let h=head('Signal alerts','Saved strategies firing on today\'s lists');
    h+='<div class="note info">One cycle each time the desk\'s scheduler starts it; one alert per strategy, symbol and bar; history kept so a restart never repeats. New signals are pushed to your phone.</div>';
    h+='<div class="secl">Watching</div>';
    h+=[['EMA-9 pullback + trend','Radar R1','2 firing'],['OR + VWAP 09:35','Radar R1','0 firing'],['PM Breakout','Radar Shortlist','1 firing']].map(([n,u,f])=>'<div class="indrow"><div class="im"><b>'+n+'</b><small>'+u+'</small></div><span class="tag '+(f[0]==='0'?'':'ok')+'">'+f+'</span></div>').join('');
    h+='<div class="secl">Would fire now (demo)</div>';
    h+='<table class="tbl"><tbody>'+[['NVDA','EMA-9 pullback + trend','5m','14:35'],['PLTR','PM Breakout','1m','09:41']].map(r=>'<tr class="cl" data-loadsym="'+r[0]+'"><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td class="n">'+r[2]+'</td><td class="n">'+r[3]+'</td></tr>').join('')+'</tbody></table>';
    return h},
  print:()=>{let h=head('Print sheets','Review a day\'s charts, with the numbers');
    h+='<div class="note">Each sheet is a self-contained page, so the browser\'s own print works. Stops at <b>150 charts</b> so an afternoon of printing never fills the disk.</div>';
    h+=[['Day-trade sheet','One chart per ticker over full extended hours (04:00–20:00 ET), your timeframe and indicators.'],['Swing sheet','One daily chart per ticker — a year before the day it was found, that day marked, every session since.'],['The numbers (CSV)','One row per bar: day, symbol, time, session, OHLCV and one column per indicator.'],['The cards (CSV)','Every column the screener froze that morning — score, RVOL, gap, ATR, regime, sector, catalyst.']].map(([t,d])=>'<div class="indrow"><div class="im"><b>'+t+'</b><small>'+d+'</small></div><button class="btn sm" data-demo="Prototype: the full tool renders this print sheet from the shared record and bar feeds.">Open</button></div>').join('');
    return h}
};
function headMk(t,d){return '<div class="side-head"><div><h2>'+t+'</h2><p>'+d+'</p></div><button class="icon closeside" data-closeside aria-label="Close">×</button></div>'}
function head(t,d){return headMk(t,d)+'<div class="side-body">'}
function field(l,c){return '<div class="field"><label>'+l+'</label>'+c+'</div>'}
function two(a,b){return '<div class="two">'+a+b+'</div>'}
function rule(txt,id){return '<div class="rule" data-rule="'+id+'"><span class="rx">'+txt+'</span><button class="rt" data-testrule="'+id+'">🔍 test</button></div>'}

function bindPanel(k){
  if(k==='indicators'){$('#addIndBtn')&&($('#addIndBtn').onclick=()=>{const t=$('#indPick').value,len=parseInt($('#indLen').value)||IND_DEFS[t].params.length,src=$('#indSrc').value;const a=addInd(t);if('length'in a.params)a.params.length=len;if('source'in a.params)a.params.source=src;series[a.id]=IND_DEFS[t].calc(bars,a.params);draw();openPanel('indicators')});
    $$('[data-rmind]').forEach(b=>b.onclick=()=>{active=active.filter(x=>x.id!==b.dataset.rmind);draw();openPanel('indicators')});}
  if(k==='strategy'){
    const re=()=>openPanel('strategy');
    const touch=()=>{strat=null;draw();const rz=$('#stratResult');if(rz)rz.innerHTML='<p class="note" style="margin-top:12px">Edited — click ▶ Evaluate to refresh the markers.</p>'};
    const bindV=(id,fn,ev)=>{const el=$('#'+id);if(el)el[ev||'onchange']=e=>fn(e.target.value)};
    $('#evalBtn')&&($('#evalBtn').onclick=runStrategyOnChart);
    bindV('sName',v=>{stratDef.name=v},'oninput');bindV('sTools',v=>{stratDef.tools=v},'oninput');
    bindV('sSide',v=>{stratDef.side=v;touch()});bindV('sStage',v=>{stratDef.stage=v});
    bindV('slType',v=>{stratDef.slType=v;touch()});bindV('slVal',v=>{stratDef.slVal=parseFloat(v)||0;touch()},'oninput');
    bindV('tpType',v=>{stratDef.tpType=v;touch()});bindV('tpVal',v=>{stratDef.tpVal=parseFloat(v)||0;touch()},'oninput');
    bindV('winStart',v=>{stratDef.winStart=v.trim();touch()},'oninput');bindV('winEnd',v=>{stratDef.winEnd=v.trim();touch()},'oninput');
    bindV('cooldown',v=>{stratDef.cooldown=parseInt(v)||0;touch()},'oninput');bindV('maxPerDay',v=>{stratDef.maxPerDay=parseInt(v)||0;touch()},'oninput');
    bindV('minHold',v=>{stratDef.minHold=parseInt(v)||0;touch()},'oninput');
    /* scale-out legs */
    $('#addLeg')&&($('#addLeg').onclick=()=>{(stratDef.targets=stratDef.targets||[]).push({fraction:0.5,rMult:2});re()});
    $$('[data-delleg]').forEach(b=>b.onclick=()=>{stratDef.targets.splice(+b.dataset.delleg,1);re()});
    $$('#legs .leg').forEach(row=>{const li=+row.dataset.li;row.querySelectorAll('[data-lf]').forEach(inp=>inp.oninput=()=>{if(stratDef.targets[li])stratDef.targets[li][inp.dataset.lf]=parseFloat(inp.value)||0;touch()})});
    /* group fields: logic / k / window */
    $$('[data-gf]').forEach(ctrl=>{const n=NID[ctrl.dataset.nid],f=ctrl.dataset.gf;if(!n)return;
      if(f==='logic')ctrl.onchange=()=>{n.logic=ctrl.value;re()};
      else ctrl.oninput=()=>{n[f]=parseInt(ctrl.value)||(f==='k'?2:10);touch()}});
    /* condition fields: op / timing / tn / pct / tol */
    $$('[data-cf]').forEach(ctrl=>{const c=NID[ctrl.dataset.nid],f=ctrl.dataset.cf;if(!c)return;
      if(f==='op'||f==='timing')ctrl.onchange=()=>{c[f]=ctrl.value;re()};
      else ctrl.oninput=()=>{c[f]=f==='tn'?(parseInt(ctrl.value)||0):parseFloat(ctrl.value);touch()}});
    /* operand fields: kind / ind / length / source / sub / field / value / offset / hold */
    $$('.oper[data-nid]').forEach(opEl=>{const c=NID[opEl.dataset.nid],side=opEl.dataset.side;if(!c)return;const op=()=>c[side];
      opEl.querySelectorAll('[data-of]').forEach(ctrl=>{const f=ctrl.dataset.of;
        if(f==='kind')ctrl.onchange=()=>{c[side]=defOperand(ctrl.value);re()};
        else if(f==='ind')ctrl.onchange=()=>{op().ind=ctrl.value;re()};
        else if(f==='hold')ctrl.onchange=()=>{op().hold=ctrl.checked;touch()};
        else if(f==='length'||f==='offset'||f==='value')ctrl.oninput=()=>{op()[f]=parseFloat(ctrl.value)||0;touch()};
        else ctrl.onchange=()=>{op()[f]=ctrl.value;touch()}})});
    /* add / remove nodes */
    $$('[data-addc]').forEach(b=>b.onclick=()=>{const n=NID[b.dataset.addc];if(n){(n.items=n.items||[]).push(defCond());re()}});
    $$('[data-addg]').forEach(b=>b.onclick=()=>{const n=NID[b.dataset.addg];if(n){(n.items=n.items||[]).push(defGroup('ANY'));re()}});
    $$('[data-delid]').forEach(b=>b.onclick=()=>{const id=b.dataset.delid,node=NID[id],parent=PARENT[id];if(parent&&node){const i=parent.indexOf(node);if(i>=0)parent.splice(i,1);touch();re()}});
    /* test one condition on the current chart */
    $$('[data-testc]').forEach(b=>b.onclick=()=>{const c=NID[b.dataset.testc];if(!c)return;const t=compileNode(c,bars,{});let n=0;for(let i=0;i<t.length;i++)if(t[i])n++;toast(describeCond(c)+' — true on '+n+' of '+bars.length+' bars')});
    /* save / new / load */
    $('#saveStrat')&&($('#saveStrat').onclick=()=>{savedStrats=savedStrats.filter(x=>x.name!==stratDef.name);savedStrats.push(JSON.parse(JSON.stringify(stratDef)));try{localStorage.setItem('td-strats',JSON.stringify(savedStrats))}catch{}toast('Strategy “'+stratDef.name+'” saved.');re()});
    $('#newStrat')&&($('#newStrat').onclick=()=>{stratDef=freshStrat();strat=null;draw();re();toast('New strategy — build it up')});
    $('#loadStrat')&&($('#loadStrat').onchange=e=>{if(e.target.value!==''){stratDef=JSON.parse(JSON.stringify(savedStrats[+e.target.value]));strat=null;draw();re();toast('Loaded “'+stratDef.name+'”')}});
  }
  if(k==='chart'){$('#fitBtn')&&($('#fitBtn').onclick=()=>{view={start:0,count:bars.length};draw();});}
  if(k==='backtest'){$('#runBtBtn')&&($('#runBtBtn').onclick=()=>{
    const uni=$('#btUni').value==='current'?[symbol]:REGISTER.map(r=>r.sym);const btf=$('#btTf').value;const cost=parseFloat($('#btCost').value)||0;
    const r=runBacktest({universe:uni,tf:btf,costBps:cost});renderBtResult(r);});}
  $$('[data-loadsym]').forEach(b=>b.onclick=()=>{symbol=b.dataset.loadsym;$('#symIn').value=symbol;loadSymbol();toast('Loaded '+symbol+' · '+tf);});
  $$('[data-demo]').forEach(b=>b.onclick=()=>toast(b.dataset.demo));
  const cs=$('[data-closeside]');if(cs)cs.onclick=()=>$('#side').classList.remove('open');
}
function renderBtResult(r){
  const el=$('#btResult');if(!el)return;
  let h='<div class="secl">Report · '+r.coverage+' names · unit %</div>';
  h+='<div class="stats"><div class="st"><div class="k">Trades</div><div class="v">'+r.n+'</div></div><div class="st"><div class="k">Win rate</div><div class="v">'+pct(r.winRate)+'</div></div><div class="st"><div class="k">Net (unit)</div><div class="v '+(r.net>=0?'positive':'negative')+'">'+(r.net>=0?'+':'')+fmt(r.net,1)+'%</div></div><div class="st"><div class="k">Profit factor</div><div class="v">'+(r.pf===null?'—':fmt(r.pf,2))+'</div></div><div class="st"><div class="k">Expectancy</div><div class="v '+(r.expect>=0?'positive':'negative')+'">'+fmt(r.expect,2)+'%</div></div><div class="st"><div class="k">Avg R</div><div class="v">'+fmt(r.avgR,2)+'R</div></div><div class="st"><div class="k">Max DD</div><div class="v negative">'+fmt(r.mdd,1)+'%</div></div><div class="st"><div class="k">Open at end</div><div class="v neutral">'+r.open+'</div></div></div>';
  // equity mini
  h+=eqMini(r.curve);
  h+='<div class="secl">Trades <span class="tag">'+r.closed.length+'</span></div>';
  h+='<table class="tbl"><thead><tr><th>Symbol</th><th>Reason</th><th>Net%</th></tr></thead><tbody>'+r.closed.slice(0,40).map(t=>'<tr><td><b>'+t.symbol+'</b></td><td><span class="tag '+(t.reason==='TP'?'ok':t.reason==='SL'?'bad':'')+'">'+t.reason+'</span></td><td class="n '+(t.net>=0?'positive':'negative')+'">'+(t.net>=0?'+':'')+fmt(t.net,2)+'</td></tr>').join('')+'</tbody></table>';
  h+='<button class="btn sm" style="margin-top:12px;width:100%" data-demo="Backtests export as trades into the Journal — same records, graded there.">Export trades to Journal</button>';
  el.innerHTML=h;$$('[data-demo]',el).forEach(b=>b.onclick=()=>toast(b.dataset.demo));
}
function eqMini(curve){if(!curve.length)return '';const w=300,h=60,min=Math.min(0,...curve),max=Math.max(1,...curve),rng=max-min||1;
  const pts=curve.map((v,i)=>[i/(curve.length-1||1)*w,h-(v-min)/rng*h]);const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  return '<svg class="eqmini" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none"><path d="'+path+' L'+w+','+h+' L0,'+h+' Z" fill="var(--brand-soft)"/><path d="'+path+'" fill="none" stroke="var(--brand)" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>'}

/* --------------------------------------------------------------- toast */
let toastT;function toast(m){$('#toastroot').innerHTML='<div class="toast">'+safe(m)+'</div>';clearTimeout(toastT);toastT=setTimeout(()=>$('#toastroot').innerHTML='',3000)}

/* ----------------------------------------------------------- interactions */
function setTheme(v){theme=v;document.documentElement.dataset.theme=v;try{localStorage.setItem('td-theme',v)}catch{}$('#themeBtn').textContent=v==='dark'?'☾':'☀';draw();if(lastRail)openPanel(lastRail)}
$('#tfs').innerHTML=TFS.map(t=>'<button data-tf="'+t+'" class="'+(t===tf?'active':'')+'">'+t+'</button>').join('');
document.addEventListener('click',e=>{
  const r=e.target.closest('[data-rail]');if(r){openPanel(r.dataset.rail);return}
  const t=e.target.closest('[data-tf]');if(t){tf=t.dataset.tf;$$('#tfs button').forEach(b=>b.classList.toggle('active',b===t));loadSymbol();return}
});
$('#symIn').addEventListener('change',e=>{const v=e.target.value.trim().toUpperCase();if(v){symbol=v;if(!SYMS[v])SYMS[v]=80+Math.round(Math.random()*400);loadSymbol();toast('Loaded '+symbol)}});
$('#symIn').addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur()});
$('#themeBtn').onclick=()=>setTheme(theme==='dark'?'light':'dark');
$('#liveBtn').onclick=()=>toast('Live re-compute is off in this demo — synthetic data is static.');
$('#moreBtn').onclick=()=>openPanel('chart');
// chart mouse
let dragX=null,dragStart=0;
ov.parentElement.addEventListener('mousemove',e=>{const rc=ov.getBoundingClientRect();const mx=e.clientX-rc.left,my=e.clientY-rc.top;
  if(dragX!=null){const dx=mx-dragX,barsMoved=Math.round(dx/(L?L.stepX:8));view.start=clamp(dragStart-barsMoved,0,Math.max(0,bars.length-view.count));draw();}
  drawCross(mx,my);});
ov.parentElement.addEventListener('mouseleave',()=>drawCross(null));
ov.parentElement.addEventListener('mousedown',e=>{const rc=ov.getBoundingClientRect();dragX=e.clientX-rc.left;dragStart=view.start;});
window.addEventListener('mouseup',()=>dragX=null);
ov.parentElement.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY>0?1.12:0.89;const nc=clamp(Math.round(view.count*f),24,bars.length);const center=view.start+view.count/2;view.count=nc;view.start=clamp(Math.round(center-nc/2),0,Math.max(0,bars.length-nc));draw();},{passive:false});
// touch pan
let tX=null,tStart=0;
ov.parentElement.addEventListener('touchstart',e=>{tX=e.touches[0].clientX;tStart=view.start},{passive:true});
ov.parentElement.addEventListener('touchmove',e=>{if(tX==null)return;const dx=e.touches[0].clientX-tX;const moved=Math.round(dx/(L?L.stepX:8));view.start=clamp(tStart-moved,0,Math.max(0,bars.length-view.count));draw()},{passive:true});
ov.parentElement.addEventListener('touchend',()=>tX=null);
new ResizeObserver(()=>draw()).observe($('#chartwrap'));
window.addEventListener('keydown',e=>{if(e.key==='Escape')$('#side').classList.remove('open')});

/* --------------------------------------------------------------- boot */
$('#themeBtn').textContent=theme==='dark'?'☾':'☀';
renderRail();defaultIndicators();loadSymbol();openPanel('chart');
setTimeout(draw,120);// after fonts
})();
</script>
</body>
