<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d131f">
<meta name="description" content="Trade-Disk — The Trading Station. A precise, evidence-led trading journal, and the front door to the Trade-Disk tools.">
<title>Trade-Disk · The Trading Station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   Trade-Disk — a precision instrument for active traders.
   Synced to the design tree: FRONT-END-DESIGN.md (home), JOURNAL/REVIEW.md
   (the journal, 8 tabs), IMPORT.md (three doors, one engine).
   One disciplined accent (signal blue); green/red reserved for P&L meaning.
   Display: Space Grotesk · UI: IBM Plex Sans · Figures: IBM Plex Mono.
   Every figure here is synthetic demo data, labelled, never a claim.
   ========================================================================== */

/* ---- tokens: journal workspace, dark (the default) ---- */
:root{
  color-scheme:dark;
  --ink:#0d131f; --panel:#141c2b; --panel-2:#1a2335; --panel-3:#212c41;
  --line:#243149; --line-soft:#1b2436; --line-strong:#32415c;
  --text:#eaeff8; --text-2:#aab6cc; --muted:#7b89a3; --faint:#55637d;
  --brand:#5b8cff; --brand-press:#4a76e0; --brand-ink:#081022; --brand-soft:#14203b;
  --pos:#3ddc97; --pos-soft:#11291f; --neg:#f4707c; --neg-soft:#2c1620; --warn:#e3ad5a;
  --violet:#a78bfa; --teal:#48c9d6;
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Space Grotesk",var(--sans);
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r-xs:7px; --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:26px;
  --sp:4px;
  --sh-1:0 1px 2px #00000040;
  --sh-2:0 2px 6px #0000002e,0 10px 26px #0000003a;
  --sh-3:0 10px 24px #00000045,0 36px 70px #00000055;
  --sh-brand:0 6px 18px #5b8cff33;
  --ring-brand:0 0 0 3px #5b8cff44;
  --fs-h1:clamp(1.65rem,1.3rem + 1.5vw,2.25rem);
  --fs-h2:1.22rem; --fs-h3:1rem;
  --fs-body:0.9375rem; --fs-sm:0.8125rem; --fs-xs:0.7rem;
  --fs-data:clamp(1.45rem,1.1rem + 1.2vw,1.9rem);
  --dur:.18s; --ease:cubic-bezier(.4,0,.2,1);
}
html[data-theme=light]{
  color-scheme:light;
  --ink:#eef1f7; --panel:#ffffff; --panel-2:#f5f7fc; --panel-3:#eef2f9;
  --line:#dde4f0; --line-soft:#e9edf5; --line-strong:#cdd6e6;
  --text:#131a26; --text-2:#3e4759; --muted:#5f6a7e; --faint:#8793a7;
  --brand:#2f63e6; --brand-press:#2451c8; --brand-ink:#ffffff; --brand-soft:#e7eeff;
  --pos:#0f9d6b; --pos-soft:#e3f6ec; --neg:#d2453f; --neg-soft:#fbe9e8; --warn:#b5812a;
  --violet:#7857d6; --teal:#1a94a3;
  --sh-1:0 1px 2px #1a2b4a12;
  --sh-2:0 2px 6px #1a2b4a12,0 12px 26px #1a2b4a14;
  --sh-3:0 12px 28px #1a2b4a1f,0 40px 70px #1a2b4a1a;
  --sh-brand:0 6px 18px #2f63e62e; --ring-brand:0 0 0 3px #2f63e63a;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);font-size:var(--fs-body);line-height:1.55;-webkit-font-smoothing:antialiased}
.num,.n{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:none;box-shadow:var(--ring-brand);border-radius:6px}
::selection{background:var(--brand);color:var(--brand-ink)}
.app{min-height:100vh;width:100%;max-width:100%;overflow-x:clip}

/* ---- sidebar ---- */
.sidebar{position:fixed;inset:0 auto 0 0;width:244px;padding:22px 16px 16px;border-right:1px solid var(--line-soft);background:var(--panel);display:flex;flex-direction:column;z-index:20;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 4px}
.brandmark{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,var(--brand),#7aa0ff);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px;box-shadow:var(--sh-brand)}
.brand .bn{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:-.01em;line-height:1.05}
.brand .bt{display:block;font-size:9px;letter-spacing:.14em;color:var(--muted);font-weight:500;margin-top:2px}
.tohome{display:flex;align-items:center;gap:8px;width:100%;border:1px solid var(--line);background:transparent;color:var(--muted);padding:9px 11px;border-radius:var(--r-sm);font-size:var(--fs-sm);margin:16px 2px 10px;transition:color var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.tohome:hover{color:var(--text);border-color:var(--line-strong)}
.navlabel{color:var(--faint);font-size:var(--fs-xs);letter-spacing:.06em;font-weight:600;padding:0 12px;margin:14px 0 6px}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:var(--text-2);padding:9px 12px;border-radius:var(--r-sm);text-align:left;position:relative;transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.nav button .ico{font-size:14px;width:18px;text-align:center;color:var(--muted);transition:color var(--dur) var(--ease)}
.nav button:hover{background:var(--panel-2);color:var(--text)}
.nav button.active{background:var(--brand-soft);color:var(--text);font-weight:600}
.nav button.active .ico{color:var(--brand)}
.nav button.active::before{content:"";position:absolute;left:-16px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
.sidebottom{margin-top:auto;padding-top:14px}
.demo-note{border:1px solid var(--line);border-radius:var(--r-md);padding:12px;background:var(--panel-2);font-size:var(--fs-xs);color:var(--muted);margin:10px 2px}
.demo-note b{display:flex;align-items:center;gap:6px;color:var(--warn);font-size:var(--fs-xs);margin-bottom:5px;font-weight:600}
.demo-note b::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--warn)}
.profile{display:flex;align-items:center;gap:10px;padding:12px 8px 2px;border-top:1px solid var(--line-soft)}
.avatar{width:32px;height:32px;border-radius:9px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:var(--fs-sm)}
.profile small{display:block;color:var(--muted);font-size:var(--fs-xs)}

/* ---- main + topbar ---- */
.main{margin-left:244px;min-height:100vh;min-width:0;width:calc(100% - 244px)}
.topbar{height:68px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;justify-content:space-between;padding:0 30px;background:color-mix(in srgb,var(--ink) 82%,transparent);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10}
.crumb{color:var(--muted);font-size:var(--fs-sm)}
.crumb b{color:var(--text);font-weight:600}
.topactions{display:flex;align-items:center;gap:10px}
.livedot{font-size:var(--fs-xs);color:var(--muted);display:inline-flex;align-items:center;gap:7px}
.livedot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--pos);box-shadow:0 0 0 3px color-mix(in srgb,var(--pos) 22%,transparent)}
.iconbtn,.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:var(--r-sm);padding:9px 14px;font-size:var(--fs-sm);font-weight:500;transition:transform var(--dur) var(--ease),background var(--dur) var(--ease),border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.btn:hover{border-color:var(--line-strong);background:var(--panel-2)}
.btn:active{transform:translateY(1px)}
.iconbtn{width:38px;height:38px;display:grid;place-items:center;padding:0}
.iconbtn:hover{background:var(--panel-2)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent;font-weight:600;box-shadow:var(--sh-brand)}
.btn.primary:hover{background:var(--brand-press)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 11px;font-size:var(--fs-xs)}
.content{width:100%;max-width:1480px;min-width:0;margin:0 auto;padding:30px 30px 72px}

/* ---- page header (no caps eyebrow) ---- */
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}
.pagehead h1{font-family:var(--display);font-size:var(--fs-h1);font-weight:600;letter-spacing:-.02em;margin:0 0 5px;line-height:1.08}
.pagehead .sub{color:var(--muted);margin:0;font-size:var(--fs-sm);max-width:66ch}
.headactions{display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0}

/* ---- filters ---- */
.filters{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px;padding:0 0 16px;border-bottom:1px solid var(--line-soft)}
.filters select,.filters input,.field input,.field select,.field textarea,.searchbox{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:var(--r-sm);padding:9px 11px;min-width:128px;transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.filters select:focus,.filters input:focus,.field input:focus,.field select:focus,.field textarea:focus,.searchbox:focus{border-color:var(--brand)}
.filtergroup{display:grid;gap:5px}
.filtergroup label{font-size:var(--fs-xs);color:var(--muted);font-weight:500}
.filters .spacer{flex:1}
.filters .status{font-size:var(--fs-xs);color:var(--muted);display:flex;align-items:center;gap:7px;padding-bottom:9px}
.filters .status::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--muted)}

/* ---- panels ---- */
.grid{display:grid;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r-md);min-width:0}
.panel.raise{box-shadow:var(--sh-2)}
.panelhead{padding:17px 20px 13px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.paneltitle{font-weight:600;font-size:var(--fs-h3);letter-spacing:-.01em}
.paneldesc{color:var(--muted);font-size:var(--fs-xs);margin-top:3px}
.panelbody{padding:0 20px 20px}
.sectiongrid{grid-template-columns:minmax(0,1.7fr) minmax(290px,1fr)}
.twocol{grid-template-columns:repeat(2,minmax(0,1fr))}
.threecol{grid-template-columns:repeat(3,minmax(0,1fr))}
.widepanel{margin-bottom:16px}
.hidden{display:none!important}
.chip{font-size:var(--fs-xs);border-radius:99px;padding:4px 9px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}

/* ---- stat band (replaces card-kit metric rows) ---- */
.statband{border:1px solid var(--line-soft);border-radius:var(--r-md);background:var(--panel);overflow:hidden}
.statband .sbrow{display:grid;margin:0 -1px -1px 0}
.sb6 .sbrow{grid-template-columns:repeat(6,minmax(0,1fr))}
.sb5 .sbrow{grid-template-columns:repeat(5,minmax(0,1fr))}
.sb3 .sbrow{grid-template-columns:repeat(3,minmax(0,1fr))}
.sb2 .sbrow{grid-template-columns:repeat(2,minmax(0,1fr))}
.statband .stat{padding:16px 18px;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.stat-k{font-size:var(--fs-xs);color:var(--muted);font-weight:500}
.stat-v{font-size:var(--fs-data);font-weight:500;margin:9px 0 4px;white-space:nowrap;font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.stat-f{font-size:var(--fs-xs);color:var(--faint)}
.positive{color:var(--pos)!important}
.negative{color:var(--neg)!important}
.neutral{color:var(--muted)!important}

/* ---- hero metric (overview focal point) ---- */
.hero-eq{background:linear-gradient(180deg,var(--panel),var(--panel));border:1px solid var(--line-soft);border-radius:var(--r-lg);box-shadow:var(--sh-2);overflow:hidden;position:relative}
.hero-eq .cap{padding:20px 22px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.hero-eq .big{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:clamp(2rem,1.4rem + 2.6vw,3.1rem);font-weight:500;letter-spacing:-.04em;line-height:1;margin-top:8px}
.hero-eq .cap small{color:var(--muted);font-size:var(--fs-xs)}
.hero-eq .delta{text-align:right;font-size:var(--fs-sm)}

/* ---- charts ---- */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-size:10px;fill:var(--muted);font-family:var(--mono)}
.eq-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.05s var(--ease) .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:var(--fs-xs);color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend span::before{content:"";width:9px;height:3px;border-radius:2px;background:var(--brand)}
.legend .pos::before{background:var(--pos)}.legend .neg::before{background:var(--neg)}

/* rings */
.rings{display:flex;gap:22px;justify-content:space-around;flex-wrap:wrap}
.ring{text-align:center}
.ring b{display:block;font-size:var(--fs-sm);margin-top:8px;font-weight:600}
.ring small{color:var(--muted);font-size:var(--fs-xs)}
.ring .rc{font-family:var(--mono);font-weight:600;font-size:16px;fill:var(--text);font-variant-numeric:tabular-nums}

/* strip */
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.stripchip{border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:13px 14px;background:var(--panel-2)}
.stripchip small{display:block;color:var(--muted);font-size:var(--fs-xs)}
.stripchip b{display:block;font-size:17px;margin:5px 0 2px;font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;font-weight:500}
.stripchip .sf{color:var(--faint);font-size:var(--fs-xs)}

/* histograms + bars */
.histo{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:12px}
.histo .bar{flex:1;background:var(--brand);border-radius:4px 4px 2px 2px;min-height:3px;transition:height .5s var(--ease)}
.histo .bar.neg{background:var(--neg)}
.histoax{display:flex;justify-content:space-between;color:var(--muted);font-size:9px;margin-top:8px;gap:4px;font-family:var(--mono)}
.hbars{display:grid;gap:11px}
.hbar{display:grid;grid-template-columns:118px 1fr auto;gap:12px;align-items:center;font-size:var(--fs-sm)}
.hbar .track{height:8px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.hbar .track span{display:block;height:100%;background:var(--brand);border-radius:99px}
.hbar .track span.neg{background:var(--neg)}
.hbar b{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* mini rows */
.minirow{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.minirow:last-child{border-bottom:0}
.miniicon{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;background:var(--panel-2);font-weight:600;flex-shrink:0;font-size:var(--fs-sm)}
.minimain{flex:1;min-width:0}
.minimain b{display:block;font-size:var(--fs-sm)}
.minimain small{display:block;color:var(--muted);font-size:var(--fs-xs)}
.minivalue{text-align:right;font-weight:600;font-size:var(--fs-sm)}

/* tables */
.tablewrap{overflow-x:auto}
.table{width:100%;border-collapse:collapse;white-space:nowrap}
.table th{text-align:left;font-size:var(--fs-xs);color:var(--muted);font-weight:600;padding:12px 16px;border-bottom:1px solid var(--line)}
.table th button{background:none;border:0;color:inherit;font:inherit;font-weight:600;cursor:pointer;padding:0}
.table th button:hover{color:var(--text)}
.table td{padding:14px 16px;border-bottom:1px solid var(--line-soft);font-size:var(--fs-sm)}
.table td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.table tr:last-child td{border-bottom:0}
.table tbody tr.clickable{transition:background var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.table tbody tr.clickable:hover{background:var(--panel-2);cursor:pointer;box-shadow:inset 3px 0 var(--brand)}
.sym{font-weight:600}
.subcell{display:block;color:var(--muted);font-size:var(--fs-xs);margin-top:2px}
.tag{display:inline-flex;padding:3px 8px;border-radius:6px;background:var(--panel-2);font-size:var(--fs-xs);color:var(--muted);font-weight:500}
.tag.long{color:var(--pos);background:var(--pos-soft)}
.tag.short{color:var(--neg);background:var(--neg-soft)}
.tag.good{color:var(--pos)}.tag.warn{color:var(--warn)}.tag.bad{color:var(--neg)}.tag.info{color:var(--brand)}
.tablefoot{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-top:1px solid var(--line-soft);font-size:var(--fs-xs);color:var(--muted);flex-wrap:wrap;gap:8px}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 16px;overflow-x:auto}
.tabs button{padding:14px 13px;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font-size:var(--fs-sm);white-space:nowrap;transition:color var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.tabs button:hover{color:var(--text)}
.tabs button.active{border-bottom-color:var(--brand);color:var(--text);font-weight:600}

/* calendar */
.calendar{padding:16px 18px 20px}
.calhead,.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.calhead div{text-align:center;font-size:var(--fs-xs);color:var(--muted);padding:6px 0;font-weight:500}
.day{min-height:80px;border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:8px;background:var(--panel-2);text-align:left;color:var(--text);transition:border-color var(--dur) var(--ease)}
.day:hover{border-color:var(--line-strong)}
.day.mutedday{opacity:.4}
.day.selected{border-color:var(--brand);box-shadow:var(--ring-brand)}
.daynum{font-size:var(--fs-xs);font-family:var(--mono);color:var(--muted)}
.daypnl{font-size:var(--fs-xs);font-weight:600;display:block;margin-top:8px;font-family:var(--mono)}
.daycount{font-size:9px;color:var(--muted)}

/* detail + kv */
.detailhero{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:22px}
.detailhero h2{font-family:var(--display);font-size:22px;letter-spacing:-.02em;margin:3px 0;font-weight:600}
.bigpnl{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:28px;font-weight:600;letter-spacing:-.03em}
.detailstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);margin:0 22px 20px;border-radius:var(--r-sm);overflow:hidden}
.detailstat{padding:13px;background:var(--panel)}
.detailstat small{display:block;color:var(--muted);font-size:var(--fs-xs)}
.detailstat b{display:block;margin-top:4px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
.kv div{padding:10px 0;border-bottom:1px solid var(--line-soft)}
.kv small{display:block;color:var(--muted);font-size:var(--fs-xs)}
.kv b{display:block;font-size:var(--fs-sm);margin-top:3px}
.kv b.n{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* misc */
.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);margin-bottom:5px;font-weight:600}
.notice{border:1px solid color-mix(in srgb,var(--warn) 42%,transparent);background:color-mix(in srgb,var(--warn) 9%,transparent);border-radius:var(--r-sm);padding:12px 15px;color:var(--text-2);font-size:var(--fs-sm);margin-bottom:18px}
.notice b{color:var(--warn)}
.notice.info{border-color:color-mix(in srgb,var(--brand) 42%,transparent);background:color-mix(in srgb,var(--brand) 9%,transparent)}
.notice.info b{color:var(--brand)}
.insight{padding:15px;border:1px solid var(--line-soft);border-left:2px solid var(--brand);border-radius:var(--r-sm);background:var(--panel-2);margin-bottom:10px}
.insight:last-child{margin-bottom:0}
.insight b{font-size:var(--fs-sm);display:block;margin-bottom:4px;font-weight:600}
.insight p{font-size:var(--fs-sm);color:var(--muted);margin:0}
.muted{color:var(--muted)}
.inline-link{color:var(--brand);font-size:var(--fs-sm);background:none;border:0;padding:0;cursor:pointer;font-weight:500}
.inline-link:hover{text-decoration:underline}
.progress{height:5px;background:var(--panel-2);border-radius:99px;overflow:hidden;margin-top:9px}

/* forms + modal */
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}

.modal{width:min(780px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-3);animation:pop .22s var(--ease)}
@keyframes pop{from{transform:translateY(10px) scale(.99);opacity:0}}

.segmented button.active{background:var(--panel);color:var(--text);box-shadow:var(--sh-1);font-weight:600}
.toast{position:fixed;bottom:24px;right:24px;z-index:100;background:var(--panel-3);border:1px solid var(--line-strong);color:var(--text);padding:13px 18px;border-radius:var(--r-sm);box-shadow:var(--sh-3);font-size:var(--fs-sm);max-width:340px;animation:pop .2s var(--ease)}

/* import doors + connectors */

.conncard .cmeta small{display:block;color:var(--muted);font-size:var(--fs-xs);margin-top:2px}
.maptable{width:100%;border-collapse:collapse;font-size:var(--fs-sm);margin:10px 0}

.dropzone b{color:var(--text);display:block;margin-bottom:5px;font-weight:600}

.batchrow .bmain{flex:1;min-width:0}
.batchrow small{color:var(--muted);font-size:var(--fs-xs);display:block}

function stats(list){
  const c=list.filter(t=>t.status==='Closed'),wins=c.filter(t=>t.net>0),loss=c.filter(t=>t.net<0),
    sum=c.reduce((a,t)=>a+t.net,0),winSum=wins.reduce((a,t)=>a+t.net,0),lossSum=Math.abs(loss.reduce((a,t)=>a+t.net,0)),
    rs=c.filter(t=>Number.isFinite(t.r)).map(t=>t.r),avgWin=wins.length?winSum/wins.length:0,avgLoss=loss.length?lossSum/loss.length:0;
  return {c,wins,loss,sum,winRate:c.length?wins.length/c.length*100:0,pf:lossSum?winSum/lossSum:null,
    expect:c.length?sum/c.length:0,avgR:rs.length?rs.reduce((a,b)=>a+b,0)/rs.length:null,
    fees:c.reduce((a,t)=>a+t.fees,0),avgWin,avgLoss,payoff:avgLoss?avgWin/avgLoss:null,rs,
    longN:c.filter(t=>t.side==='Long').length,shortN:c.filter(t=>t.side==='Short').length,
    be:c.filter(t=>t.net===0).length};
}
function drawdown(list){let c=[...list].filter(t=>t.status==='Closed').sort((a,b)=>a.date.localeCompare(b.date)),eq=0,peak=0,mdd=0;c.forEach(t=>{eq+=t.net;peak=Math.max(peak,eq);mdd=Math.max(mdd,peak-eq)});return mdd}
function advanced(list){
  const s=stats(list),mdd=drawdown(list);
  let sqn=null; if(s.rs.length>1){const m=s.rs.reduce((a,b)=>a+b,0)/s.rs.length,v=s.rs.reduce((a,b)=>a+(b-m)**2,0)/(s.rs.length-1),sd=Math.sqrt(v);sqn=sd?m/sd*Math.sqrt(s.rs.length):null}
  const w=s.winRate/100; let kelly=(s.payoff&&s.payoff>0)?(w-(1-w)/s.payoff)*100:null;
  const recovery=mdd>0?s.sum/mdd:null;
  const byDay={}; s.c.forEach(t=>{byDay[t.date]=(byDay[t.date]||0)+t.net});
  const days=Object.values(byDay),greenDays=days.filter(v=>v>0).length,consistency=days.length?greenDays/days.length*100:null;
  let curW=0,curL=0,maxW=0,maxL=0,cur=0;
  [...s.c].sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>{if(t.net>0){curW++;curL=0;maxW=Math.max(maxW,curW);cur=curW}else if(t.net<0){curL++;curW=0;maxL=Math.max(maxL,curL);cur=-curL}});
  return {sqn,kelly,recovery,consistency,mdd,streakCur:cur,maxW,maxL};
}

/* ------------------------------------------------------------- CALENDAR */
function calendarPage(){
  const list=filtered(),month=calendarMonth.getMonth(),year=calendarMonth.getFullYear(),first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate(),prev=new Date(year,month,0).getDate(),cells=[];
  for(let i=0;i<42;i++){let day,dt,other=false;
    if(i<first){day=prev-first+i+1;dt=new Date(year,month-1,day);other=true}
    else if(i>=first+days){day=i-first-days+1;dt=new Date(year,month+1,day);other=true}
    else{day=i-first+1;dt=new Date(year,month,day)}
    const key=dateISO(dt),ts=list.filter(t=>t.date===key&&t.status==='Closed'),sum=ts.reduce((a,t)=>a+t.net,0),op=list.some(t=>t.date===key&&t.status==='Open');
    cells.push('<button class="day '+(other?'mutedday ':'')+(selectedDay===key?'selected':'')+'" data-day="'+key+'"><span class="daynum">'+day+'</span>'+(ts.length?'<span class="daypnl '+(sum>=0?'positive':'negative')+'">'+(sum<0?'−':'')+'$'+fmt(Math.abs(sum),0)+'</span><span class="daycount">'+ts.length+' trade'+(ts.length===1?'':'s')+'</span>':'')+(op?'<span class="daycount">● Open</span>':'')+'</button>')}
  const chosen=list.filter(t=>t.date===selectedDay),dnet=chosen.reduce((a,t)=>a+(t.status==='Closed'?t.net:0),0);
  return head('Your month, trade by trade.','Daily realized net P&L and counts, weekends kept. Times are shown in New York.',btn('Today','calendar-today','ghost'))+filterBar()+
    '<div class="grid sectiongrid"><div>'+panel('<span id="monthlabel">'+calendarMonth.toLocaleDateString('en-US',{month:'long',year:'numeric'})+'</span>','Daily realized net P&L · open positions marked separately','<div class="calendar"><div class="calhead">'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>'<div>'+x+'</div>').join('')+'</div><div class="calgrid">'+cells.join('')+'</div></div>','<div style="display:flex;gap:6px"><button class="iconbtn" data-action="month-prev" aria-label="Previous month">‹</button><button class="iconbtn" data-action="month-next" aria-label="Next month">›</button></div>')+'</div><div>'+
    panel('Day review',fmtDate(selectedDay),'<div class="panelbody"><div class="statband sb2" style="margin-bottom:14px"><div class="sbrow"><div class="stat"><div class="stat-k">Net P&L</div><div class="stat-v '+(dnet>=0?'positive':'negative')+'">'+money(dnet)+'</div></div><div class="stat"><div class="stat-k">Closed</div><div class="stat-v">'+chosen.filter(t=>t.status==='Closed').length+'</div></div></div></div>'+(chosen.length?chosen.map(t=>'<div class="minirow" data-trade="'+t.id+'" style="cursor:pointer"><div class="miniicon">'+safe(t.symbol.slice(0,1))+'</div><div class="minimain"><b>'+safe(t.symbol)+' · '+t.side+'</b><small>'+safe(t.setup)+' · '+t.status+'</small></div><div class="minivalue '+(t.status==='Open'?'neutral':t.net>=0?'positive':'negative')+'">'+(t.status==='Open'?'Open':money(t.net))+'</div></div>').join(''):'<div class="empty"><b>No trades on this date</b>Use a day note to record your plan or review.</div>')+'<div style="margin-top:16px"><div class="field"><label for="daynote">Daily plan / review note</label><textarea id="daynote" placeholder="What was the plan? What did you learn?">'+safe(dayNotes[selectedDay]||'')+'</textarea></div><button class="btn primary small" style="margin-top:10px" data-action="save-daynote">Save day note</button></div></div>')+'</div></div>';
}

function timePage(){
  const list=filtered(),closed=list.filter(t=>t.status==='Closed');

  closed.forEach(t=>{wk[new Date(t.date+'T12:00:00').getDay()].value+=t.net});
  const priceBuckets=[['<$50',0,50],['$50–150',50,150],['$150–400',150,400],['≥$400',400,1e9]].map(([label,lo,hi])=>({label,value:closed.filter(t=>t.entry>=lo&&t.entry<hi).reduce((a,t)=>a+t.net,0)}));
  const sizeBuckets=[['1–10',1,10],['10–50',10,50],['50–150',50,150],['150+',150,1e9]].map(([label,lo,hi])=>({label,value:closed.filter(t=>t.qty>=lo&&t.qty<hi).reduce((a,t)=>a+t.net,0)}));
  const winners=closed.filter(t=>t.net>0),losers=closed.filter(t=>t.net<0);

    '<div class="notice info"><b>Entry hour &amp; session need timestamps.</b> This sample stores dates, not intraday entry times, so hour-of-day and session analysis are shown as unavailable rather than invented. Weekday, price and size use the data on hand.</div>'+
    '<div class="grid twocol"><div>'+panel('Net P&L by weekday','Closed trades','<div class="panelbody">'+hbars(wk.map(w=>({label:w.label,value:w.value,fmt:v=>money(v)})))+'</div>')+'</div><div>'+
      panel('Entry hour &amp; session','Timezone-aware grouping','<div class="panelbody"><div class="empty"><b>Unavailable in demo</b>Needs exact entry timestamps and the chosen display timezone, including DST and overnight sessions.</div></div>')+'</div></div>'+
    '<div class="grid twocol"><div>'+panel('Net P&L by entry price','Closed trades','<div class="panelbody">'+hbars(priceBuckets.map(b=>({...b,fmt:v=>money(v)})))+'</div>')+'</div><div>'+
      panel('Net P&L by position size','Closed trades','<div class="panelbody">'+hbars(sizeBuckets.map(b=>({...b,fmt:v=>money(v)})))+'</div>')+'</div></div>'+
    '<div class="grid twocol"><div>'+panel('Hold time','Minutes · closed positions','<div class="panelbody"><div class="kv"><div><small>Median — winners</small><b class="n">'+fmt(med(winners.map(t=>t.duration)),0)+' min</b></div><div><small>Median — losers</small><b class="n">'+fmt(med(losers.map(t=>t.duration)),0)+' min</b></div><div><small>Shortest</small><b class="n">'+fmt(Math.min(...closed.map(t=>t.duration).concat(0)),0)+' min</b></div><div><small>Longest</small><b class="n">'+fmt(Math.max(0,...closed.map(t=>t.duration)),0)+' min</b></div></div><p class="stat-f" style="margin-top:8px">Durations are illustrative in this demo.</p></div>')+'</div><div>'+
      panel('Winners vs losers','Closed trades','<div class="panelbody"><div style="height:9px;border-radius:99px;overflow:hidden;background:var(--panel-2);display:flex;margin:4px 0 8px"><span style="background:var(--pos);width:'+(closed.length?winners.length/closed.length*100:0)+'%"></span><span style="background:var(--neg);flex:1"></span></div><div style="display:flex;justify-content:space-between;color:var(--muted);font-size:var(--fs-sm)"><span>'+winners.length+' winners</span><span>'+losers.length+' losers</span></div></div>')+'</div></div>';

/* ------------------------------------------------------------- RISK */
function riskPage(){
  const list=filtered(),s=stats(list),a=advanced(list);
  const rbuckets=[['≤−2R',-99,-2],['−2…−1',-2,-1],['−1…0',-1,0],['0…1',0,1],['1…2',1,2],['≥2R',2,99]].map(([label,lo,hi])=>({label,count:s.rs.filter(r=>r>lo&&r<=hi).length,neg:hi<=0}));
  const pls=s.c.map(t=>t.net);const plbuckets=(()=>{if(!pls.length)return [];const mn=Math.min(...pls),mx=Math.max(...pls),step=(mx-mn)/6||1;return Array.from({length:6},(_,i)=>{const lo=mn+i*step,hi=lo+step;return {label:'$'+fmt(lo,0),count:pls.filter(v=>v>=lo&&(i===5?v<=hi:v<hi)).length,neg:hi<=0}})})();
  const riskTrades=list.filter(t=>t.initialRisk>0);
  return head('Respect the risk first.','The risk snapshot, the R-multiple distribution and the P&L distribution.')+filterBar()+
    statband([
      {k:'Initial risk at work',v:money(riskTrades.reduce((a,t)=>a+t.initialRisk,0)),f:riskTrades.length+' of '+list.length+' carry a stop'},
      {k:'Average R',v:s.avgR===null?'—':fmt(s.avgR,2)+'R',f:'Blank with no stop',cls:(s.avgR||0)>=0?'positive':'negative'},

    '<div class="grid twocol" style="margin-top:16px"><div>'+panel('R-multiple distribution','Closed trades with valid initial risk','<div class="panelbody">'+(s.rs.length?histogram(rbuckets):'<div class="empty">No trades with a recorded stop in this sample.</div>')+'</div>')+'</div><div>'+
      panel('P&L distribution','Closed trades','<div class="panelbody">'+(plbuckets.length?histogram(plbuckets):'<div class="empty">No closed trades.</div>')+'</div>')+'</div></div>'+
    panel('Risk strip','Drawdown and sizing measures','<div class="panelbody"><div class="strip"><div class="stripchip"><small>Max drawdown</small><b class="negative">'+money(a.mdd)+'</b><span class="sf">Equity order</span></div><div class="stripchip"><small>Recovery</small><b>'+(a.recovery===null?'—':fmt(a.recovery,2))+'</b><span class="sf">Net ÷ DD</span></div><div class="stripchip"><small>SQN</small><b>'+(a.sqn===null?'—':fmt(a.sqn,2))+'</b><span class="sf">System quality</span></div><div class="stripchip"><small>Kelly</small><b>'+(a.kelly===null?'—':fmt(a.kelly,0)+'%')+'</b><span class="sf">Suggested</span></div><div class="stripchip"><small>Worst loss run</small><b class="negative">−'+a.maxL+'</b><span class="sf">Trades</span></div></div><p class="stat-f" style="margin-top:12px">R multiples are only meaningful when initial risk is valid and positive.</p></div>');

function parseCSV(text){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else{if(ch==='"')q=true;else if(ch===','){row.push(cell);cell=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(c=>c.trim()!==''))rows.push(row);row=[];cell=''}else cell+=ch}}
  if(cell!==''||row.length){row.push(cell);if(row.some(c=>c.trim()!==''))rows.push(row)}
  return rows;
}
function guessMap(headers){const m={};const h=headers.map(x=>x.toLowerCase().trim());
  const find=(...keys)=>{for(const k of keys){const i=h.findIndex(x=>x.includes(k));if(i>=0)return i}return -1};
  m.date=find('date','time/date','opened');m.time=find('time');if(m.time===m.date)m.time=-1;
  m.symbol=find('symbol','ticker','instrument');m.side=find('side','action','buy/sell','b/s','type');
  m.qty=find('qty','quantity','shares','size','volume','units');m.price=find('price','fill','avg');
  m.fees=find('fee','commission','comm');m.account=find('account','acct');m.assetType=find('asset','class','sectype');
  return m;
}

function readMapped(){
  const {headers,body,map}=importState;
  const g=(r,f)=>map[f]>=0?(r[map[f]]||'').trim():'';
  const execs=[],skipped=[];
  body.forEach((r,idx)=>{
    const symbol=g(r,'symbol').toUpperCase(),sideRaw=g(r,'side').toLowerCase(),qty=parseFloat(g(r,'qty').replace(/[,]/g,'')),price=parseFloat(g(r,'price').replace(/[,$]/g,''));
    if(!symbol||!Number.isFinite(qty)||qty<=0||!Number.isFinite(price)||price<=0){skipped.push({row:idx+2,reason:'missing symbol, quantity or price'});return}
    const side=/^s|sell|short/.test(sideRaw)?'sell':/^b|buy|long/.test(sideRaw)?'buy':'';
    if(!side){skipped.push({row:idx+2,reason:'unrecognized side "'+safe(g(r,'side'))+'"'});return}
    const fees=parseFloat((g(r,'fees')||'0').replace(/[,$]/g,''))||0;
    const account=g(r,'account')||'Imported';
    const at=(g(r,'assetType')||'stock').toLowerCase(),assetType=Object.keys(ASSETS).includes(at)?at:'stock';
    execs.push({date:normDate(g(r,'date')),time:g(r,'time'),symbol,side,qty,price,fees,account,assetType});
  });
  return {execs,skipped};
}
function normDate(s){if(!s)return iso;s=s.trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  const parts=s.split(/[\/\-.]/).map(x=>x.trim());if(parts.length<3)return iso;
  const fmt=($('#dateFmt')&&$('#dateFmt').value)||'ymd';let y,m,d;
  if(fmt==='mdy'){m=+parts[0];d=+parts[1];y=+parts[2]}else if(fmt==='dmy'){d=+parts[0];m=+parts[1];y=+parts[2]}else{y=+parts[0];m=+parts[1];d=+parts[2]}
  if(y<100)y+=2000;if(!y||!m||!d)return iso;return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
function pairExecutions(execs){
  const groups={};execs.forEach(e=>{const k=e.account+'|'+e.symbol;(groups[k]=groups[k]||[]).push(e)});
  const out=[];
  Object.values(groups).forEach(list=>{
    list.sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
    const mult=MULT[list[0].assetType]||1;let pos=0,lots=[],trade=null;
    const finalize=(open)=>{const dir=trade.dir,qty=trade.qtyOpen,entry=trade.entryVal/qty,exit=trade.exitQty?trade.exitVal/trade.exitQty:null;
      const t={id:'TD-'+Math.random().toString(36).slice(2,8).toUpperCase(),symbol:trade.symbol,side:dir>0?'Long':'Short',setup:setups[0],assetType:trade.assetType,qty,entry,exit,
        status:open?'Open':'Closed',net:open?0:trade.realized-trade.fees,gross:open?0:trade.realized,fees:trade.fees,mult,
        movePct:open||exit===null?null:((exit-entry)/entry*100)*dir,r:null,account:trade.account,source:'File import (demo)',
        date:trade.openDate,duration:0,tags:['imported'],thesis:'',notes:'',stop:null,target:null,plannedRR:null,initialRisk:null,
        adherence:'Unknown',emotions:'Unknown',batch:importState.batchId,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),entrySnapshot:null};
      out.push(t)};
    list.forEach(e=>{let dir=e.side==='buy'?1:-1,remaining=e.qty;
      while(remaining>1e-9){
        if(pos===0){trade={symbol:e.symbol,account:e.account,assetType:e.assetType,dir,openDate:e.date,qtyOpen:remaining,entryVal:remaining*e.price,exitVal:0,exitQty:0,realized:0,fees:e.fees};lots=[{qty:remaining,price:e.price}];pos=dir*remaining;remaining=0;}
        else if(Math.sign(pos)===dir){trade.qtyOpen+=remaining;trade.entryVal+=remaining*e.price;trade.fees+=e.fees;lots.push({qty:remaining,price:e.price});pos+=dir*remaining;remaining=0;}
        else{const closeQty=Math.min(remaining,Math.abs(pos));let toClose=closeQty,realized=0;
          while(toClose>1e-9&&lots.length){const lot=lots[0],mm=Math.min(toClose,lot.qty);realized+=(e.price-lot.price)*mm*trade.dir*mult;lot.qty-=mm;toClose-=mm;if(lot.qty<=1e-9)lots.shift()}
          trade.realized+=realized;trade.exitVal+=closeQty*e.price;trade.exitQty+=closeQty;trade.fees+=e.fees*(closeQty/e.qty);
          pos+=dir*closeQty;remaining-=closeQty;
          if(Math.abs(pos)<1e-9){finalize(false);trade=null;lots=[]}
        }
      }});
    if(trade&&Math.abs(pos)>1e-9)finalize(true);
  });
  return out;
}

function commitImport(){
  const {paired,execs,skipped}=importState.preview;
  let added=0,dupes=0;
  paired.forEach(t=>{const key=[t.account,t.date,t.symbol,t.side,t.qty,t.entry].join('|');
    if(trades.some(x=>[x.account,x.date,x.symbol,x.side,x.qty,x.entry].join('|')===key)){dupes++;return}
    trades.unshift(t);added++});
  const batch={id:importState.batchId,name:(importState.name||'import')+(dupes?' ('+dupes+' dupes skipped)':''),when:new Date().toLocaleString('en-US'),created:added,execs:execs.length,skipped:skipped.length};
  batches.push(batch);persistTrades();writeStore('td-batches',batches);
  importState=null;render();toast(added+' trades committed'+(dupes?', '+dupes+' duplicates skipped':'')+' — undo any time.');
}
function undoBatch(id){
  trades=trades.filter(t=>t.batch!==id);batches=batches.filter(b=>b.id!==id);
  persistTrades();writeStore('td-batches',batches);render();toast('Import batch undone.');
}
function showConnectors(){
  $('#importWork').innerHTML='<section class="panel widepanel raise" style="margin-top:16px"><div class="panelhead"><div><div class="paneltitle">Broker connectors</div><div class="paneldesc">Read-only direct APIs — no third-party aggregator. Each is illustrated here; connecting needs the production journal.</div></div><button class="iconbtn" data-action="cancel-upload" aria-label="Close">×</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Broker</th><th>Auth</th><th>Transport</th><th>Cadence</th><th>Notes</th><th></th></tr></thead><tbody>'+connectorCatalog.map(c=>'<tr><td><b>'+safe(c.kind)+'</b></td><td>'+safe(c.auth)+'</td><td>'+safe(c.transport)+'</td><td><span class="tag info">'+safe(c.cadence)+'</span></td><td class="muted">'+safe(c.note)+'</td><td><button class="btn ghost small" data-action="connect-demo">Connect</button></td></tr>').join('')+'</tbody></table></div><div class="panelbody"><span class="roflag">Read-only — the secret is stored mode 0600, never backed up, never returned by any route.</span></div></section>';
}

/* ------------------------------------------------------------- NOTES */
function notesPage(){
  return head('The thinking behind the trades.','Keep daily plans, lessons and process reviews close to the record.',btn('＋ New note','clear-note','primary'))+
    '<div class="grid sectiongrid"><div>'+panel('Create a note','Daily plan, post-market review, or lesson','<div class="panelbody"><div class="formgrid"><div class="field"><label for="noteDate">Date</label><input id="noteDate" type="date" value="'+iso+'"></div><div class="field"><label for="noteType">Note type</label><select id="noteType"><option>Daily plan</option><option>Daily review</option><option>Lesson learned</option><option>Weekly review</option></select></div><div class="field full"><label for="noteTitle">Title</label><input id="noteTitle" placeholder="What do you want to remember?"></div><div class="field full"><label for="noteText">Notes</label><textarea id="noteText" placeholder="Write your plan, context, mistakes, or lessons…"></textarea></div></div><button class="btn primary" style="margin-top:14px" data-action="save-note">Save note</button></div>')+'</div><div>'+
    panel('Saved notes','Stored locally in this browser',('<div class="panelbody">'+(notes.length?notes.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(n=>'<div class="insight"><div class="stat-k">'+fmtDate(n.date)+' · '+safe(n.type)+'</div><b>'+safe(n.title||'Untitled note')+'</b><p>'+safe(n.text).slice(0,260)+'</p><button class="inline-link" data-note="'+n.id+'">Open / edit</button> · <button class="inline-link" data-delete-note="'+n.id+'">Delete</button></div>').join(''):'<div class="empty"><b>No saved notes yet</b>Your notes stay in this browser and are not synced.</div>')+'</div>'))+'</div></div>';
}

/* ------------------------------------------------------------- SETTINGS */
function settingsPage(){
  return head('Make the journal yours.','Display preferences, and an honest look at what this demo does — and does not — connect to.')+
    '<div class="grid sectiongrid"><div>'+panel('Appearance','Comfortable in light or dark','<div class="panelbody"><div class="minirow"><div class="minimain"><b>Theme</b><small>Applies across the Journal</small></div><select id="themeSelect" class="searchbox"><option value="dark" '+(theme==='dark'?'selected':'')+'>Dark</option><option value="light" '+(theme==='light'?'selected':'')+'>Light</option></select></div><div class="minirow"><div class="minimain"><b>Display timezone</b><small>Times shown in New York; production selection not wired</small></div><span class="tag warn">New York</span></div><div class="minirow"><div class="minimain"><b>Currency</b><small>Demo uses USD</small></div><span class="tag">USD · $</span></div></div>')+'</div><div>'+
    panel('Data &amp; connections','Current demo status','<div class="panelbody"><div class="minirow"><div class="minimain"><b>Broker connections</b><small>Illustrated in Import; none live</small></div><span class="tag warn">Not connected</span></div><div class="minirow"><div class="minimain"><b>Cloud sync</b><small>Trades, batches, notes live in this browser</small></div><span class="tag warn">Local only</span></div><div class="minirow"><div class="minimain"><b>Demo trades</b><small>Illustrative sample, not user records</small></div><span class="tag warn">Synthetic</span></div><button class="btn ghost small" data-action="reset-demo" style="margin-top:13px">Reset demo workspace</button></div>')+'</div></div>'+
    '<section class="panel widepanel"><div class="panelhead"><div><div class="paneltitle">Product integrity</div><div class="paneldesc">Capabilities that need a connected production data layer</div></div></div><div class="panelbody"><div class="grid twocol"><div class="minirow"><div class="minimain"><b>Fills &amp; partial allocations</b><small>Needs the canonical execution ledger</small></div><span class="tag warn">Unavailable</span></div><div class="minirow"><div class="minimain"><b>Entry-time market snapshots</b><small>Must be time-valid and sourced</small></div><span class="tag warn">Unavailable</span></div><div class="minirow"><div class="minimain"><b>Sync health &amp; data-quality warnings</b><small>Requires a real connector</small></div><span class="tag warn">Demo only</span></div><div class="minirow"><div class="minimain"><b>Audit history</b><small>Requires persisted revision events</small></div><span class="tag warn">Unavailable</span></div></div></div></section>';
}

/* ------------------------------------------------------------- MORE */
function morePage(){
  return head('More Journal tools.','Choose a section.')+'<div class="grid twocol">'+
    [['time','Time','P&L by weekday, price and size.'],['risk','Risk','R-multiple and P&L distributions.'],['stats','Stats','Grouped metrics and top symbols.'],['setups','Setups','Per-setup statistics.'],['notes','Notes & reviews','Daily plans and lessons.'],['settings','Settings','Theme and connection status.'],['home','Trade-Disk home','Back to the Trading Station.']]
    .map(x=>'<button class="panel reportcard" data-page="'+x[0]+'" style="text-align:left;color:var(--text)"><b>'+x[1]+'</b><p>'+x[2]+'</p><span class="inline-link">Open</span></button>').join('')+'</div>';
}

/* ------------------------------------------------------------- capture modal */
function newTrade(){ captureTab='manual'; renderCapture(); }
function renderCapture(){
  const seg=['manual','file','connector'].map(k=>'<button class="'+(captureTab===k?'active':'')+'" data-capturetab="'+k+'">'+({manual:'Manual entry',file:'File upload',connector:'Connect broker'}[k])+'</button>').join('');
  let body='';
  if(captureTab==='manual'){
    body='<div class="notice"><b>Prototype.</b> This creates a local synthetic record. It places no orders and connects to no broker.</div>'+
      '<form id="newTradeForm"><div class="formgrid"><div class="field"><label>Asset type</label><select name="assetType" id="capAsset">'+Object.entries(ASSETS).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('')+'</select></div><div class="field"><label>Symbol</label><input name="symbol" required maxlength="16" placeholder="AAPL"></div><div class="field"><label>Trade date</label><input type="date" name="date" value="'+iso+'" required></div><div class="field"><label>Account</label><select name="account">'+accounts.map(a=>'<option>'+a.name+'</option>').join('')+'</select></div><div class="field"><label>Side</label><select name="side"><option>Long</option><option>Short</option></select></div><div class="field"><label>Setup</label><select name="setup">'+setups.map(s=>'<option>'+s+'</option>').join('')+'</select></div><div class="field"><label>Quantity</label><input name="qty" type="number" min=".0001" step=".0001" value="1" required></div><div class="field" id="multField" style="display:none"><label>Contract multiplier</label><input name="mult" type="number" step="1" value="100"></div><div class="field"><label>Entry average</label><input name="entry" type="number" min=".000001" step=".000001" required placeholder="100.00"></div><div class="field"><label>Exit average (blank if open)</label><input name="exit" type="number" min=".000001" step=".000001" placeholder="Optional"></div><div class="field"><label>Stop (for R)</label><input name="stop" type="number" step=".000001" placeholder="Needed for R-multiple"></div><div class="field"><label>Fees</label><input name="fees" type="number" step=".01" placeholder="0.00"></div><div class="field full optFields" style="display:none"><div class="formgrid"><div class="field"><label>Strike</label><input name="strike" type="number" step=".01" placeholder="e.g. 670"></div><div class="field"><label>Expiry</label><input name="expiry" type="date"></div><div class="field"><label>Call / Put</label><select name="cp"><option>Call</option><option>Put</option></select></div></div></div><div class="field full"><label>Thesis / notes</label><textarea name="notes" placeholder="Why did you take this trade?"></textarea></div></div><button class="btn primary" style="margin-top:16px" type="submit">Save demo trade</button></form>';
  } else if(captureTab==='file'){
    body='<div class="notice"><b>File upload.</b> Map any CSV to the canonical fields and preview before commit. The full flow lives on the Import tab.</div><div class="dropzone"><b>Import from a file</b>Presets for Alpaca, IBKR Flex, MetaTrader and TradingView, plus a generic column-mapping wizard.</div><button class="btn primary" style="margin-top:14px" data-action="open-import-upload">Open file upload</button>';
  } else {
    body='<div class="notice"><b>Broker connectors.</b> Read-only, scheduled auto-sync — one per broker, no credential that can trade.</div>'+connectorCatalog.slice(0,4).map(c=>'<div class="conncard"><div class="miniicon">◎</div><div class="cmeta"><b>'+safe(c.kind)+'</b><small>'+safe(c.auth)+' · '+safe(c.cadence)+'</small></div><span class="roflag">Read-only</span></div>').join('')+'<button class="btn ghost" style="margin-top:8px" data-action="open-import-connectors">See all connectors</button>';
  }
  $('#modalroot').innerHTML='<div class="modalback"><div class="modal"><div class="modalhead"><div><div class="mk">Journal · capture</div><h3>Add a trade</h3></div><button class="iconbtn" data-action="close-modal" aria-label="Close">×</button></div><div class="modalbody"><div class="segmented">'+seg+'</div>'+body+'</div></div></div>';
  if(captureTab==='manual')syncAssetFields();
}
function syncAssetFields(){const sel=$('#capAsset');if(!sel)return;const v=sel.value;const mf=$('#multField'),of=$$('.optFields');
  if(mf)mf.style.display=(v==='future'||v==='option')?'grid':'none';
  of.forEach(e=>e.style.display=v==='option'?'block':'none');
  const mi=document.querySelector('input[name=mult]');if(mi)mi.value=v==='option'?100:v==='future'?50:1;
}
function saveNew(form){
  const f=new FormData(form),symbol=String(f.get('symbol')).trim().toUpperCase(),assetType=f.get('assetType'),qty=Number(f.get('qty')),entry=Number(f.get('entry')),
    exit=f.get('exit')?Number(f.get('exit')):null,stop=f.get('stop')?Number(f.get('stop')):null,side=f.get('side'),
    mult=(assetType==='option'||assetType==='future')?(Number(f.get('mult'))||MULT[assetType]):(MULT[assetType]||1),
    fees=f.get('fees')?Number(f.get('fees')):(exit===null?0:Math.max(.3,qty*(assetType==='stock'?.01:.6))),status=exit===null?'Open':'Closed',dir=side==='Long'?1:-1;
  if(!symbol||!Number.isFinite(qty)||qty<=0||!Number.isFinite(entry)||entry<=0||(exit!==null&&(!Number.isFinite(exit)||exit<=0))){toast('Please check symbol, quantity and prices.');return}
  const gross=exit===null?0:(exit-entry)*qty*mult*dir,net=gross-fees,initialRisk=stop?Math.abs(entry-stop)*qty*mult:null;
  const t={id:'TD-'+Date.now().toString().slice(-7),symbol,side,setup:f.get('setup'),assetType,qty,entry,exit,mult,status,
    net,gross,fees,movePct:exit===null?null:((exit-entry)/entry*100)*dir,r:initialRisk&&exit!==null?net/initialRisk:null,
    account:f.get('account')||'Manual / CSV',source:'Manual demo entry',duration:0,tags:['manual'],
    thesis:'',notes:f.get('notes')||'',stop,target:stop?(side==='Long'?entry+(entry-stop)*2:entry-(stop-entry)*2):null,
    plannedRR:stop?2:null,initialRisk,adherence:'Unknown',emotions:'Unknown',batch:'manual',
    createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),entrySnapshot:null,risk:stop?Math.abs(entry-stop):null};
  trades.unshift(t);persistTrades();$('#modalroot').innerHTML='';navigate('trades');toast('Trade saved in this browser.');
}

/* ------------------------------------------------------------- export */
function csvEscape(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function exportCSV(){const list=filtered(),cols=['id','date','symbol','assetType','side','setup','qty','entry','exit','status','gross','fees','net','movePct','r','initialRisk','account','source'];
  const data=[cols.join(','),...list.map(t=>cols.map(k=>csvEscape(t[k])).join(','))].join('\r\n');
  download('trade-disk-journal-demo.csv',data,'text/csv');toast('CSV export created for '+list.length+' records.')}
function download(name,data,type){const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}

/* ------------------------------------------------------------- router */
const CRUMB={home:'Trade-Disk home',overview:'Journal overview',calendar:'Calendar',time:'Time',risk:'Risk',stats:'Stats',setups:'Setups',trades:'Trade ledger',import:'Import',notes:'Notes & reviews',settings:'Settings',more:'More'};
function render(){
  let html='';
  switch(page){
    case'home':html=homePage();break;
    case'overview':html=overviewPage();break;
    case'calendar':html=calendarPage();break;
    case'time':html=timePage();break;
    case'risk':html=riskPage();break;
    case'stats':html=statsPage();break;
    case'setups':html=setupsPage();break;
    case'trades':html=tradesPage();break;
    case'import':html=importPage();break;
    case'notes':html=notesPage();break;
    case'settings':html=settingsPage();break;
    case'more':html=morePage();break;
    default:html=overviewPage();
  }
  $('#content').innerHTML=html;
  $('.app').classList.toggle('station-home',page==='home');
  if($('#crumb'))$('#crumb').textContent=CRUMB[page]||'Journal';
  $$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
  if($('#themeBtn'))$('#themeBtn').textContent=theme==='dark'?'☾':'☀';
}
function navigate(p){page=p;importState=null;animateEq=(p==='overview');render();window.scrollTo({top:0,behavior:'smooth'})}
function toast(msg){$('#toastroot').innerHTML='<div class="toast" role="status">'+safe(msg)+'</div>';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toastroot').innerHTML='',3000)}
function openTrade(id){const t=trades.find(t=>t.id===id);if(!t)return;detailId=id;$('#modalroot').innerHTML=tradeDetail(t)}
function setTheme(v){theme=v;document.documentElement.dataset.theme=v;try{localStorage.setItem('td-theme',v)}catch{}render()}

/* ------------------------------------------------------------- events */
document.addEventListener('click',e=>{
  const p=e.target.closest('[data-page]');if(p){navigate(p.dataset.page);return}
  const tr=e.target.closest('[data-trade]');if(tr){openTrade(tr.dataset.trade);return}
  const day=e.target.closest('[data-day]');if(day){selectedDay=day.dataset.day;render();return}
  const sort=e.target.closest('[data-sort]');if(sort){sortDir=sortKey===sort.dataset.sort?-sortDir:-1;sortKey=sort.dataset.sort;render();return}
  const ct=e.target.closest('[data-capturetab]');if(ct){captureTab=ct.dataset.capturetab;renderCapture();return}
  const stab=e.target.closest('[data-setup]');if(stab){filters.setup=stab.dataset.setup;navigate('trades');return}
  const tt=e.target.closest('[data-tradetab]');if(tt){tradeTab=tt.dataset.tradetab;render();return}
  const dt=e.target.closest('[data-detailtab]');if(dt){$$('[data-detailtab]').forEach(b=>b.classList.toggle('active',b===dt));const t=trades.find(t=>t.id===detailId);$('#detailBody').innerHTML=detailTabContent(t,dt.dataset.detailtab);return}
  const ub=e.target.closest('[data-undo-batch]');if(ub){undoBatch(ub.dataset.undoBatch);return}
  const del=e.target.closest('[data-delete-note]');if(del){notes=notes.filter(n=>n.id!==del.dataset.deleteNote);writeStore('td-notes',notes);render();toast('Note deleted.');return}
  const en=e.target.closest('[data-note]');if(en){const n=notes.find(n=>n.id===en.dataset.note);if(n){editingNoteId=n.id;navigate('notes');$('#noteDate').value=n.date;$('#noteType').value=n.type;$('#noteTitle').value=n.title;$('#noteText').value=n.text;toast('Note loaded. Save to update it.')}return}
  const at=e.target.closest('[data-action]');if(!at)return;
  const a=at.dataset.action;
  switch(a){
    case'goto-trades':navigate('trades');break;
    case'reset-filters':filters={period:'all',account:'all',setup:'all',symbol:''};render();break;
    case'new-trade':newTrade();break;
    case'close-modal':$('#modalroot').innerHTML='';break;
    case'export-csv':exportCSV();break;
    case'sync-now':toast('Demo: a real sync is started by the desk\'s scheduler.');break;
    case'chart-trade':toast('Chart opens in TradeLab (qp) — coming soon.');break;
    case'connect-demo':toast('Prototype: connecting needs the production journal and a read-only credential.');break;
    case'month-prev':calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()-1,1);render();break;
    case'month-next':calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+1,1);render();break;
    case'calendar-today':calendarMonth=new Date(today.getFullYear(),today.getMonth(),1);selectedDay=iso;render();break;
    case'start-upload':startUpload();break;
    case'show-connectors':showConnectors();break;
    case'load-sample':handleCSV(SAMPLE_CSV,'sample-executions.csv');break;
    case'cancel-upload':importState=null;if($('#importWork'))$('#importWork').innerHTML='';break;
    case'preview-import':previewImport();break;
    case'back-mapping':renderMapping();break;
    case'commit-import':commitImport();break;
    case'open-import-upload':$('#modalroot').innerHTML='';navigate('import');startUpload();break;
    case'open-import-connectors':$('#modalroot').innerHTML='';navigate('import');showConnectors();break;
    case'clear-note':editingNoteId=null;['noteTitle','noteText'].forEach(id=>{if($('#'+id))$('#'+id).value=''});toast('Cleared. Write a new note.');break;
    case'save-daynote':{const v=$('#daynote').value;if(v.trim())dayNotes[selectedDay]=v;else delete dayNotes[selectedDay];writeStore('td-daynotes',dayNotes);toast('Day note saved in this browser.');break}
    case'save-note':{const date=$('#noteDate').value||iso,type=$('#noteType').value,title=$('#noteTitle').value||'Untitled note',text=$('#noteText').value;if(!text.trim()){toast('Add a note before saving.');break}if(editingNoteId){const ex=notes.find(n=>n.id===editingNoteId);if(ex)Object.assign(ex,{date,type,title,text});editingNoteId=null}else notes.unshift({id:'N-'+Date.now(),date,type,title,text});writeStore('td-notes',notes);render();toast('Note saved locally.');break}
    case'reset-demo':if(confirm('Reset the illustrative trades, imports and filters? Saved notes remain.')){trades=buildSeed();batches=[];persistTrades();writeStore('td-batches',batches);filters={period:'all',account:'all',setup:'all',symbol:''};render();toast('Demo workspace reset.')}break;
    case'save-trade-edit':{const t=trades.find(t=>t.id===at.dataset.id);if(t){t.setup=$('#eSetup').value;t.adherence=$('#eAdh').value;t.emotions=$('#eEmo').value;const stop=parseFloat($('#eStop').value),target=parseFloat($('#eTarget').value),fees=parseFloat($('#eFees').value);t.stop=Number.isFinite(stop)?stop:null;t.target=Number.isFinite(target)?target:null;if(Number.isFinite(fees)){t.fees=fees;if(t.status==='Closed')t.net=t.gross-fees}t.notes=$('#eNotes').value;t.initialRisk=t.stop?Math.abs(t.entry-t.stop)*t.qty*(t.mult||1):null;t.r=t.initialRisk&&t.status==='Closed'?t.net/t.initialRisk:null;t.updatedAt=new Date().toISOString();persistTrades();$('#modalroot').innerHTML='';toast('Trade updated in this browser.')}break}
  }
});
document.addEventListener('change',e=>{
  if(e.target.matches('[data-filter]')){filters[e.target.dataset.filter]=e.target.value;render()}
  if(e.target.id==='themeSelect')setTheme(e.target.value);
  if(e.target.id==='capAsset')syncAssetFields();
  if(e.target.id==='csvFile'&&e.target.files&&e.target.files[0]){const file=e.target.files[0];const r=new FileReader();r.onload=()=>handleCSV(String(r.result),file.name);r.readAsText(file)}
});
document.addEventListener('input',e=>{
  if(e.target.id==='tradeSearch'){tradeQuery=e.target.value;const pos=e.target.selectionStart;render();const el=$('#tradeSearch');if(el){el.focus();el.setSelectionRange(pos,pos)}}
  if(e.target.id==='symbolFilter')filters.symbol=e.target.value;
});
document.addEventListener('submit',e=>{if(e.target.id==='newTradeForm'){e.preventDefault();saveNew(e.target)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modalroot').innerHTML=''});
$('#themeBtn').addEventListener('click',()=>setTheme(theme==='dark'?'light':'dark'));
$('#newTradeBtn').addEventListener('click',newTrade);
render();
})();
</script>
