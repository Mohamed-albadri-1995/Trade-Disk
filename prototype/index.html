kground:var(--text);color:var(--surface);padding:12px 17px;border-radius:12px;box-shadow:var(--shadow);z-index:20}.mobile-menu{display:none}.marketing{margin-left:0}.marketing .topbar{padding:0 max(24px,calc((100% - 1200px)/2))}.hero{padding:78px 24px 70px;max-width:1200px;margin:auto;display:grid;grid-template-columns:1.05fr .95fr;gap:50px;align-items:center}.eyebrow{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:7px 11px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.7px;text-transform:uppercase}.hero h1{font-size:clamp(42px,5vw,68px);letter-spacing:-3px;line-height:1.02;margin:22px 0 20px}.hero h1 span{color:var(--blue)}.hero p{font-size:17px;color:var(--muted);line-height:1.7;max-width:530px}.hero-buttons{display:flex;gap:10px;margin-top:25px;flex-wrap:wrap}.preview{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 25px 80px #253b6418;transform:rotate(1deg)}.preview-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.preview-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.preview-kpi{background:var(--surface2);border-radius:10px;padding:11px}.preview-kpi small{color:var(--muted);font-size:10px}.preview-kpi strong{display:block;font-size:16px;margin-top:5px}.feature-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:1200px;margin:0 auto;padding:0 24px 65px}.feature{padding:22px;border:1px solid var(--line);background:var(--surface);border-radius:15px}.feature .featureicon{width:38px;height:38px;display:grid;place-items:center;background:var(--blue2);color:var(--blue);border-radius:11px;font-size:18px;margin-bottom:15px}.feature h3{margin:0 0 7px}.feature p{color:var(--muted);margin:0;font-size:13px}.landing-bottom{text-align:center;padding:55px 20px 80px;background:var(--surface);border-top:1px solid var(--line)}.landing-bottom h2{font-size:32px;letter-spacing:-1px;mar const setups=['Opening Range Breakout','VWAP Rejection','Breakout Retest'];
function pnl(t){return t.status==='Open'?0:((t.exitPrice-t.entryPrice)*(t.side==='Long'?1:-1)*t.qty)-(t.fees||0)}
function fmt(n){return (n<0?'−':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function pct(n){return n.toFixed(1)+'%'}
function closed(){return trades.filter(t=>t.status==='Closed')}
function scoped(){return trades.filter(t=>(state.side==='All sides'||t.side===state.side)&&(state.status==='All trades'||(state.status==='Open positions'?t.status==='Open':t.status==='Closed'))&&(state.setup==='All setups'||t.setup===state.setup)&&(!state.search||t.symbol.toLowerCase().includes(state.search.toLowerCase())||t.id.toLowerCase().includes(state.search.toLowerCase())))}
function metrics(arr){const c=arr.filter(t=>t.status==='Closed'), wins=c.filter(t=>pnl(t)>0),loss=c.filter(t=>pnl(t)<0),net=c.reduce((a,t)=>a+pnl(t),0),gp=wins.reduce((a,t)=>a+pnl(t),0),gl=-loss.reduce((a,t)=>a+pnl(t),0);return {c,wins,loss,net,gp,gl,wr:c.length?wins.length/c.length*100:0,pf:gl?gp/gl:0,exp:c.length?net/c.length:0,avgw:wins.length?gp/wins.length:0,avgl:loss.length?gl/loss.length:0}}
function h(tag,cls,txt){return '<'+tag+(cls?' class="'+cls+'"':'')+'>'+txt+'</'+tag+'>'}
function metric(label,value,foot,cls=''){return '<div class="card"><div class="metric-label">'+label+' <span class="muted">ⓘ</span></div><div class="metric-value '+cls+'">'+value+'</div><div class="metric-foot">'+foot+'</div></div>'}
function svgChart(values){let w=700,hg=220,p=15,min=Math.min(...values,0),max=Math.max(...values,1),span=max-min||1;let points=values.map((v,i)=>[p+i*(w-2*p)/(values.length-1),hg-p-(v-min)*(hg-2*p)/span]);let line=points.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');let area=line+' L '+points[points.length-1][0]+' '+(hg-p)+' L '+points[0][0]+' '+(hg-p)+' Z';return '<svg class="chart" viewBox="0 0 '+w+' '+hg+'" preserveAspectRatio="none"><defs><linearGradient id="fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="var(--blue)" stop-opacity=".24"/><stop offset="100%" stop-color="var(--blue)" stop-opacity="0"/></linearGradient></defs>'+[.25,.5,.75].map(y=>'<line x1="0" y1="'+(hg*y)+'" x2="'+w+'" y2="'+(hg*y)+'" stroke="var(--line)" stroke-dasharray="4 5"/>').join('')+'<path d="'+area+'" fill="url(#fill)"/><path d="'+line+'" fill="none" stroke="var(--blue)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>'}
function shell(content){return '<aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-mark">TD</div><div>TRADE-DISK<small>TRADING STATION</small></div></div><div class="navlabel">Workspace</div><nav class="nav">'+[['overview','◫','Overview'],['calendar','▦','Calendar'],['trades','⇄','Trades'],['analytics','⌁','Analytics'],['setups','◈','Setups'],['notes','▤','Notes & plan']].map(([id,ic,label])=>'<button class="'+(state.page===id?'active':'')+'" onclick="go(\''+id+'\')"><span class="icon">'+ic+'</span>'+label+'</button>').join('')+'<div class="navlabel">Manage</div>'+[['capture','＋','Add / capture trade'],['accounts','◎','Accounts'],['settings','⚙','Settings']].map(([id,ic,label])=>'<button class="'+(state.page===id?'active':'')+'" onclick="go(\''+id+'\')"><span class="icon">'+ic+'</span>'+label+'</button>').join('')+'</nav><div class="sidebar-bottom"><div class="planbox"><strong>Trading Journal</strong><p>Independent product · Demo workspace</p><button class="btn small" style="width:100%;justify-content:center" onclick="toast(\'Subscription management is a planned integration.\')">Manage plan ↗</button></div><button class="nav" style="width:100%;border:0;background:none;color:var(--muted);padding:10px" onclick="go(\'home\')">← Trade-Disk home</button></div></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn ghost mobile-menu" onclick="document.getElementById(\'sidebar\').classList.toggle(\'open\')">☰</button><span class="crumb">Trade-Disk <span class="muted">/</span> Trading Journal <span class="muted">/</span> <strong>'+pageName(state.page)+'</strong></span></div><div class="top-actions"><button class="btn small" onclick="toggleTheme()">'+(state.theme==='light'?'☾ Dark':'☀ Light')+'</button><button class="btn small" onclick="toast(\'No new syncs in this demo.\')">↻ <span class="desktop-only">Sync</span></button><div class="avatar">TD</div></div></header><div class="content">'+content+'</div><nav class="mobile-nav">'+[['overview','◫','Home'],['calendar','▦','Calendar'],['trades','⇄','Trades'],['analytics','⌁','Analytics'],['capture','＋','Add']].map(([id,ic,label])=>'<button class="'+(state.page===id?'active':'')+'" onclick="go(\''+id+'\')"><span>'+ic+'</span>'+label+'</button>').join('')+'</nav></main>'}

function heading(title,sub,actions=''){return '<div class="heading"><div><h1>'+title+'</h1><p>'+sub+'</p></div><div class="actions">'+actions+'</div></div>'}
function scopeFilters(){return '<div class="filters"><select onchange="state.range=this.value;render()"><option>30 days</option><option>7 days</option><option>90 days</option><option>Year to date</option><option>All time</option></select><select onchange="state.account=this.value;render()"><option>All accounts</option><option>Main</option><option>Swing</option></select><select onchange="state.setup=this.value;render()"><option>All setups</option>'+setups.map(s=>'<option '+(state.setup===s?'selected':'')+'>'+s+'</option>').join('')+'</select><button class="btn small" onclick="state.range=\'30 days\';state.account=\'All accounts\';state.setup=\'All setups\';render()">Reset filters</button><span class="muted" style="font-size:11px">Demo data · Updated just now</span></div>'}
function overview(){let m=metrics(scoped()),vals=[-80,120,60,250,190,330,290,510,460,630,570,740,690,910,820,1040,990,1160,1080,1260,1200,1380,1320,1510,1460,1640];return heading('Good morning, trader.','A clear view of your execution, risk and progress.','<button class="btn" onclick="go(\'capture\')">＋ Add trade</button><button class="btn primary" onclick="go(\'trades\')">View trades →</button>')+scopeFilters()+'<div class="grid metrics">'+metric('Net realized P&L',fmt(m.net),'After recorded fees',m.net>=0?'positive':'negative')+metric('Win rate',pct(m.wr),m.wins.length+' wins of '+m.c.length+' closed')+metric('Profit factor',m.gl?m.pf.toFixed(2):'—',m.gl?'Gross wins ÷ gross losses':'Needs losing trades')+metric('Expectancy',fmt(m.exp),'Average net per closed trade',m.exp>=0?'positive':'negative')+metric('Closed trades',m.c.length,m.c.filter(t=>t.side==='Long').length+' long · '+m.c.filter(t=>t.side==='Short').length+' short')+metric('Open positions',trades.filter(t=>t.status==='Open').length,'Unrealized P&L shown separately')+'</div><div class="grid two"><section class="card"><div class="cardhead"><div><div class="section-title">Equity curve</div><div class="section-sub">Cumulative realized net P&L · illustrative demo series</div></div><select style="width:auto" onchange="toast(\'Chart range updated in the full product.\')"><option>Net P&L ($)</option><option>Return (%)</option><option>R-multiple</option></select></div>'+svgChart(vals)+'<div class="chart-labels"><span>Sep 15</span><span>Sep 22</span><span>Sep 29</span><span>Oct 6</span><span>Oct 13</span></div><div class="legend" style="margin-top:13px"><span><i class="dot" style="background:var(--blue)"></i>Equity</span><span><i class="dot" style="background:var(--red)"></i>Drawdown from peak</span></div></section><section class="card"><div class="cardhead"><div><div class="section-title">Journal insights</div><div class="section-sub">Evidence from your current sample</div></div><span class="pill blue">Demo</span></div><div class="insight"><div class="insight-icon">↗</div><div><strong>Strongest setup by net P&L</strong><p>Opening Range Breakout is leading this sample. Review its trades before drawing conclusions.</p></div></div><div class="insight"><div class="insight-icon">◷</div><div><strong>Review early entries</strong><p>Trades tagged “Early entry” can be reviewed together in the process analysis.</p></div></div><div class="insight"><div class="insight-icon">◎</div><div><strong>Risk data needs attention</strong><p>Confirm initial stops to unlock reliable R-multiple and risk analytics.</p></div></div><button class="btn" style="width:100%;justify-content:center;margin-top:8px" onclick="go('analytics')">Explore analytics →</button></section></div><div class="card" style="margin-top:16px"><div class="cardhead"><div><div class="section-title">Recent trades</div><div class="section-sub">Your latest recorded activity</div></div><button class="btn small" onclick="go('trades')">All trades →</button></div>'+tradeTable(scoped().slice(0,5))+'</div>'}
function tradeTable(arr){if(!arr.length)return '<div class="empty"><strong>No trades match these filters</strong>Try resetting filters or add a trade.</div>';return '<div class="tablewrap"><table><thead><tr><th>Symbol</th><th>Side</th><th>Entry date</th><th>Setup</th><th>Entry → Exit</th><th>Status</th><th class="align-right">Net P&L</th><th></th></tr></thead><tbody>'+arr.map(t=>'<tr onclick="openTrade(\''+t.id+'\')" style="cursor:pointer"><td><div class="symbol">'+t.symbol+'</div><div class="subline">'+t.account+' · '+t.qty+' shares</div></td><td><span class="pill '+(t.side==='Long'?'green':'red')+'">'+t.side+'</span></td><td>'+t.date+'</td><td>'+t.setup+'</td><td class="num">'+t.entry+' → '+(t.exit||'—')+'</td><td><span class="pill '+(t.status==='Open'?'blue':'')+'">'+t.status+'</span></td><td class="align-right num '+(pnl(t)>=0?'positive':'negative')+'">'+(t.status==='Open'?'—':fmt(pnl(t)))+'</td><td>›</td></tr>').join('')+'</tbody></table></div>'}
function tradesPage(){return heading('Trades','Every position, fill and decision in one searchable record.','<button class="btn primary" onclick="go(\'capture\')">＋ Add trade</button>')+'<div class="filters"><input placeholder="Search symbol or trade ID…" value="'+state.search+'" oninput="state.search=this.value;const pos=this.selectionStart;render();const el=document.querySelector(\'input[placeholder^="Search symbol"]\');if(el){el.focus();el.setSelectionRange(pos,pos)}"><select onchange="state.side=this.value;render()"><option>All sides</option><option>Long</option><option>Short</option></select><select onchange="state.status=this.value;render()"><option>All trades</option><option>Closed</option><option>Open positions</option></select><select onchange="state.setup=this.value;render()"><option>All setups</option>'+setups.map(s=>'<option>'+s+'</option>').join('')+'</select><button class="btn small" onclick="state.search='';state.side='All sides';state.status='All trades';state.setup='All setups';render()">Clear</button></div><div class="grid metrics">'+metric('Trades',scoped().length,'In current view')+metric('Closed',scoped().filter(t=>t.status==='Closed').length,'Completed round trips')+metric('Win rate',pct(metrics(scoped()).wr),'Closed trades only')+metric('Net P&L',fmt(metrics(scoped()).net),'After recorded fees',metrics(scoped()).net>=0?'positive':'negative')+metric('Long / short',scoped().filter(t=>t.side==='Long').length+' / '+scoped().filter(t=>t.side==='Short').length,'By direction')+metric('Needs review',0,'No unresolved records in demo')+'</div><div class="card">'+tradeTable(scoped())+'</div>'}
function openTrade(id){state.detail=id;state.page='detail';render()}
function tradeDetail(){let t=trades.find(x=>x.id===state.detail)||trades[0],net=pnl(t),risk=t.stop?Math.abs(t.entryPrice-t.stop)*t.qty:0,r=risk?net/risk:null;return heading(t.symbol+' · '+t.side,'Trade '+t.id+' · '+t.date+' · '+t.account,'<button class="btn" onclick="go(\'trades\')">← Back to trades</button><button class="btn primary" onclick="editTrade(\''+t.id+'\')">Edit trade</button>')+'<div class="grid metrics">'+metric('Net P&L',t.status==='Open'?'Open':fmt(net),t.status==='Open'?'Unrealized not calculated in demo':'After recorded fees',net>=0?'positive':'negative')+metric('Entry price',fmt(t.entryPrice),'Average entry')+metric('Exit price',t.status==='Open'?'—':fmt(t.exitPrice),'Average exit')+metric('Quantity',t.qty.toLocaleString(),'Shares')+metric('Initial risk',risk?fmt(risk):'Unavailable',risk?'Based on recorded initial stop':'Set a valid initial stop')+metric('Realized R',r===null?'—':r.toFixed(2)+'R',r===null?'Requires valid initial risk':'Net P&L ÷ initial risk',r===null?'':r>=0?'positive':'negative')+'</div><div class="tabs">'+['Overview','Execution','Technical snapshot','Excursions','Conditions','History'].map(x=>'<button class="'+(state.tradeTab===x?'active':'')+'" onclick="state.tradeTab=\''+x+'\';render()">'+x+'</button>').join('')+'</div>'+tradeDetailTab(t)}
function tradeDetailTab(t){if(state.tradeTab==='Execution')return '<div class="grid two"><section class="card"><div class="section-title">Execution details</div><div style="margin-top:16px">'+[['Entry time',t.date+' '+t.entry],['Exit time',t.exit?t.date+' '+t.exit:'Open'],['Side',t.side],['Account',t.account],['Setup',t.setup],['Fees',fmt(t.fees)],['Stop loss',t.stop?fmt(t.stop):'Not recorded'],['Target',t.target?fmt(t.target):'Not recorded']].map(x=>'<div class="tradecard"><span class="muted">'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join('')+'</div></section><section class="card"><div class="section-title">Trade notes</div><p>'+ (t.notes||'No notes added yet.')+'</p><div class="section-sub">Keep the original thesis and post-trade review separate for clearer learning.</div></section></div>';if(state.tradeTab==='Technical snapshot')return '<div class="card"><div class="section-title">Entry-time technical snapshot</div><p class="muted">The production journal will show only values calculated from data available at the actual entry time. This demo does not load market bars.</p><div class="grid three">'+[['VWAP','Unavailable'],['EMA 9 / 20 / 50','Unavailable'],['ATR','Unavailable'],['Relative volume','Unavailable'],['Premarket high / low','Unavailable'],['Market / sector context','Unavailable']].map(x=>metric(x[0],x[1],'No verified snapshot data')).join('')+'</div></div>';if(state.tradeTab==='Excursions')return '<div class="grid two"><section class="card"><div class="section-title">Maximum favorable excursion (MFE)</div><div class="metric-value">Unavailable</div><p class="muted">Requires valid, time-aligned market bars from entry through exit.</p></section><section class="card"><div class="section-title">Maximum adverse excursion (MAE)</div><div class="metric-value">Unavailable</div><p class="muted">No future bars may be included beyond the trade exit.</p></section></div>';if(state.tradeTab==='Conditions')return '<div class="card"><div class="section-title">Setup conditions</div><p class="muted">Conditions should be evaluated as aligned, not aligned, or unknown. Missing data is not a failed condition.</p><div class="empty"><strong>No verified condition results</strong>Configure a setup and calculate an entry-time snapshot to evaluate its rules.</div></div>';if(state.tradeTab==='History')return '<div class="card"><div class="section-title">Record history</div><p class="muted">Trade created in demo workspace. Production history will record edits to critical fields.</p></div>';return '<div class="grid two"><section class="card"><div class="cardhead"><div><div class="section-title">Trade summary</div><div class="section-sub">Recorded trade facts</div></div><span class="pill '+(t.status==='Open'?'blue':'green')+'">'+t.status+'</span></div><div class="grid three">'+[['Gross P&L',t.status==='Open'?'—':fmt(net+t.fees)],['Fees',fmt(t.fees)],['Net P&L',t.status==='Open'?'—':fmt(net)]].map(x=>metric(x[0],x[1],'Recorded values')).join('')+'</div><p class="muted">Setup: <strong>'+t.setup+'</strong></p><p>'+ (t.notes||'No trade notes recorded.')+'</p><div>'+t.tags.map(tag=>'<span class="pill" style="margin-right:5px">'+tag+'</span>').join('')+'</div></section><section class="card"><div class="section-title">Price & risk</div><div style="margin-top:15px">'+[['Entry',fmt(t.entryPrice)],['Exit',t.status==='Open'?'Open':fmt(t.exitPrice)],['Stop',t.stop?fmt(t.stop):'Not set'],['Target',t.target?fmt(t.target):'Not set'],['Planned reward/risk',t.stop&&t.target?(Math.abs(t.target-t.entryPrice)/Math.abs(t.entryPrice-t.stop)).toFixed(2)+' : 1':'Unavailable']].map(x=>'<div class="tradecard"><span class="muted">'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join('')+'</div><button class="btn" style="margin-top:12px" onclick="state.tradeTab=\'Execution\';render()">View execution details →</button></section></div>'}
function calendarPage(){let d=state.calendar,year=d.getFullYear(),month=d.getMonth(),first=new Date(year,month,1),offset=(first.getDay()+6)%7,days=new Date(year,month+1,0).getDate(),cells='';for(let i=0;i<offset;i++)cells+='<div class="calday" style="background:var(--surface2)"></div>';for(let day=1;day<=days;day++){let key=year+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0'),arr=trades.filter(t=>t.date===key&&t.status==='Closed'),net=arr.reduce((a,t)=>a+pnl(t),0);cells+='<div class="calday" onclick="state.search=\'\';go(\'trades\');setTimeout(()=>{state.search=\''+key+'\';render()},0)"><div class="daynum">'+day+'</div>'+(arr.length?'<div class="pnl '+(net>=0?'positive':'negative')+'">'+fmt(net)+'</div><div class="trades">'+arr.length+' trade'+(arr.length===1?'':'s')+'</div>':'')+'</div>'}return heading('Trading calendar','Your trading history, one day at a time.','<button class="btn primary" onclick="go(\'notes\')">＋ Day note</button>')+'<div class="card"><div class="cardhead"><div><div class="section-title">'+d.toLocaleDateString('en-US',{month:'long',year:'numeric'})+'</div><div class="section-sub">Select a day to review its trades and notes.</div></div><div class="actions"><button class="btn small" onclick="changeMonth(-1)">←</button><button class="btn small" onclick="state.calendar=new Date(2026,9,1);render()">Today</button><button class="btn small" onclick="changeMonth(1)">→</button></div></div><div class="calendar">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>'<div class="calhead">'+x+'</div>').join('')+cells+'</div><div class="grid three" style="margin-top:15px">'+metric('Month net P&L',fmt(trades.filter(t=>t.date.startsWith(year+'-'+String(month+1).padStart(2,'0'))&&t.status==='Closed').reduce((a,t)=>a+pnl(t),0)),'Recorded closed trades')+metric('Trading days',new Set(trades.filter(t=>t.date.startsWith(year+'-'+String(month+1).padStart(2,'0'))).map(t=>t.date)).size,'Days with activity')+metric('Closed trades',trades.filter(t=>t.date.startsWith(year+'-'+String(month+1).padStart(2,'0'))&&t.status==='Closed').length,'This month')+'</div></div>'}
function changeMonth(n){state.calendar=new Date(state.calendar.getFullYear(),state.calendar.getMonth()+n,1);render()}
function analyticsPage(){let m=metrics(scoped()),tabs=['Performance','Risk','Time','Symbols','Setups','Costs','Process'];let content='';if(state.analytics==='Performance')content='<div class="grid metrics">'+metric('Net P&L',fmt(m.net),'After fees',m.net>=0?'positive':'negative')+metric('Win rate',pct(m.wr),m.c.length+' closed trades')+metric('Profit factor',m.gl?m.pf.toFixed(2):'—','Gross wins / gross losses')+metric('Expectancy',fmt(m.exp),'Per closed trade')+metric('Average winner',fmt(m.avgw),'Winning trades only','positive')+metric('Average loser',fmt(-m.avgl),'Loss magnitude','negative')+'</div><div class="grid two"><div class="card"><div class="section-title">Equity curve</div>'+svgChart([-80,120,60,250,190,330,290,510,460,630,570,740,690,910,820,1040])+'</div><div class="card"><div class="section-title">Win / loss distribution</div>'+[['Winners',m.wins.length,'var(--green)'],['Losers',m.loss.length,'var(--red)'],['Breakeven',m.c.length-m.wins.length-m.loss.length,'var(--muted)']].map(x=>'<div class="barrow"><span>'+x[0]+'</span><div class="bartrack"><div class="barfill" style="width:'+(m.c.length?x[1]/m.c.length*100:0)+'%;background:'+x[2]+'"></div></div><strong>'+x[1]+'</strong></div>').join('')+'</div></div>';else if(state.analytics==='Risk')content='<div class="grid metrics">'+metric('Max drawdown','Unavailable','Needs ordered equity history')+metric('Expectancy R','Unavailable','Requires valid initial risk')+metric('SQN','Unavailable','Requires a sufficient valid R sample')+metric('Kelly fraction','Unavailable','Unstable for small samples')+metric('Largest loss',m.loss.length?fmt(Math.min(...m.loss.map(pnl))):'—','Closed trade net P&L')+metric('Fees',fmt(m.c.reduce((a,t)=>a+t.fees,0)),'Recorded fees')+'</div><div class="card"><div class="section-title">R-multiple distribution</div><div class="empty"><strong>Not enough verified risk data</strong>Set and preserve initial risk on trades before calculating R-based metrics. No values are fabricated.</div></div>';else if(state.analytics==='Time')content='<div class="grid two"><div class="card"><div class="section-title">Performance by weekday</div>'+[['Monday',0],['Tuesday',1],['Wednesday',2],['Thursday',3],['Friday',4]].map((x,i)=>{let ar=m.c.filter(t=>new Date(t.date+'T12:00:00').getDay()===(i+1)%7),v=ar.reduce((a,t)=>a+pnl(t),0);return '<div class="barrow"><span>'+x[0]+'</span><div class="bartrack"><div class="barfill" style="width:'+Math.min(100,Math.abs(v)/20)+'%"></div></div><strong class="'+(v>=0?'positive':'negative')+'">'+fmt(v)+'</strong></div>'}).join('')+'</div><div class="card"><div class="section-title">Hold time</div><p class="muted">Duration analytics require complete entry and exit timestamps with timezone support.</p><div class="empty"><strong>Demo timestamps</strong>Production analytics will include average, median and distribution of holding times, with winners compared to losers.</div></div></div>';else if(state.analytics==='Symbols')content='<div class="card"><div class="section-title">Symbol performance</div>'+tradeTable(m.c)+'</div>';else if(state.analytics==='Setups')content='<div class="card"><div class="section-title">Setup comparison</div>'+setups.map(s=>{let ar=m.c.filter(t=>t.setup===s),v=ar.reduce((a,t)=>a+pnl(t),0);return '<div class="barrow"><span>'+s+'</span><div class="bartrack"><div class="barfill" style="width:'+Math.min(100,Math.abs(v)/15)+'%;background:'+(v>=0?'var(--green)':'var(--red)')+'"></div></div><strong class="'+(v>=0?'positive':'negative')+'">'+fmt(v)+'</strong></div>'}).join('')+'</div>';else if(state.analytics==='Costs')content='<div class="grid three">'+metric('Total recorded fees',fmt(m.c.reduce((a,t)=>a+t.fees,0)),'Closed trades')+metric('Average fee',fmt(m.c.length?m.c.reduce((a,t)=>a+t.fees,0)/m.c.length:0),'Per closed trade')+metric('Gross P&L',fmt(m.net+m.c.reduce((a,t)=>a+t.fees,0)),'Before recorded fees')+'</div><div class="card"><p class="muted">Broker, regulatory and exchange fees should be separated where data supports it. Estimated fees must be labeled as estimates.</p></div>';else content='<div class="card"><div class="section-title">Process and discipline</div><p class="muted">Review user-defined tags, plan adherence, early exits, late entries, overtrading and rule violations. Tags are personal annotations, not automated psychological diagnoses.</p>'+['Plan followed','Early entry','Late entry','Rule violation','A setup'].map(tag=>'<div class="tradecard"><span>'+tag+'</span><button class="btn small" onclick="state.search=\''+tag+'\';go(\'trades\')">Review trades →</button></div>').join('')+'</div>';return heading('Analytics','Understand outcomes, risk, timing, setups and execution.','<button class="btn" onclick="toast(\'Export will be connected to journal data.\')">↓ Export report</button>')+scopeFilters()+'<div class="tabs">'+tabs.map(x=>'<button class="'+(state.analytics===x?'active':'')+'" onclick="state.analytics=\''+x+'\';render()">'+x+'</button>').join('')+'</div>'+content+'<p class="muted" style="font-size:11px;margin-top:14px">Metrics use the demo trades shown here. Production values must share one calculation engine and disclose each eligible sample.</p>'}
function setupsPage(){return heading('Setups','Define your playbook and see how each setup performs.','<button class="btn primary" onclick="newSetup()">＋ New setup</button>')+'<div class="grid three">'+setups.map(s=>{let arr=closed().filter(t=>t.setup===s),m=metrics(arr);return '<div class="card"><div class="cardhead"><div><div class="section-title">'+s+'</div><div class="section-sub">'+arr.length+' closed trades</div></div><span class="pill">Setup</span></div><div class="metric-value '+(m.net>=0?'positive':'negative')+'">'+fmt(m.net)+'</div><div class="grid two" style="gap:8px"><div><div class="muted">Win rate</div><strong>'+pct(m.wr)+'</strong></div><div><div class="muted">Profit factor</div><strong>'+(m.gl?m.pf.toFixed(2):'—')+'</strong></div></div><button class="btn" style="margin-top:15px;width:100%;justify-content:center" onclick="state.setup=\''+s+'\';state.analytics=\'Setups\';go(\'analytics\')">Analyze setup →</button></div>'}).join('')+'</div><div class="card" style="margin-top:16px"><div class="section-title">Setup checklist</div><p class="muted">Production setup templates will support mandatory and optional, direction-aware conditions. Missing snapshot values must remain unknown, not be counted as failures.</p><button class="btn" onclick="toast(\'Setup editor is a demo interaction.\')">Manage conditions</button></div>'}
function notesPage(){return heading('Notes & trading plan','Plan the day, capture context, and review your execution.','<button class="btn primary" onclick="saveNote()">Save note</button>')+'<div class="grid two"><section class="card"><div class="cardhead"><div><div class="section-title">Daily trading plan</div><div class="section-sub">'+new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})+'</div></div><span class="pill blue">Today</span></div><div class="formgrid"><div class="formfield full"><label>Market context</label><textarea id="marketNote" rows="3" placeholder="Trend, key levels, catalysts…">'+(localStorage.getItem('td-market-note')||'')+'</textarea></div><div class="formfield full"><label>Focus for today</label><textarea id="focusNote" rows="2" placeholder="What will good execution look like?">'+(localStorage.getItem('td-focus-note')||'')+'</textarea></div><div class="formfield full"><label>Rules to respect</label><textarea id="rulesNote" rows="2" placeholder="Maximum risk, setups, no-trade conditions…">'+(localStorage.getItem('td-rules-note')||'')+'</textarea></div></div></section><section class="card"><div class="section-title">End-of-day review</div><p class="section-sub">Reflect on the process, not only the result.</p><div class="formfield" style="margin-top:16px"><label>What went well?</label><textarea id="wellNote" rows="3" placeholder="Good decisions and disciplined execution…">'+(localStorage.getItem('td-well-note')||'')+'</textarea></div><div class="formfield" style="margin-top:14px"><label>What will I improve?</label><textarea id="improveNote" rows="3" placeholder="One specific action for next session…">'+(localStorage.getItem('td-improve-note')||'')+'</textarea></div><button class="btn primary" style="margin-top:14px" onclick="saveNote()">Save review</button></section></div>'}
function saveNote(){['marketNote','focusNote','rulesNote','wellNote','improveNote'].forEach((id,i)=>localStorage.setItem(['td-market-note','td-focus-note','td-rules-note','td-well-note','td-improve-note'][i],document.getElementById(id)?.value||''));toast('Notes saved in this browser demo.')}
function capturePage(){let t=state.modal==='edit'?trades.find(x=>x.id===state.detail):null;return heading(t?'Edit trade':'Add a trade','Record the facts first. Add setup, risk and review details when useful.','<button class="btn" onclick="go(\'trades\')">Cancel</button>')+'<form class="card" onsubmit="saveTrade(event)"><div class="cardhead"><div><div class="section-title">Trade details</div><div class="section-sub">Fields marked * are required. This prototype saves demo records in memory only.</div></div><span class="pill blue">Manual entry demo</span></div><div class="formgrid"><div class="formfield"><label>Symbol *</label><input name="symbol" required placeholder="e.g. AAPL" value="'+(t?.symbol||'')+'"></div><div class="formfield"><label>Direction *</label><select name="side"><option '+(t?.side!=='Short'?'selected':'')+'>Long</option><option '+(t?.side==='Short'?'selected':'')+'>Short</option></select></div><div class="formfield"><label>Entry date *</label><input type="date" name="date" required value="'+(t?.date||new Date().toISOString().slice(0,10))+'"></div><div class="formfield"><label>Account</label><select name="account"><option>Main</option><option>Swing</option><option>Paper</option></select></div><div class="formfield"><label>Entry time</label><input type="time" name="entry" value="'+(t?.entry||'09:30')+'"></div><div class="formfield"><label>Exit time</label><input type="time" name="exit" value="'+(t?.exit||'')+'"><small>Leave blank for an open position.</small></div><div class="formfield"><label>Entry price *</label><input type="number" step="any" min="0" name="entryPrice" required value="'+(t?.entryPrice||'')+'"></div><div class="formfield"><label>Exit price</label><input type="number" step="any" min="0" name="exitPrice" value="'+(t?.exitPrice||'')+'"></div><div class="formfield"><label>Quantity *</label><input type="number" step="any" min="0.0001" name="qty" required value="'+(t?.qty||'')+'"></div><div class="formfield"><label>Fees</label><input type="number" step="any" min="0" name="fees" value="'+(t?.fees||0)+'"></div><div class="formfield"><label>Initial stop</label><input type="number" step="any" min="0" name="stop" value="'+(t?.stop||'')+'"><small>Preserved as the original risk reference.</small></div><div class="formfield"><label>Target</label><input type="number" step="any" min="0" name="target" value="'+(t?.target||'')+'"></div><div class="formfield"><label>Setup</label><select name="setup">'+setups.map(s=>'<option '+(t?.setup===s?'selected':'')+'>'+s+'</option>').join('')+'</select></div><div class="formfield"><label>Tags</label><input name="tags" placeholder="A setup, plan followed" value="'+(t?.tags?.join(', ')||'')+'"></div><div class="formfield full"><label>Trade thesis and notes</label><textarea name="notes" rows="3" placeholder="Why did you enter? What did you learn?">'+(t?.notes||'')+'</textarea></div></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px"><button type="button" class="btn" onclick="go('trades')">Cancel</button><button class="btn primary" type="submit">Save trade</button></div></form>'}
function saveTrade(e){e.preventDefault();let f=new FormData(e.target),t={id:state.modal==='edit'?state.detail:'T-'+(1049+trades.length),symbol:String(f.get('symbol')).toUpperCase(),side:f.get('side'),date:f.get('date'),entry:f.get('entry'),exit:f.get('exit'),qty:+f.get('qty'),entryPrice:+f.get('entryPrice'),exitPrice:+f.get('exitPrice')||0,fees:+f.get('fees')||0,setup:f.get('setup'),account:f.get('account'),status:f.get('exit')&&+f.get('exitPrice')>0?'Closed':'Open',stop:+f.get('stop')||0,target:+f.get('target')||0,notes:f.get('notes'),tags:String(f.get('tags')||'').split(',').map(x=>x.trim()).filter(Boolean)};if(t.status==='Closed'&&t.exitPrice<=0){toast('Add an exit price or leave the exit time blank.');return}if(state.modal==='edit'){let i=trades.findIndex(x=>x.id===state.detail);trades[i]=t}else trades.unshift(t);state.modal=null;state.detail=t.id;state.page='detail';state.tradeTab='Overview';render();toast('Trade saved in the demo workspace.')}
function editTrade(id){state.detail=id;state.modal='edit';state.page='capture';render()}
function accountsPage(){return heading('Accounts & connections','Manage where your trade records come from.','<button class="btn primary" onclick="toast(\'Connection setup will be designed after capture methods are selected.\')">＋ Connect account</button>')+'<div class="grid two"><div class="card"><div class="cardhead"><div><div class="section-title">Main</div><div class="section-sub">Demo trading account</div></div><span class="pill green">Demo</span></div><div class="grid two">'+metric('Trades',trades.filter(t=>t.account==='Main').length,'Records')+metric('Last sync','Demo','No live connection')+'</div><button class="btn" style="margin-top:12px" onclick="toast(\'No credentials are stored in this prototype.\')">Connection settings</button></div><div class="card"><div class="cardhead"><div><div class="section-title">Swing</div><div class="section-sub">Demo trading account</div></div><span class="pill green">Demo</span></div><div class="grid two">'+metric('Trades',trades.filter(t=>t.account==='Swing').length,'Records')+metric('Last sync','Demo','No live connection')+'</div><button class="btn" style="margin-top:12px" onclick="toast(\'No credentials are stored in this prototype.\')">Connection settings</button></div></div><div class="card" style="margin-top:16px"><div class="section-title">Data quality</div><p class="muted">The full product should report failed syncs, unmatched fills, duplicate records, missing fees, incomplete trades and stale technical snapshots.</p></div>'}
function settingsPage(){return heading('Settings','Personalize your journal experience.','<button class="btn primary" onclick="toast(\'Settings saved in this prototype.\')">Save changes</button>')+'<div class="grid two"><div class="card"><div class="section-title">Appearance</div><p class="muted">Choose the display mode used on this device.</p><button class="btn" onclick="toggleTheme()">Switch to '+(state.theme==='light'?'dark':'light')+' mode</button><div class="formfield" style="margin-top:18px"><label>Timezone</label><select><option>America/New_York</option><option>Asia/Riyadh</option><option>UTC</option></select></div><div class="formfield" style="margin-top:14px"><label>Currency</label><select><option>USD — US Dollar</option><option>SAR — Saudi Riyal</option></select></div></div><div class="card"><div class="section-title">Calculations & privacy</div><p class="muted">All analytics should use the same calculation definitions. Connected-account secrets must remain server-side and never be returned to the browser.</p><div class="tradecard"><span>Metric definitions</span><button class="btn small" onclick="go('analytics')">View analytics →</button></div><div class="tradecard"><span>Export my data</span><button class="btn small" onclick="toast('Export integration is not connected in this demo.')">Export</button></div><div class="tradecard"><span>Delete account data</span><button class="btn small" onclick="toast('Account deletion flow needs confirmation and server support.')">Manage</button></div></div></div>'}
function homePage(){return '<div class="hero"><div><div class="eyebrow"><span class="dot" style="background:var(--green)"></span> THE TRADER’S WORKSPACE</div><h1>Trade with clarity.<br><span>Learn from every trade.</span></h1><p>One connected trading station for recording your decisions, discovering market opportunities, testing strategies and building a repeatable process.</p><div class="hero-buttons"><button class="btn primary" onclick="go(\'overview\')">Explore Trading Journal ↗</button><button class="btn" onclick="document.getElementById(\'products\').scrollIntoView({behavior:\'smooth\'})">Explore the platform</button></div><div class="muted" style="margin-top:18px;font-size:12px">Start with the journal. Add tools when you need them.</div></div><div class="preview"><div class="preview-top"><div class="brand" style="padding:0;font-size:13px"><div class="brand-mark" style="width:26px;height:26px;font-size:11px">TD</div>Trading Journal</div><span class="pill green">Workspace preview</span></div><div class="preview-kpis"><div class="preview-kpi"><small>Net P&L</small><strong class="positive">+$2,840</strong></div><div class="preview-kpi"><small>Win rate</small><strong>61.8%</strong></div><div class="preview-kpi"><small>Profit factor</small><strong>1.74</strong></div></div>'+svgChart([-80,50,20,110,85,160,135,220,190,280,255,340,320,420])+'<div class="chart-labels"><span>Sep 15</span><span>Sep 28</span><span>Oct 13</span></div><div class="tradecard" style="padding:12px 0"><div class="tradeleft"><div class="tickerbadge">NVDA</div><div><strong>NVDA · Long</strong><div class="subline">Opening Range Breakout</div></div></div><strong class="positive">+$282.60</strong></div><div class="tradecard" style="padding:12px 0"><div class="tradeleft"><div class="tickerbadge">AMD</div><div><strong>AMD · Short</strong><div class="subline">VWAP Rejection</div></div></div><strong class="negative">−$146.10</strong></div><div class="muted" style="font-size:10px;margin-top:10px">Illustrative interface preview · not live trading data</div></div></div><div id="products" class="feature-strip"><div class="feature"><div class="featureicon">▤</div><h3>Trading Journal</h3><p>Capture trades, study performance, measure risk and improve execution. Available as a standalone product.</p><button class="btn small" style="margin-top:16px" onclick="go(\'overview\')">Explore journal →</button></div><div class="feature"><div class="featureicon">⌕</div><h3>Radar</h3><p>Screen the market, find stocks and compare opportunities with your own criteria.</p><span class="pill" style="margin-top:16px;display:inline-block">Standalone or station</span></div><div class="feature"><div class="featureicon">⌁</div><h3>TradeLab</h3><p>Chart markets, develop strategies, and backtest ideas before considering live execution.</p><span class="pill" style="margin-top:16px;display:inline-block">Standalone or station</span></div></div><section class="landing-bottom"><h2>Your tools. Your workflow.</h2><p>Subscribe to one tool or bring your trading workflow together in Trade-Disk.</p><button class="btn primary" onclick="go('overview')">Open journal demo →</button><div class="muted" style="margin-top:22px;font-size:12px">TradePilot · Future algorithmic tool · Not yet available</div></section>'}
function newSetup(){let s=prompt('Setup name');if(s&&s.trim()){setups.push(s.trim());state.setup='All setups';render();toast('Setup added to this demo.')} }
function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.add('hidden'),2600)}
function toggleTheme(){state.theme=state.theme==='light'?'dark':'light';document.documentElement.dataset.theme=state.theme;localStorage.setItem('td-theme',state.theme);render()}
function go(p){state.page=p;state.modal=null;render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){document.documentElement.dataset.theme=state.theme;let content='';if(state.page==='home'){document.getElementById('root').innerHTML='<div class="app marketing"><header class="topbar"><div class="brand" style="padding:0"><div class="brand-mark">TD</div><div>TRADE-DISK<small>TRADING STATION</small></div></div><div class="top-actions"><button class="btn small" onclick="toggleTheme()">'+(state.theme==='light'?'☾ Dark mode':'☀ Light mode')+'</button><button class="btn" onclick="go(\'overview\')">Sign in</button><button class="btn primary" onclick="go(\'overview\')">Explore journal</button></div></header>'+homePage()+'</div>';return}switch(state.page){case'overview':content=overview();break;case'trades':content=tradesPage();break;case'detail':content=tradeDetail();break;case'calendar':content=calendarPage();break;case'analytics':content=analyticsPage();break;case'setups':content=setupsPage();break;case'notes':content=notesPage();break;case'capture':content=capturePage();break;case'accounts':content=accountsPage();break;case'settings':content=settingsPage();break;default:content=overview()}document.getElementById('root').innerHTML='<div class="app">'+shell(content)+'</div>'}
document.documentElement.dataset.theme=state.theme;render();
</script>
