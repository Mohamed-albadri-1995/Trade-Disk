function overview(){let list=filtered(),s=stats(list),open=list.filter(t=>t.status==='Open'),maxdd=0,peak=0,curve=0;s.c.sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>{curve+=t.net;peak=Math.max(peak,curve);maxdd=Math.max(maxdd,peak-curve)});let wins=s.wins.length,loss=s.loss.length;let setupsStats=setups.map(n=>({name:n,...stats(list.filter(t=>t.setup===n))}));return head('YOUR JOURNAL','See the full picture.','A clear view of your trading decisions, results, and risk.',btn('View all trades','goto-trades','subtle'))+filterBar()+'<div class="notice"><strong>Demo workspace.</strong> All trades and results on this screen are synthetic examples for interface preview. No broker is connected; insights are not claims about your performance.</div><div class="grid metrics">'+metric('Net realized P&L',money(s.sum),'Closed trades · after fees',s.sum>=0?'positive':'negative')+metric('Closed trades',s.c.length,'Open positions separate')+metric('Win rate',pct(s.winRate),s.c.length+' closed trades in denominator')+metric('Profit factor',s.pf===null?'—':fmt(s.pf,2),'Gross wins ÷ absolute losses')+metric('Expectancy',money(s.expect),s.c.length?'Average net per closed trade':'No closed trades')+'</div><div class="grid sectiongrid"><div>'+panel('Equity curve','Cumulative realized net P&L · selected period','<div class="panelbody">'+lineChart(list)+'<div class="legend"><span>Realized net P&L</span><span class="red">Drawdown tracked separately</span></div><div class="grid twocol" style="margin-top:15px;margin-bottom:0"><div><div class="metriclabel">Maximum drawdown</div><div class="metricvalue" style="font-size:19px">'+money(maxdd)+'</div><div class="metricfoot">From running equity high-water mark</div></div><div><div class="metriclabel">Average realized R</div><div class="metricvalue" style="font-size:19px">'+(s.avgR===null?'—':fmt(s.avgR,2)+'R')+'</div><div class="metricfoot">Only trades with valid initial risk</div></div></div></div>')+'</div><div>'+panel('Win / loss distribution','Breakeven trades are separate','<div class="panelbody"><div style="display:flex;justify-content:space-between;align-items:end;margin-top:4px"><div><div class="metricvalue positive" style="font-size:25px">'+wins+'</div><div class="metricfoot">Winning trades</div></div><div style="text-align:right"><div class="metricvalue negative" style="font-size:25px">'+loss+'</div><div class="metricfoot">Losing trades</div></div></div><div class="splitbar"><span style="width:'+(s.c.length?wins/s.c.length*100:0)+'%"></span><span style="width:'+(s.c.length?loss/s.c.length*100:0)+'%"></span></div><div class="splitlabels"><span>'+pct(s.winRate)+' wins</span><span>'+s.c.filter(t=>t.net===0).length+' breakeven</span></div><div class="minirow" style="margin-top:13px"><div class="miniicon">↗</div><div class="minimain"><b>Long vs short</b><small>Closed trades by direction</small></div><div class="minivalue">'+list.filter(t=>t.status==='Closed'&&t.side==='Long').length+' / '+list.filter(t=>t.status==='Closed'&&t.side==='Short').length+'</div></div><div class="minirow"><div class="miniicon">◷</div><div class="minimain"><b>Open positions</b><small>Excluded from realized P&L</small></div><div class="minivalue">'+open.length+'</div></div><div class="minirow"><div class="miniicon">＄</div><div class="minimain"><b>Fees paid</b><small>Closed trades only</small></div><div class="minivalue">'+money(s.fees)+'</div></div></div>')+'</div></div><div class="grid sectiongrid"><div>'+panel('Recent trades','Latest activity · select a row to inspect',tradesTable(list,6),'<button class="inline-link" data-action="goto-trades">View all →</button>')+'</div><div>'+panel('Setup comparison','Sample size shown for context','<div class="panelbody">'+setupsStats.map(x=>'<div class="minirow"><div class="minimain"><b>'+safe(x.name)+'</b><small>'+x.c.length+' closed · '+x.wins.length+' wins</small><div class="progress"><span style="width:'+x.winRate+'%"></span></div></div><div class="minivalue">'+(x.c.length?money(x.sum):'—')+'</div></div>').join('')+'<p class="metricfoot" style="margin-top:12px">Small samples are not reliable evidence of an edge.</p></div>')+'</div></div><div class="grid twocol"><div>'+panel('Evidence, not guesses','Insights tied to this filtered sample','<div class="panelbody"><div class="insight"><b>Review your largest losses</b><p>'+s.loss.length+' losing trades in this demo sample. Open a trade to review its plan, fees, and notes. This is not a live performance diagnosis.</p></div><div class="insight"><b>Check setup sample sizes</b><p>Compare setup results alongside their trade counts and consistent filters before drawing conclusions.</p></div></div>')+'</div><div>'+panel('Journal quality','Data coverage in this demo','<div class="panelbody"><div class="minirow"><div class="minimain"><b>Trade timestamps</b><small>Stored as demo-local dates</small></div><span class="tag warn">Demo</span></div><div class="minirow"><div class="minimain"><b>Entry-time market snapshots</b><small>Not provided in sample data</small></div><span class="tag warn">Unknown</span></div><div class="minirow"><div class="minimain"><b>Broker sync</b><small>No provider connected</small></div><span class="tag warn">Unavailable</span></div></div>')+'</div></div>'}
function calendarPage(){let list=filtered(),month=calendarMonth.getMonth(),year=calendarMonth.getFullYear(),first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate(),prev=new Date(year,month,0).getDate(),cells=[];for(let i=0;i<42;i++){let day,dt,other=false;if(i<first){day=prev-first+i+1;dt=new Date(year,month-1,day);other=true}else if(i>=first+days){day=i-first-days+1;dt=new Date(year,month+1,day);other=true}else{day=i-first+1;dt=new Date(year,month,day)}let key=dateISO(dt),ts=list.filter(t=>t.date===key&&t.status==='Closed'),sum=ts.reduce((a,t)=>a+t.net,0),op=list.some(t=>t.date===key&&t.status==='Open');cells.push('<button class="day '+(other?'mutedday ':'')+(selectedDay===key?'selected':'')+'" data-day="'+key+'"><span class="daynum">'+day+'</span>'+(ts.length?'<span class="daypnl '+(sum>=0?'positive':'negative')+'">'+(sum<0?'−':'')+'$'+fmt(Math.abs(sum),0)+'</span><span class="daycount">'+ts.length+' trade'+(ts.length===1?'':'s')+'</span>':'')+(op?'<span class="daycount">● Open</span>':'')+'</button>')}let chosen=list.filter(t=>t.date===selectedDay);return head('JOURNAL / CALENDAR','Your month, trade by trade.','Review daily results alongside notes, plans, and open positions.',btn('Today','calendar-today','subtle'))+filterBar()+'<div class="grid sectiongrid"><div>'+panel('<span id="monthlabel">'+calendarMonth.toLocaleDateString('en-US',{month:'long',year:'numeric'})+'</span>','Daily realized net P&L · open positions marked separately','<div class="calendar"><div class="calhead">'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>'<div>'+x+'</div>').join('')+'</div><div class="calgrid">'+cells.join('')+'</div></div>','<div class="toolbar"><button class="iconbtn" data-action="month-prev" aria-label="Previous month">‹</button><button class="iconbtn" data-action="month-next" aria-label="Next month">›</button></div>')+'</div><div>'+panel('Day review',fmtDate(selectedDay),'<div class="panelbody"><div class="grid twocol" style="gap:8px;margin-bottom:10px"><div class="reportcard"><span class="metriclabel">Net P&L</span><b class="'+(chosen.reduce((a,t)=>a+(t.status==='Closed'?t.net:0),0)>=0?'positive':'negative')+'">'+money(chosen.reduce((a,t)=>a+(t.status==='Closed'?t.net:0),0))+'</b></div><div class="reportcard"><span class="metriclabel">Closed trades</span><b>'+chosen.filter(t=>t.status==='Closed').length+'</b></div></div><div class="metriclabel" style="margin:12px 0">Trades on this day</div>'+(chosen.length?chosen.map(t=>'<div class="minirow" data-trade="'+t.id+'" style="cursor:pointer"><div class="miniicon">'+t.symbol.slice(0,1)+'</div><div class="minimain"><b>'+t.symbol+' · '+t.side+'</b><small>'+t.setup+' · '+t.status+'</small></div><div class="minivalue '+(t.status==='Open'?'neutral':t.net>=0?'positive':'negative')+'">'+(t.status==='Open'?'Open':money(t.net))+'</div></div>').join(''):'<div class="empty"><b>No trades on this date</b>Use notes to record your plan or daily review.</div>')+'<div style="margin-top:17px"><div class="field"><label for="daynote">Daily plan / review note</label><textarea id="daynote" placeholder="What was the plan? What did you learn?">'+safe(notes.find(n=>n.date===selectedDay)?.text||'')+'</textarea></div><button class="btn primary" style="margin-top:10px" data-action="save-daynote">Save day note</button></div></div>')+'</div></div>'}
function tradesPage(){let list=filtered();if(tradeQuery){let q=tradeQuery.toLowerCase();list=list.filter(t=>[t.symbol,t.id,t.setup,t.side,t.status,...t.tags].join(' ').toLowerCase().includes(q))}if(tradeTab==='Open positions')list=list.filter(t=>t.status==='Open');if(tradeTab==='Needs review')list=list.filter(t=>t.adherence==='Poor'||t.grade==='B setup');let s=stats(list);return head('YOUR RECORD','Every trade has a story.','Search, filter, and inspect each trade from entry plan to realized result.',btn('＋ Add trade','new-trade','primary'))+filterBar()+'<div class="grid metrics">'+metric('Matched trades',list.length,'After current filters')+metric('Net realized P&L',money(s.sum),'Closed only',s.sum>=0?'positive':'negative')+metric('Win rate',pct(s.winRate),'Closed trade denominator')+metric('Open positions',list.filter(t=>t.status==='Open').length,'Unrealized P&L kept separate')+metric('Needs review',list.filter(t=>t.adherence==='Poor'||t.grade==='B setup').length,'Review markers are illustrative')+'</div><section class="panel widepanel"><div class="panelhead"><div><div class="paneltitle">Trade ledger</div><div class="paneldesc">Choose a trade to open its full record, risk, notes, and history.</div></div><div class="toolbar"><input class="searchbox" id="tradeSearch" placeholder="Search symbol, setup, ID…" value="'+safe(tradeQuery)+'"><button class="btn subtle" data-action="export-csv">Export CSV</button></div></div><div class="tabs">'+['All trades','Open positions','Needs review'].map(t=>'<button class="'+(tradeTab===t?'active':'')+'" data-tradetab="'+t+'">'+t+'</button>').join('')+'</div>'+tradesTable(list,100)+'<div class="tablefoot"><span>'+list.length+' records · synthetic demo data</span><span>Net P&L excludes open positions</span></div></section>'}
function tradeDetail(t){let open=t.status==='Open';return '<div class="modalback" id="detailBack"><div class="modal"><div class="modalhead"><div><div class="eyebrow">TRADE RECORD / '+t.id+'</div><b style="font-size:17px">'+t.symbol+' · '+t.side+'</b></div><button class="iconbtn" data-action="close-modal" aria-label="Close">×</button></div><div class="detailhero"><div><div class="muted">'+fmtDate(t.date)+' · '+t.duration+' min duration'+(open?' · Open position':'')+'</div><h2>'+t.symbol+' <span class="tag">'+t.setup+'</span></h2><div class="sub">'+t.account+' · '+t.source+'</div></div><div style="text-align:right"><div class="bigpnl '+(open?'neutral':t.net>=0?'positive':'negative')+'">'+(open?'Unrealized n/a':money(t.net))+'</div><div class="metricfoot">'+(open?'Quote unavailable': 'Net realized after '+money(t.fees)+' fees')+'</div></div></div><div class="detailstats"><div class="detailstat"><small>Gross P&L</small><b class="'+(t.gross>=0?'positive':'negative')+'">'+(open?'—':money(t.gross))+'</b></div><div class="detailstat"><small>Realized R</small><b>'+(t.r===null?'Unknown':fmt(t.r,2)+'R')+'</b></div><div class="detailstat"><small>Initial risk</small><b>'+money(t.initialRisk)+'</b></div><div class="detailstat"><small>Quantity</small><b>'+t.qty+'</b></div><div class="detailstat"><small>Entry average</small><b>$'+fmt(t.entry)+'</b></div><div class="detailstat"><small>Exit average</small><b>'+(open?'—':'$'+fmt(t.exit))+'</b></div></div><div class="tabs" id="detailTabs">'+['Overview','Plan & review','Execution','Market context','History'].map((x,i)=>'<button data-detailtab="'+x+'" class="'+(i===0?'active':'')+'">'+x+'</button>').join('')+'</div><div class="modalbody" id="detailBody">'+detailTabContent(t,'Overview')+'</div></div></div>'}
function detailTabContent(t,tab){if(tab==='Overview')return '<div class="kicker">Trade facts</div><div class="kv"><div><small>Opened (UTC)</small><b>'+t.createdAt+'</b></div><div><small>Last updated (UTC)</small><b>'+t.updatedAt+'</b></div><div><small>Side</small><b>'+t.side+'</b></div><div><small>Status</small><b>'+t.status+'</b></div><div><small>Stop loss</small><b>$'+fmt(t.stop)+'</b></div><div><small>Target</small><b>$'+fmt(t.target)+'</b></div><div><small>Planned reward:risk</small><b>'+t.plannedRR.toFixed(1)+':1</b></div><div><small>Exit reason</small><b>'+(t.status==='Open'?'Not exited':'Demo exit · not broker-verified')+'</b></div></div><div class="notice" style="margin-top:15px"><strong>Data provenance:</strong> synthetic demonstration record. Fills, broker timestamps, market snapshots, MAE/MFE and execution efficiency are not available and are not inferred.</div>';
if(tab==='Plan & review')return '<div class="field"><label>Trade thesis</label><textarea id="editThesis">'+safe(t.thesis)+'</textarea></div><div class="formgrid" style="margin-top:12px"><div class="field"><label>Emotional state</label><select id="editEmotion">'+['Focused','Confident','Anxious','FOMO','Frustrated','Tired'].map(x=>'<option '+(t.emotions===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>Rule adherence</label><select id="editAdherence">'+['Good','Average','Poor','Unknown'].map(x=>'<option '+(t.adherence===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div></div><div class="field" style="margin-top:12px"><label>Review notes</label><textarea id="editNotes">'+safe(t.notes)+'</textarea></div><button class="btn primary" style="margin-top:12px" data-action="save-trade-review" data-id="'+t.id+'">Save review</button>';
if(tab==='Execution')return '<div class="empty"><b>No fill ledger available</b>This synthetic record has no imported executions or partial-fill allocations. Slippage and execution quality remain unknown rather than zero.</div>';

return '<div class="kv"><div><small>Created</small><b>'+t.createdAt+'</b></div><div><small>Updated</small><b>'+t.updatedAt+'</b></div><div><small>Source</small><b>'+t.source+'</b></div><div><small>Revision log</small><b>Local demo only</b></div></div><p class="muted" style="font-size:11px">A production audit history requires persisted, immutable change events. This preview stores no audit log.</p>'}
function analyticsPage(){let list=filtered(),s=stats(list),tabs=['Performance','Risk & R','Time','Symbols','Setups & conditions','Costs & execution','Long vs short','Behavior'];let body='';if(analyticsTab==='Performance')body='<div class="grid metrics">'+metric('Net realized P&L',money(s.sum),'After fees',s.sum>=0?'positive':'negative')+metric('Profit factor',s.pf===null?'—':fmt(s.pf,2),'Gross wins / absolute losses')+metric('Expectancy',money(s.expect),'Per closed trade')+metric('Win rate',pct(s.winRate),s.c.length+' closed trades')+metric('Average R',s.avgR===null?'—':fmt(s.avgR,2)+'R','Valid initial risk only')+'</div><div class="grid twocol"><div>'+panel('Equity curve','Realized net P&L', '<div class="panelbody">'+lineChart(list)+'</div>')+'</div><div>'+panel('Outcome quality','Closed trades only','<div class="panelbody"><div class="kv"><div><small>Wins</small><b class="positive">'+s.wins.length+'</b></div><div><small>Losses</small><b class="negative">'+s.loss.length+'</b></div><div><small>Breakeven</small><b>'+s.c.filter(t=>t.net===0).length+'</b></div><div><small>Fees</small><b>'+money(s.fees)+'</b></div><div><small>Max drawdown</small><b>—</b></div><div><small>Recovery factor</small><b>—</b></div></div><p class="metricfoot">Advanced risk metrics need validated, complete equity and cash-flow history.</p></div>')+'</div></div>';

else if(analyticsTab==='Long vs short')body='<div class="grid twocol">'+['Long','Short'].map(side=>{let z=stats(list.filter(t=>t.side===side));return panel(side+' trades',z.c.length+' closed trades','<div class="panelbody"><div class="metricvalue '+(z.sum>=0?'positive':'negative')+'">'+money(z.sum)+'</div><div class="kv"><div><small>Win rate</small><b>'+pct(z.winRate)+'</b></div><div><small>Profit factor</small><b>'+(z.pf===null?'—':fmt(z.pf,2))+'</b></div></div></div>')}).join('')+'</div>';
else body='<div class="grid twocol">'+panel('Process review','Rule adherence & emotional state','<div class="panelbody"><div class="kv"><div><small>Marked good</small><b>'+list.filter(t=>t.adherence==='Good').length+'</b></div><div><small>Marked poor</small><b>'+list.filter(t=>t.adherence==='Poor').length+'</b></div><div><small>Tagged trades</small><b>'+list.filter(t=>t.tags.length).length+'</b></div><div><small>Unreviewed / unknown</small><b>'+list.filter(t=>t.adherence==='Unknown').length+'</b></div></div></div>')+panel('Behavioral journal','User-entered, not inferred','<div class="panelbody"><div class="empty"><b>Keep context attached to each trade</b>Record focus, emotions, thesis, tags and rule adherence in the trade detail.</div><button class="btn subtle" data-action="goto-trades">Review trades</button></div>')+'</div>';
return head('JOURNAL / ANALYTICS','Find the pattern. Test the evidence.','Explore performance, risk, time, symbols, execution, and process.')+filterBar()+'<section class="panel"><div class="tabs">'+tabs.map(t=>'<button data-analyticstab="'+t+'" class="'+(analyticsTab===t?'active':'')+'">'+t+'</button>').join('')+'</div><div style="padding:18px">'+body+'</div></section><p class="metricfoot" style="margin-top:12px">Every metric uses the selected filters. Synthetic demo data is for interface testing only.</p>'}
function symbolTable(list){let syms=[...new Set(list.map(t=>t.symbol))];return '<div class="tablewrap"><table class="table"><thead><tr><th>Symbol</th><th>Trades</th><th>Net P&L</th><th>Win rate</th><th>Profit factor</th><th>Average R</th></tr></thead><tbody>'+syms.map(sym=>{let s=stats(list.filter(t=>t.symbol===sym));return '<tr><td><b>'+sym+'</b></td><td>'+s.c.length+'</td><td class="'+(s.sum>=0?'positive':'negative')+'">'+money(s.sum)+'</td><td>'+pct(s.winRate)+'</td><td>'+(s.pf===null?'—':fmt(s.pf,2))+'</td><td>'+(s.avgR===null?'—':fmt(s.avgR,2)+'R')+'</td></tr>'}).join('')+'</tbody></table></div>'}
function setupTable(list){return '<div class="tablewrap"><table class="table"><thead><tr><th>Setup</th><th>Closed</th><th>Wins</th><th>Win rate</th><th>Net P&L</th><th>Avg R</th><th>Conditions</th></tr></thead><tbody>'+setups.map(name=>{let s=stats(list.filter(t=>t.setup===name));return '<tr><td><b>'+name+'</b></td><td>'+s.c.length+'</td><td>'+s.wins.length+'</td><td>'+pct(s.winRate)+'</td><td class="'+(s.sum>=0?'positive':'negative')+'">'+money(s.sum)+'</td><td>'+(s.avgR===null?'—':fmt(s.avgR,2)+'R')+'</td><td><span class="tag warn">Unknown</span></td></tr>'}).join('')+'</tbody></table></div>'}
function setupsPage(){return head('JOURNAL / SETUPS','Know the setup, not just the ticker.','Compare strategy playbooks and review the conditions you recorded at entry.',btn('Review trades','goto-trades','subtle'))+'<div class="notice"><strong>Condition data is not fabricated.</strong> This demo does not include verified entry-time technical snapshots, so alignment is shown as unknown rather than assumed.</div><div class="grid twocol">'+setups.map((s,i)=>{let list=filtered().filter(t=>t.setup===s),st=stats(list);return '<section class="panel"><div class="panelhead"><div><div class="paneltitle">'+s+'</div><div class="paneldesc">'+list.length+' demo trades · '+st.c.length+' closed</div></div><span class="pill">Setup '+String.fromCharCode(65+i)+'</span></div><div class="panelbody"><div class="grid twocol" style="margin-bottom:12px"><div><div class="metriclabel">Net P&L</div><div class="metricvalue" style="font-size:21px">'+money(st.sum)+'</div></div><div><div class="metriclabel">Win rate</div><div class="metricvalue" style="font-size:21px">'+pct(st.winRate)+'</div></div></div><div class="kv"><div><small>Profit factor</small><b>'+(st.pf===null?'—':fmt(st.pf,2))+'</b></div><div><small>Average R</small><b>'+(st.avgR===null?'—':fmt(st.avgR,2)+'R')+'</b></div><div><small>Entry conditions</small><b>Unknown</b></div><div><small>Sample quality</small><b>'+(st.c.length<20?'Small sample':'Review distribution')+'</b></div></div><button class="btn subtle" style="margin-top:14px" data-setup="'+s+'">View matching trades</button></div></section>'}).join('')+'</div>'}
function notesPage(){return head('JOURNAL / NOTES','The thinking behind the trades.','Keep daily plans, lessons, and process reviews close to the record.',btn('＋ New note','new-note','primary'))+'<div class="grid sectiongrid"><div>'+panel('Create a note','Daily plan, post-market review, or lesson','<div class="panelbody"><div class="formgrid"><div class="field"><label for="noteDate">Date</label><input id="noteDate" type="date" value="'+iso+'"></div><div class="field"><label for="noteType">Note type</label><select id="noteType"><option>Daily plan</option><option>Daily review</option><option>Lesson learned</option><option>Weekly review</option></select></div><div class="field full"><label for="noteTitle">Title</label><input id="noteTitle" placeholder="What do you want to remember?"></div><div class="field full"><label for="noteText">Notes</label><textarea id="noteText" placeholder="Write your plan, context, mistakes, or lessons…"></textarea></div></div><button class="btn primary" style="margin-top:14px" data-action="save-note">Save note</button></div>')+'</div><div>'+panel('Saved notes','Stored locally in this browser','<div class="panelbody">'+(notes.length?notes.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(n=>'<div class="insight"><div class="metriclabel">'+fmtDate(n.date)+' · '+safe(n.type)+'</div><b>'+safe(n.title||'Untitled note')+'</b><p>'+safe(n.text).slice(0,260)+'</p><button class="inline-link" data-note="'+n.id+'">Open / edit</button> · <button class="inline-link" data-delete-note="'+n.id+'">Delete</button></div>').join(''):'<div class="empty"><b>No saved notes yet</b>Your notes stay in this browser and are not synced to an account.</div>')+'</div>')+'</div></div>'}
function reportsPage(){return head('JOURNAL / REPORTS','Take your journal with you.','Export the currently filtered trade records or prepare a review summary.')+filterBar()+'<div class="grid threecol"><div class="reportcard"><div class="kicker">01 / Data</div><b>Trade ledger CSV</b><p>Export matching records, with open positions clearly marked and no fabricated quote values.</p><button class="btn primary" data-action="export-csv">Export CSV</button></div><div class="reportcard"><div class="kicker">02 / Review</div><b>Performance snapshot</b><p>Download a compact text report of metrics for the current filter selection.</p><button class="btn subtle" data-action="export-report">Export summary</button></div><div class="reportcard"><div class="kicker">03 / Advanced</div><b>Benchmark & Monte Carlo</b><p>Not enabled in this demo. These require synchronized benchmark series or validated trade/R data and disclosed assumptions.</p><span class="tag warn">Not available</span></div></div><div class="notice" style="margin-top:16px"><strong>Privacy:</strong> this prototype keeps notes and theme in local browser storage. It does not upload trades or connect to a broker.</div>'}
function settingsPage(){return head('JOURNAL / SETTINGS','Make the journal yours.','Manage display preferences and inspect what this demo does—and does not—connect to.')+'<div class="grid sectiongrid"><div>'+panel('Appearance','Comfortable in light or dark environments','<div class="panelbody"><div class="minirow"><div class="minimain"><b>Theme</b><small>Applies across the Journal</small></div><select id="themeSelect" class="searchbox"><option value="dark" '+(theme==='dark'?'selected':'')+'>Dark</option><option value="light" '+(theme==='light'?'selected':'')+'>Light</option></select></div><div class="minirow"><div class="minimain"><b>Display timezone</b><small>Production timezone selection is not connected</small></div><span class="tag warn">Browser local</span></div><div class="minirow"><div class="minimain"><b>Currency</b><small>Demo uses USD</small></div><span class="tag">USD · $</span></div></div>')+'</div><div>'+panel('Data & connections','Current demo status','<div class="panelbody"><div class="minirow"><div class="minimain"><b>Broker connections</b><small>No provider configured</small></div><span class="tag warn">Not connected</span></div><div class="minirow"><div class="minimain"><b>Cloud sync</b><small>Data stays in this session except notes/theme</small></div><span class="tag warn">Unavailable</span></div><div class="minirow"><div class="minimain"><b>Demo trades</b><small>Illustrative sample, not user records</small></div><span class="tag warn">Synthetic</span></div><button class="btn subtle" data-action="reset-demo" style="margin-top:13px">Reset demo workspace</button></div>')+'</div></div><div class="panel widepanel"><div class="panelhead"><div><div class="paneltitle">Product integrity</div><div class="paneldesc">Capabilities that require a connected production data layer</div></div></div><div class="panelbody"><div class="grid twocol"><div class="minirow"><div class="minimain"><b>Fills and partial allocations</b><small>Needs canonical execution ledger</small></div><span class="tag warn">Unavailable</span></div><div class="minirow"><div class="minimain"><b>Entry-time market snapshots</b><small>Must be time-valid and sourced</small></div><span class="tag warn">Unavailable</span></div><div class="minirow"><div class="minimain"><b>Sync health & data-quality warnings</b><small>Requires a real connector</small></div><span class="tag warn">Demo only</span></div><div class="minirow"><div class="minimain"><b>Audit history</b><small>Requires persisted revision events</small></div><span class="tag warn">Unavailable</span></div></div></div></section>'}
function render(){let html='';switch(page){case'home':html=homePage();break;case'overview':html=overview();break;case'calendar':html=calendarPage();break;case'trades':html=tradesPage();break;case'analytics':html=analyticsPage();break;case'setups':html=setupsPage();break;case'notes':html=notesPage();break;case'reports':html=reportsPage();break;case'settings':html=settingsPage();break;case'more':moreOpen=true;html=head('WORKSPACE','More Journal tools.','Choose a workspace section.')+'<div class="grid twocol">'+[['setups','Setups & conditions','Review setup definitions and sample sizes.'],['notes','Notes & reviews','Keep daily plans and lessons.'],['reports','Reports & export','Export filtered records.'],['settings','Settings','Theme and connection status.']].map(x=>'<button class="panel reportcard" data-page="'+x[0]+'" style="text-align:left;color:var(--text)"><b>'+x[1]+'</b><p>'+x[2]+'</p><span class="inline-link">Open →</span></button>').join('')+'</div>';break}$('#content').innerHTML=html;$('.app').classList.toggle('station-home',page==='home');if($('#crumb'))$('#crumb').textContent=({home:'Trade-Disk home',overview:'Journal overview',calendar:'Journal calendar',trades:'Trade ledger',analytics:'Journal analytics',setups:'Setups & conditions',notes:'Notes & reviews',reports:'Reports & export',settings:'Journal settings',more:'More'})[page]||'Journal';$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#mobileNav').classList.toggle('hidden',false);if($('#themeBtn'))$('#themeBtn').textContent=theme==='dark'?'☼':'☾'}
function navigate(p){page=p;moreOpen=false;render();window.scrollTo({top:0,behavior:'smooth'})}
function toast(msg){$('#toastroot').innerHTML='<div class="toast" role="status">'+safe(msg)+'</div>';clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toastroot').innerHTML='',2800)}
function openTrade(id){let t=trades.find(t=>t.id===id);if(!t)return;detailId=id;$('#modalroot').innerHTML=tradeDetail(t)}
function csvEscape(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function exportCSV(){let list=filtered();let cols=['id','date','symbol','side','setup','qty','entry','exit','status','gross','fees','net','r','initialRisk','duration','adherence','source'];let data=[cols.join(','),...list.map(t=>cols.map(k=>csvEscape(t[k])).join(','))].join('\r\n');download('trade-disk-journal-demo.csv',data,'text/csv');toast('CSV export created for '+list.length+' matching records.')}
function exportReport(){let s=stats(filtered());let data='TRADE-DISK JOURNAL — DEMO SUMMARY\nPeriod: '+filters.period+'\nAccount: '+filters.account+'\nSetup: '+filters.setup+'\nSymbol: '+(filters.symbol||'All')+'\n\nClosed trades: '+s.c.length+'\nOpen trades: '+filtered().filter(t=>t.status==='Open').length+'\nNet realized P&L: '+money(s.sum)+'\nWin rate: '+pct(s.winRate)+'\nProfit factor: '+(s.pf===null?'—':fmt(s.pf,2))+'\nExpectancy: '+money(s.expect)+'\nFees: '+money(s.fees)+'\n\nAll figures are synthetic demo data, not actual trading performance.\n';download('trade-disk-journal-summary.txt',data,'text/plain');toast('Summary report exported.')}
function download(name,data,type){const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function newTrade(){ $('#modalroot').innerHTML='<div class="modalback"><div class="modal"><div class="modalhead"><div><div class="eyebrow">JOURNAL / CAPTURE</div><b style="font-size:17px">Add a demo trade</b></div><button class="iconbtn" data-action="close-modal">×</button></div><div class="modalbody"><div class="notice"><strong>Prototype only.</strong> This creates a local synthetic journal record. It does not place orders or connect to a broker.</div><form id="newTradeForm"><div class="formgrid"><div class="field"><label>Symbol</label><input name="symbol" required maxlength="12" placeholder="AAPL"></div><div class="field"><label>Trade date</label><input type="date" name="date" value="'+iso+'" required></div><div class="field"><label>Side</label><select name="side"><option>Long</option><option>Short</option></select></div><div class="field"><label>Setup</label><select name="setup">'+setups.map(s=>'<option>'+s+'</option>').join('')+'</select></div><div class="field"><label>Quantity</label><input name="qty" type="number" min=".001" step=".001" value="1" required></div><div class="field"><label>Entry average</label><input name="entry" type="number" min=".0001" step=".0001" required placeholder="100.00"></div><div class="field"><label>Exit average (leave blank if open)</label><input name="exit" type="number" min=".0001" step=".0001" placeholder="Optional"></div><div class="field"><label>Initial risk per share</label><input name="risk" type="number" min=".0001" step=".0001" placeholder="Required for R"></div><div class="field full"><label>Thesis / notes</label><textarea name="notes" placeholder="Why did you take this trade?"></textarea></div></div><button class="btn primary" style="margin-top:16px" type="submit">Save demo trade</button></form></div></div></div>'}
function saveNew(form){let f=new FormData(form),symbol=String(f.get('symbol')).trim().toUpperCase(),qty=Number(f.get('qty')),entry=Number(f.get('entry')),exit=f.get('exit')?Number(f.get('exit')):null,risk=Number(f.get('risk'))||null,side=f.get('side'),status=exit===null?'Open':'Closed';if(!symbol||!Number.isFinite(qty)||qty<=0||!Number.isFinite(entry)||entry<=0||(exit!==null&&(!Number.isFinite(exit)||exit<=0))){toast('Please check symbol, quantity and prices.');return}let gross=exit===null?0:(exit-entry)*qty*(side==='Long'?1:-1),fees=exit===null?0:Math.max(.3,qty*.035),net=gross-fees,t={id:'TD-'+Date.now().toString().slice(-7),symbol,side,setup:f.get('setup'),qty,entry,exit,risk,date:f.get('date'),status,grade:'Unreviewed',adherence:'Unknown',fees,net,gross,r:risk&&exit!==null?net/(risk*qty):null,account:'Demo account',duration:0,tags:[],source:'Manual demo entry',thesis:'',notes:f.get('notes')||'',stop:risk?(side==='Long'?entry-risk:entry+risk):null,target:risk?(side==='Long'?entry+risk*2:entry-risk*2):null,plannedRR:risk?2:null,initialRisk:risk?risk*qty:null,emotions:'Unknown',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),fills:[],entrySnapshot:null};trades.unshift(t);persistTrades();$('#modalroot').innerHTML='';navigate('trades');toast('Trade saved in this browser.')}
document.addEventListener('click',e=>{let p=e.target.closest('[data-page]');if(p){navigate(p.dataset.page);return}let tr=e.target.closest('[data-trade]');if(tr){openTrade(tr.dataset.trade);return}let day=e.target.closest('[data-day]');if(day){selectedDay=day.dataset.day;render();return}let sort=e.target.closest('[data-sort]');if(sort){sortDir=sortKey===sort.dataset.sort?-sortDir:-1;sortKey=sort.dataset.sort;render();return}let at=e.target.closest('[data-action]');if(at){let a=at.dataset.action;switch(a){case'goto-trades':navigate('trades');break;case'reset-filters':filters={period:'30d',account:'all',setup:'all',symbol:'',status:'all'};render();break;case'new-trade':case'newTrade':newTrade();break;case'close-modal':$('#modalroot').innerHTML='';break;case'export-csv':exportCSV();break;case'export-report':exportReport();break;case'month-prev':calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()-1,1);render();break;case'month-next':calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+1,1);render();break;case'calendar-today':calendarMonth=new Date(today.getFullYear(),today.getMonth(),1);selectedDay=iso;render();break;case'save-daynote':{let text=$('#daynote').value,old=notes.find(n=>n.date===selectedDay);if(old)old.text=text;else notes.push({id:'N-'+Date.now(),date:selectedDay,type:'Daily review',title:'Day review',text});writeStore('td-notes',notes);toast('Daily note saved in this browser.');break}case'save-note':{let date=$('#noteDate').value||iso,type=$('#noteType').value,title=$('#noteTitle').value||'Untitled note',text=$('#noteText').value;if(!text.trim()){toast('Add a note before saving.');break}if(editingNoteId){let existing=notes.find(n=>n.id===editingNoteId);if(existing)Object.assign(existing,{date,type,title,text,updatedAt:new Date().toISOString()});else notes.unshift({id:'N-'+Date.now(),date,type,title,text});editingNoteId=null}else notes.unshift({id:'N-'+Date.now(),date,type,title,text});writeStore('td-notes',notes);render();toast('Note saved locally.');break}case'reset-demo':if(confirm('Reset the illustrative trades and current filters? Your saved notes remain.')){trades=[...seed];persistTrades();filters={period:'30d',account:'all',setup:'all',symbol:'',status:'all'};render();toast('Demo trades reset.')}break;case'save-trade-review':{let t=trades.find(t=>t.id===at.dataset.id);if(t){t.thesis=$('#editThesis').value;t.notes=$('#editNotes').value;t.emotions=$('#editEmotion').value;t.adherence=$('#editAdherence').value;t.updatedAt=new Date().toISOString();persistTrades();$('#modalroot').innerHTML='';toast('Review saved in this browser.')}break}}return}let tt=e.target.closest('[data-tradetab]');if(tt){tradeTab=tt.dataset.tradetab;render();return}let tab=e.target.closest('[data-analyticstab]');if(tab){analyticsTab=tab.dataset.analyticstab;render();return}let dt=e.target.closest('[data-detailtab]');if(dt){$$('[data-detailtab]').forEach(b=>b.classList.toggle('active',b===dt));let t=trades.find(t=>t.id===detailId);$('#detailBody').innerHTML=detailTabContent(t,dt.dataset.detailtab);return}let setup=e.target.closest('[data-setup]');if(setup){filters.setup=setup.dataset.setup;navigate('trades');return}let del=e.target.closest('[data-delete-note]');if(del){notes=notes.filter(n=>n.id!==del.dataset.deleteNote);writeStore('td-notes',notes);render();toast('Note deleted.');return}let edit=e.target.closest('[data-note]');if(edit){let n=notes.find(n=>n.id===edit.dataset.note);if(n){editingNoteId=n.id;navigate('notes');$('#noteDate').value=n.date;$('#noteType').value=n.type;$('#noteTitle').value=n.title;$('#noteText').value=n.text;toast('Note loaded. Save to update it.')}return}});
document.addEventListener('change',e=>{if(e.target.matches('[data-filter]')){filters[e.target.dataset.filter]=e.target.value;render()}if(e.target.id==='themeSelect')setTheme(e.target.value)});
document.addEventListener('input',e=>{if(e.target.id==='tradeSearch'){tradeQuery=e.target.value;let pos=e.target.selectionStart;render();let el=$('#tradeSearch');el.focus();el.setSelectionRange(pos,pos)}if(e.target.id==='symbolFilter'){filters.symbol=e.target.value}});
document.addEventListener('submit',e=>{if(e.target.id==='newTradeForm'){e.preventDefault();saveNew(e.target)}});
function setTheme(v){theme=v;document.documentElement.dataset.theme=v;try{localStorage.setItem('td-theme',v)}catch{}render()}
$('#themeBtn').addEventListener('click',()=>setTheme(theme==='dark'?'light':'dark'));$('#newTradeBtn').addEventListener('click',newTrade);
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modalroot').innerHTML=''});
render();
})();
</script></body></html>
